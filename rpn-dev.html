  else { const t=prompt(`O ${r.estado==='PN'?'PN':'RPN'} ${r.numero} está em «${estTxt(r.estado)}». Vai ser apagado com anexos, mensagens e histórico, e não pode ser recuperado.\n\nPara confirmar, escreva o número ${r.numero}:`); if(t===null) return; if(String(t).trim()!==String(r.numero)) return toast('Número errado. Nada foi apagado.',true); }
  try {
    // anexos (ficheiros + registos), mensagens e histórico: apaga o que as permissões deixarem, antes do próprio RPN
    for (const sub of ['anexos','mensagens','historico']) { try { const sn=await getDocs(collection(db,'rpn',r.id,sub));
      for (const d of sn.docs) { if(sub==='anexos' && d.data().path) await deleteObject(sref(st,d.data().path)).catch(()=>{}); await deleteDoc(d.ref).catch(()=>{}); } } catch(e){ console.warn(sub,e); } }
    await runTransaction(db, async tx => {
      const cargaRef=doc(db,'config','cargaBO'); const cs=await tx.get(cargaRef);
      const carga={...(cs.data()?.carga||{})}, conf={...(cs.data()?.conf||{})};
      if (r.boUid && r.cargaContada) carga[r.boUid]=Math.max(0,(carga[r.boUid]||0)-r.cargaContada);
      if (r.confUid && r.confContada) conf[r.confUid]=Math.max(0,(conf[r.confUid]||0)-r.confContada);
      if ((r.boUid && r.cargaContada)||(r.confUid && r.confContada)) tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true});
      tx.delete(doc(db,'rpn',r.id));
    });
    if (r.propostaRef) { const irm=await irmaos(r).catch(()=>[]);   // sem mais RPN, a proposta fica outra vez livre
      await updateDoc(doc(db,'propostas',r.propostaRef), irm.length?{rpnId:irm[0].id,rpnNumero:irm.map(x=>x.numero).join(' + ')}:{rpnId:'',rpnNumero:''}).catch(()=>{}); }
    S.dirty=false; toast('RPN eliminado.'); location.hash='#/lista';
  } catch(e){ toast(errTxt(e),true); }
}

// preenche os campos vazios do cliente a partir da ficha (coleção clientesFicha, chave = NIF)
// índice de pesquisa de clientes (o mesmo da app Propostas): carregado uma vez por sessão, só quando é preciso
const semAcento = v => String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function carregarClientes(){
  if (S.cli) return S.cli;
  const col = collection(db,'clientes'); let docs = [];
  if (isStaff()) docs = (await getDocs(col)).docs;
  else if (S.me.vendedorPHC) docs = (await getDocs(query(col, where('vendedor','==',String(S.me.vendedorPHC))))).docs;
  S.cli = docs.flatMap(d => (d.data().lista||[]).map(c => ({nome:c.nome||'', nif:String(c.ncont||''), local:c.local||c.area||'', vend:c.vendnm||'', email:c.email||'', _n:semAcento(c.nome), _e:String(c.email||'').toLowerCase(), _t:String(c.tel||'').replace(/\D/g,'')})));
  return S.cli;
}
function procurarClientes(q){
  const t = semAcento(q).trim(); if (t.length<2 || !S.cli) return [];
  const dig = /^\d+$/.test(t.replace(/\s/g,'')) ? t.replace(/\s/g,'') : '';
  const pal = t.split(/\s+/);
  const ini=[], meio=[];
  for (const c of S.cli) {
    if (dig) { if (c.nif.startsWith(dig)) ini.push(c); else if (c.nif.includes(dig)) meio.push(c); }
    else if (c._n.startsWith(t)) ini.push(c);
    else if (pal.every(p=>c._n.includes(p)) || (t.length>=3 && c._e.includes(t))) meio.push(c);
    if (ini.length>=12) break;
  }
  return [...ini, ...meio].slice(0,12);
}
async function preencherCliente(r, substituir){
  const nif = String(r?.cliente?.nif||'').replace(/\s/g,''); if(nif.length<5) return false;
  try {
    const s = await getDoc(doc(db,'clientesFicha',nif)); if(!s.exists()) return false;
    const c = s.data(), k = r.cliente; let n = 0;
    const put = (o,f,v) => { if (substituir ? (String(o[f]||'')!==String(v||'')) : (v && !o[f])) { o[f]=String(v||''); n++; } };
    put(k,'nome',c.nome); put(k,'nCliente',c.no); put(k,'email',c.email); put(k,'interlocutor',c.contacto); put(k,'telefone',c.tlmvl||c.telefone);
    put(k,'morada1',c.morada); put(k,'localidade',c.local); put(k,'codPostal',c.codpost);
    r.contas = r.contas||{}; put(r.contas,'gsm',c.contaA);
    return n>0;
  } catch(e){ return false; }
}

// ---------- 9. LIGAÇÃO ÀS PROPOSTAS ( ?prop=<base64 JSON> ) ----------
function handlePropostaParam(){
  const u = new URL(location.href), raw = u.searchParams.get('prop'); if(!raw) return;
  u.searchParams.delete('prop'); history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams:'')+'#/novo');
  let p; try { const b64 = raw.replace(/-/g,'+').replace(/_/g,'/'); p = JSON.parse(decodeURIComponent(escape(atob(b64 + '==='.slice((b64.length+3)%4))))); } catch(e){ toast('Dados da proposta inválidos.',true); return; }
  const r = rpnVazio();
  const TIPO_TXT = {novo:'Novo Serviço', refid:'Refidelização', upgrade:'Upgrade'};
  const nova = p.tipo==='novo', upg = p.tipo==='upgrade';
  r.propostaRef = p.ref||''; r.cliente.nome = p.cliente||''; r.cliente.nif = String(p.nif||'').trim(); r.cliente.email = p.email||''; r.condicoes.resumo = p.notas||''; r.simulador = String(p.simulador||'');
  // BackOffice/Master a abrir a proposta de um comercial: o RPN fica em nome do comercial da proposta
  if (isBO() && p.comercial) { const v = Object.entries(S.users).find(([,u])=>(u.nome||'').trim().toLowerCase()===String(p.comercial).trim().toLowerCase()); if (v) { r.vendedorUid=v[0]; r.vendedorNome=v[1].nome; r.subSfid=v[1].sfid||''; } }
  // Formato da app de Propostas:  "912 345 678 TARIFÁRIO [24m] [REF_PHC]; 10× TARIFÁRIO [24m] [REF_PHC]"
  String(p.tarif||'').split(/;|\n|\|/).map(x=>x.trim()).filter(Boolean).forEach(sg=>{
    const br = [...sg.matchAll(/\[([^\]]+)\]/g)].map(x=>x[1].trim());
    const pz = br.find(b=>/^\d+\s*m$/i.test(b));
    const rf = br.filter(b=>!/^\d+\s*m$/i.test(b)).pop();
    let resto = sg.replace(/\[[^\]]+\]/g,'').trim(), qtd = 1, msisdn = '';
    const q = resto.match(/^(\d+)\s*[×x]\s+/i);
    if (q) { qtd = Math.min(Math.max(+q[1],1),300); resto = resto.slice(q[0].length); }
    else { const m = resto.match(/^(\d[\d ]{7,14}\d)\s+/); if (m && m[1].replace(/\s/g,'').length>=9) { msisdn = m[1].replace(/\s/g,''); resto = resto.slice(m[0].length); } }
    const pr = rf && S.prodMap[rf.toUpperCase()];
    const fixo = pr ? pr.categoria==='Fixo' : false;
    const l = linhaVazia();
    Object.assign(l, { designacao: resto.trim(), msisdn, upgrade: upg, prazo: pz ? parseInt(pz) : (+p.duracao||24),
      natureza: (nova?'Nova ':'Ref ') + (fixo?'Fixo':'Móvel') });
    if (composicaoDe(pr)) { for (let i=0;i<qtd;i++) r.linhas.push(...linhasDoProduto(l,pr)); return; }   // bundle: abre nas filhas
    if (pr) Object.assign(l, {ref:pr.ref, designacao:pr.designacao, tier:pr.tier, pricingPlan:pr.pricingPlan, descontinuado:pr.descontinuado});
    else l.ref = rf||'';
    for (let i=0;i<qtd;i++) r.linhas.push({...l});
  });
  const mens = parseFloat(String(p.mensalidade||'').replace(',','.'))||0;
  if (r.linhas.length===1 && mens) r.linhas[0].rlmc = mens;
  else if (mens && r.linhas.length && r.linhas[0].bGid && r.linhas.every(l=>l.bGid===r.linhas[0].bGid)) distribuir(r.linhas, mens);   // um único bundle: a mensalidade é a RLMC total
  r.propostaInfo = [TIPO_TXT[p.tipo]||p.tipo, mens?`mensalidade total ${eur(mens)} €`:'', p.duracao?`${p.duracao} meses`:'', p.comercial?`comercial: ${p.comercial}`:''].filter(Boolean).join(' · ');
  r.propostaTarif = String(p.tarif||'');
  S.pendingNovo = r;
  preencherCliente(r).then(ok=>{ if(ok && S.cur===r) drawFicha(); });
  // aviso de duplicado
  const q = isStaff() ? query(collection(db,'rpn'),where('propostaRef','==',r.propostaRef)) : query(collection(db,'rpn'),where('vendedorUid','==',S.me.uid),where('propostaRef','==',r.propostaRef));
  if (r.propostaRef) getDocs(q).then(s=>{ if(!s.empty) toast(`Atenção: já existe o RPN ${s.docs[0].data().numero} para esta proposta.`, true); }).catch(()=>{});
}

// ---------- 9c. PROJETOS: renegociação 6 meses antes do fim da fidelização ----------
// Um Projeto por cliente e por mês (projetos/{NIF}_{AAAA-MM}), para o vendedor que está na ficha do cliente nesse momento.
const PROPOSTAS_URL = 'propostas-dev.html';   // produção: propostas.html
const MANUAL_URL = 'manual-dev.html';   // produção: manual.html
const PROJ_ESTADOS = ['Por tratar','Em negociação','Ganho','Perdido','Adiado'];
const PROJ_PEND = ['Por tratar','Adiado'];   // ainda à espera de decisão (um adiado volta a contar quando a nova data chega)
const PROJ_ADIA_MAX = 180;   // dias, a contar da data de alerta original
const PROJ_PRAZOS = [12,18,24,30,36,48];
const PROJ_ANTECEDENCIA = 6;   // meses antes do fim do contrato
const somaMeses = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); };
const diaNoMes = (ym,d) => { const [y,m]=ym.split('-').map(Number); return ym+'-'+String(Math.min(d, new Date(y,m,0).getDate())).padStart(2,'0'); };   // dia 31 num mês de 30 → dia 30
const dataPN = r => String(r.fechadoEm||r.conferidoEm||r.data||'').slice(0,10);
const hojeLocal = () => { const d=new Date(); return mesLocal(d)+'-'+String(d.getDate()).padStart(2,'0'); };
async function gerarProjetos(M){
  const cand={};
  for (const P of PROJ_PRAZOS) {   // um PN com prazo P fechado no mês M−(P−6) chega aos 6 meses do fim no mês M
    const sn=await getDocs(query(collection(db,'rpn'), where('mesRef','==',somaMeses(M,-(P-PROJ_ANTECEDENCIA)))));
    sn.forEach(d=>{ const r=d.data(); if(!['PN','Concluído'].includes(r.estado)) return; const nif=String(r.cliente?.nif||'').trim(); if(!nif) return;
      (r.linhas||[]).forEach(l=>{ if((+l.prazo||0)===P) (cand[nif]=cand[nif]||[]).push({pnId:d.id, r, l, P}); }); });
  }
  const porVend={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.vendedorPHC && u.ativo!==false) porVend[String(u.vendedorPHC)]=uid; });
  const res={mes:M, clientes:Object.keys(cand).length, criados:0, jaHavia:0, semLinhas:0, semVendedor:0, tiradas:0, linhas:0}, ops=[];
  for (const nif of Object.keys(cand)) {
    const pid=nif+'_'+M;
    const [todos, ficha, ex] = await Promise.all([getDocs(query(collection(db,'rpn'), where('cliente.nif','==',nif))), getDoc(doc(db,'clientesFicha',nif)), getDoc(doc(db,'projetos',pid))]);
    if (ex.exists()) { res.jaHavia++; continue; }
    const outros=todos.docs.map(d=>({id:d.id, ...d.data()})).filter(x=>!['Cancelado','Reprovado'].includes(x.estado));
    const linhas=[];
    cand[nif].forEach(({pnId,r,l,P})=>{
      const dPN=dataPN(r), ms=normMsisdn(l.msisdn), temMs=ms.length>=9;
      // já renegociado (PN posterior) ou em negociação (RPN em curso) com o mesmo MSISDN → a linha não entra
      if (temMs && outros.some(x=>x.id!==pnId && (!FECHADOS.includes(x.estado) || dataPN(x)>dPN) && (x.msisdns||listaMsisdn(x.linhas)).includes(ms))) { res.tiradas++; return; }
      const dia=+dPN.slice(8,10)||1, mPN=r.mesRef||dPN.slice(0,7);
      linhas.push({ref:l.ref||'', designacao:l.designacao||'', msisdn:l.msisdn||'', natureza:l.natureza||'', rlmc:+l.rlmc||0, prazo:P, tier:l.tier||'', score:scoreLinha(l,r), bRef:l.bRef||'', bGid:l.bGid||'',
        pnId, pnNumero:r.numero||'', pnData:dPN, alerta:diaNoMes(M,dia), fim:diaNoMes(somaMeses(mPN,P),dia), confirmar:!temMs});
    });
    if (!linhas.length) { res.semLinhas++; continue; }
    linhas.sort((a,b)=>a.alerta.localeCompare(b.alerta)||String(a.pnNumero).localeCompare(String(b.pnNumero)));
    const f=ficha.exists()?ficha.data():null, cod=String(f?.vendedor||''), uid=porVend[cod]||null; if(!uid) res.semVendedor++;
    ops.push([pid,{nif, clienteNome:f?.nome||cand[nif][0].r.cliente?.nome||'', mes:M, alertaEm:linhas[0].alerta, fimEm:linhas.map(l=>l.fim).sort()[0],
      vendedorUid:uid, vendedorNome:uid?S.users[uid].nome:'', vendedorPHC:cod, linhas, nLinhas:linhas.length,
      totRLMC:Math.round(linhas.reduce((a,l)=>a+l.rlmc,0)*100)/100, totScore:Math.round(linhas.reduce((a,l)=>a+(+l.score||0),0)*1000)/1000,
      estado:'Por tratar', propostaId:'', motivoPerda:'', criadoEm:serverTimestamp(), criadoPor:S.me.uid}]);
    res.linhas+=linhas.length;
  }
  for (let i=0;i<ops.length;i+=300){ const b=writeBatch(db); ops.slice(i,i+300).forEach(([id,d])=>b.set(doc(db,'projetos',id),d)); await b.commit(); }
  res.criados=ops.length;
  await setDoc(doc(db,'config','projetos'),{gerados:{[M]:{em:new Date().toISOString(), por:S.me.nome, criados:res.criados}}},{merge:true});
  return res;
}
// à entrada: Master/Coordenador/BO geram o mês corrente (se faltar) e, a partir do dia 28, o mês seguinte; o comercial fica a saber quantos tem para tratar
// pendentes de um vendedor (ou de todos, para a chefia): «Por tratar» e «Adiado» — duas consultas simples, sem índice composto
async function projPendentes(){
  const col=collection(db,'projetos'), meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)];
  const sn=await Promise.all(PROJ_PEND.map(e=>getDocs(query(col, ...meu, where('estado','==',e)))));
  return sn.flatMap(x=>x.docs.map(d=>({id:d.id, ...d.data()})));
}
const projAtrasado = p => PROJ_PEND.includes(p.estado) && (p.alertaEm||'').slice(0,7) < mesLocal();           // alerta de um mês anterior, ainda sem decisão
const projParaHoje = p => PROJ_PEND.includes(p.estado) && (p.alertaEm||'') <= hojeLocal();
const diasAtraso = d => d ? Math.max(0, Math.round((new Date(hojeLocal()+'T12:00:00') - new Date(d+'T12:00:00'))/864e5)) : 0;
const mesTxt = ym => { const [y,m]=ym.split('-'); return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+m-1]+' de '+y; };
const navProj = () => (S.projAtr?` <b id="pj-a" title="Em atraso: de meses anteriores, ainda sem decisão" style="background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px">${S.projAtr} em atraso</b>`:'')
  + (S.projN?` <b id="pj-n" title="Para tratar este mês" style="background:#e5e7eb;color:#111;border-radius:10px;padding:1px 7px;font-size:11px">${S.projN}</b>`:'');
function contarProj(L){ const h=L.filter(projParaHoje), a=h.filter(projAtrasado).length, n=h.length-a; const mudou=a!==(S.projAtr||0)||n!==(S.projN||0); S.projAtr=a; S.projN=n; return mudou; }
// à entrada: Master/Coordenador/BO geram o mês corrente (se faltar) e, a partir do dia 28, o mês seguinte; o comercial fica a saber o que tem para tratar e o que está em atraso
async function projetosAoEntrar(){
  try {
    if (isStaff()) {
      const cur=mesLocal(), alvo=[cur]; if (new Date().getDate()>=28) alvo.push(somaMeses(cur,1));
      const g=(await getDoc(doc(db,'config','projetos'))).data()?.gerados||{};
      for (const M of alvo) if (!g[M]) { const x=await gerarProjetos(M); if (x.criados) toast(`Projetos de ${M.split('-').reverse().join('/')}: ${x.criados} criados para a equipa.`); }
    } else {
      const L=await projPendentes(), mudou=contarProj(L), livre=!S.dirty && !location.hash.startsWith('#/rpn/') && !location.hash.startsWith('#/novo');
      if (mudou && livre) render();
      const atr=L.filter(p=>projParaHoje(p)&&projAtrasado(p)).sort((a,b)=>(a.alertaEm||'').localeCompare(b.alertaEm||''));
      // aviso do dia: os Projetos que chegaram à data desde a última entrada (na primeira entrada de cada dia)
      const hj=hojeLocal(), kd='rpn-pj-visto-'+S.me.uid; let ult=''; try{ ult=localStorage.getItem(kd)||''; }catch(e){}
      const ontem=(()=>{ const d=new Date(hj+'T12:00:00'); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
      const desde=ult||ontem, soHoje=desde>=ontem;
      const novos=ult===hj?[]:L.filter(p=>!projAtrasado(p) && (p.alertaEm||'')>desde && (p.alertaEm||'')<=hj).sort((a,b)=>(a.alertaEm||'').localeCompare(b.alertaEm||''));
      const tb=(id,ps,atraso)=>`<div class="scroll" style="max-height:${atraso&&novos.length?180:300}px"><table id="${id}"><thead><tr><th>Alerta</th><th>Cliente</th><th class="num">Linhas</th><th class="num">${atraso?'Há':'RLMC €'}</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${fmtD(p.alertaEm)}</td><td><b>${esc(p.clienteNome)}</b></td><td class="num">${p.nLinhas||0}</td><td class="num">${atraso?diasAtraso(p.alertaEm)+' dias':eur(p.totRLMC)}</td></tr>`).join('')}</tbody></table></div>`;
      const mostrar=()=>{ modal(`${atr.length?`<h2 style="color:var(--red-d)">Tem ${atr.length} Projeto(s) em atraso</h2>
        <p class="muted" style="margin-top:0">São de meses anteriores e ainda não têm decisão. Cada um tem de ficar com proposta criada, adiado (com nova data) ou perdido (com motivo).</p>${tb('pj-av-t',atr,true)}`:''}
        ${novos.length?`<h2 id="pj-hj-h" style="${atr.length?'margin-top:16px':''}">${soHoje?`Hoje chegam à data ${novos.length} Projeto(s)`:`Chegaram à data ${novos.length} Projeto(s) desde ${fmtD(desde)}`}</h2>
        <p class="muted" style="margin-top:0">Faltam 6 meses para o fim da fidelização destes clientes. Já estão na lista «Para tratar».</p>${tb('pj-hj-t',novos,false)}`:''}
        <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" id="c">Fechar</button><button class="btn pri" id="ok">Ver os Projetos</button></div>`, (m,close)=>{
          m.querySelector('#c').onclick=close; m.querySelector('#ok').onclick=()=>{ close(); PJ.tab='tratar'; location.hash='#/projetos'; }; });
        try{ localStorage.setItem(kd,hj); }catch(e){} };
      if (!atr.length && !novos.length) { try{ localStorage.setItem(kd,hj); }catch(e){} }
      else if (livre) mostrar(); else S.avisoPend=mostrar;   // a meio de um RPN: o aviso aparece quando sair dele
    }
  } catch(e){ console.warn('Projetos:', e); }
}

function desenharProjetos(){
  if (!S.me || !location.hash.startsWith('#/projetos')) return;   // leitura terminada depois de mudar de página
  const m=$('#main'), h=hojeLocal(), stf=isStaff(), tratar=PJ.tab==='tratar';

    ls.push({ref, des:pr?.designacao||l.designacao||'', msisdn:normMsisdn(irm.map(x=>x.msisdn).find(Boolean)||''), prazo:l.prazo, desc:!!(pr?(pr.descontinuado||pr.inativo):true)}); });
  const d={id:p.id, cliente:p.clienteNome, nif:p.nif, comercial:p.vendedorNome||'', linhas:ls};
  return btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function gravarFicha(f, isNew){
  const nif=String(f.ncont), ref=doc(db,'clientesFicha',nif), uid=S.me.uid;
  return runTransaction(db, async tx => {
    const s=await tx.get(ref);
    if (isNew && s.exists()) { const e=new Error('NIF já existe'); e.code='ja-existe'; throw e; }
    const old=s.exists()?s.data():null, v=String(f.vendedor||''), entry=idxCli(f);
    let blk=(old&&old.blk)||'';
    if (old && blk && v===String(old.vendedor||'')) {
      const br=doc(db,'clientes',blk), bs=await tx.get(br), lista=bs.exists()?(bs.data().lista||[]):[];
      const i=lista.findIndex(x=>String(x.ncont)===nif); if(i>=0) lista[i]=entry; else lista.push(entry);
      tx.set(br,{vendedor:v, lista});
    } else {
      const nb=(v||'sem')+'_novos', nr=doc(db,'clientes',nb), ns=await tx.get(nr);
      let or=null, os=null; if (old && blk && blk!==nb) { or=doc(db,'clientes',blk); os=await tx.get(or); }
      const nl=ns.exists()?(ns.data().lista||[]).filter(x=>String(x.ncont)!==nif):[];
      nl.push(entry); tx.set(nr,{vendedor:v, lista:nl});
      if (os && os.exists()) tx.set(or,{vendedor:os.data().vendedor, lista:(os.data().lista||[]).filter(x=>String(x.ncont)!==nif)});
      blk=nb;
    }
    const data={...f, blk, atualizadoEm:serverTimestamp(), atualizadoPorUid:uid};
    if (!old) { data.criadoEm=serverTimestamp(); data.criadoPorUid=uid; data.origem='plataforma'; }
    tx.set(ref, data, {merge:true});
    return blk;
  });
}

async function cliAbrir(nif){
  const m=$('#main');

// processos do cliente: o comercial vê também os PN feitos por vendedores anteriores, desde que o cliente esteja hoje na sua carteira (só leitura)
async function cliRpns(nif){
  const col=collection(db,'rpn'), map=sn=>sn.docs.map(d=>({id:d.id, ...d.data()}));
  try { return map(await getDocs(query(col, where('cliente.nif','==',nif)))); }
  catch(e){ if (isStaff()) throw e; CL.d.soMeus=true; return map(await getDocs(query(col, where('vendedorUid','==',S.me.uid), where('cliente.nif','==',nif)))); }
}
async function cliDados(tab){
  const nif=CL.nif, d=CL.d, k=tab==='fid'?'rpn':tab;
  if (d[k]) return;
  if (k==='rpn') d.rpn=(await cliRpns(nif)).sort((a,b)=>String(dataPN(b)).localeCompare(String(dataPN(a)))||(+b.numero||0)-(+a.numero||0));
  if (k==='proj') { const meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)]; d.proj=(await getDocs(query(collection(db,'projetos'), ...meu, where('nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(b.alertaEm||'').localeCompare(a.alertaEm||'')); }
  if (k==='ativ') { const meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)]; d.ativ=(await getDocs(query(collection(db,'atividades'), ...meu, where('cliente.nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(b.numero||0)-(a.numero||0)); }
  if (k==='prop') { const meu=isStaff()?[]:[where('comercialUid','==',S.me.uid)]; d.prop=(await getDocs(query(collection(db,'propostas'), ...meu, where('nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(+b.ord||0)-(+a.ord||0)); }
}
// linhas de PN ainda dentro do prazo de fidelização: por MSISDN conta o PN mais recente; ordenadas pela data de fim (a mais próxima primeiro)
function fidelizacoes(rs){
  const h=hojeLocal(), porMs={}, sem=[];
  rs.filter(r=>['PN','Concluído'].includes(r.estado)).forEach(r=>{
    const dPN=dataPN(r); if(!dPN) return; const dia=+dPN.slice(8,10)||1, mPN=r.mesRef||dPN.slice(0,7);
    (r.linhas||[]).forEach(l=>{ const P=+l.prazo||0; if(!P) return;
      const o={ref:l.ref||'', designacao:l.designacao||'', msisdn:l.msisdn||'', nat:natGrupo(l), natureza:l.natureza||'', prazo:P, rlmc:+l.rlmc||0, pnId:r.id, pnNumero:r.numero||'', pnData:dPN, vend:r.vendedorNome||'', fim:diaNoMes(somaMeses(mPN,P),dia)};
      const ms=normMsisdn(l.msisdn);
      if (ms.length<9) return sem.push(o);
      const a=porMs[ms];
      if (!a || dPN>a.pnData || (dPN===a.pnData && r.id!==a.pnId && (+r.numero||0)>(+a.num||0))) porMs[ms]={pnId:r.id, pnData:dPN, num:r.numero, ls:[o]};
      else if (a.pnId===r.id) a.ls.push(o);
    });
  });
  return [...Object.values(porMs).flatMap(x=>x.ls), ...sem].filter(o=>o.fim>=h).sort((a,b)=>a.fim.localeCompare(b.fim)||String(a.msisdn).localeCompare(String(b.msisdn)));
}
const faltaTxt = fim => { const d=Math.round((new Date(fim+'T12:00:00')-new Date(hojeLocal()+'T12:00:00'))/864e5); return d<60 ? `${d} dias` : `${Math.round(d/30.44)} meses`; };

  m.querySelectorAll('#cl-rt [data-id]').forEach(tr=>tr.onclick=()=>{ location.hash='#/rpn/'+tr.dataset.id; });
  m.querySelectorAll('#cl-at [data-id]').forEach(tr=>tr.onclick=()=>{ location.hash='#/atividades/'+tr.dataset.id; });
  $('#cl-atn')?.addEventListener('click',()=>{ const a=atVazia(); a.cliente={nif:String(f.ncont), nome:f.nome||''}; a.conta=f.contaA||''; AT.pend=a; location.hash='#/atividades/novo'; });
  m.querySelectorAll('#cl-pt [data-pj]').forEach(tr=>tr.onclick=()=>abrirProjeto(d.proj.find(p=>p.id===tr.dataset.pj), ()=>{ CL.d.proj=null; if (location.hash.startsWith('#/clientes/')) desenharCliente(); }));
  if (tab!=='ficha') return;
  if (CL.edit) m.querySelectorAll('#cl-form [data-k]').forEach(el=>el.addEventListener('input',()=>{ S.dirty=true; }));
  $('#cl-ed')?.addEventListener('click',()=>{ CL.edit=true; desenharCliente(); });
  $('#cl-cn')?.addEventListener('click',()=>{ S.dirty=false; if (novo) { location.hash='#/clientes'; return; } CL.edit=false; CL.f=null; cliAbrir(CL.nif); });
  $('#cl-sv')?.addEventListener('click', async()=>{
    m.querySelectorAll('#cl-form [data-k]').forEach(el=>{ if(!el.disabled || el.dataset.k==='vendedor') f[el.dataset.k]=el.value.trim(); });
    f.ncont=String(f.ncont||'').replace(/\s/g,'').toUpperCase();
    if (!f.nome) return toast('Falta o nome do cliente.',true);
    if (!f.ncont) return toast('O NIF é obrigatório.',true);
    if (novo) {
      if (/[\/.#$\[\]]/.test(f.ncont)) return toast('O NIF tem caracteres inválidos.',true);
      if (/^\d+$/.test(f.ncont) && !nifValido(f.ncont) && !confirm(`"${f.ncont}" não é um NIF português válido (dígito de controlo errado).\n\nGravar mesmo assim?`)) return;
    }
    const data={}; CLI_KEYS.forEach(k=>{ if (f[k]!=null) data[k]=f[k]; });
    data.vendedor=String(f.vendedor||''); data.vendnm=vendPHCNome(data.vendedor);
    const bt=$('#cl-sv'); bt.disabled=true;
    try { await gravarFicha(data, novo); S.cli=null; S.dirty=false; toast(novo?'Cliente criado.':'Ficha guardada.');
      Object.assign(CL,{nif:data.ncont, f:null, edit:false, novo:false, tab:'ficha', d:{}});
      if (location.hash==='#/clientes/'+encodeURIComponent(data.ncont)) cliAbrir(data.ncont); else location.hash='#/clientes/'+encodeURIComponent(data.ncont);
    } catch(e){ bt.disabled=false; const c=e?.code||'';
      if (c==='ja-existe' || (novo && c.includes('permission-denied'))) toast(`Já existe um cliente com o NIF ${f.ncont}${c==='ja-existe'?'':' (na carteira de outro vendedor)'}. Não é possível repetir NIFs.`,true);
      else toast(errTxt(e),true); }
  });
}

// ---------- 9e. ATIVIDADES: pedidos dos vendedores à BackOffice sem negócio associado (desativações, 2.ªs vias, créditos, alterações…) ----------
// Coleção atividades/{id} (+ anexos, mensagens, historico). Mesma filosofia do RPN, sem linhas nem Score: a BO trata e fecha (não há conferência).
const AT_ESTADOS = ['Em Elaboração','Submetido','Em tratamento','Pendente Comercial','A aguardar','Concluído','Cancelado','Recusado'];
const AT_CURSO   = ['Em Elaboração','Submetido','Em tratamento','Pendente Comercial','A aguardar'];
const AT_ABERTAS = ['Submetido','Em tratamento','Pendente Comercial','A aguardar'];   // contam 1 para a carga da BO
const AT_FECHADAS = ['Concluído','Cancelado','Recusado'];
const AT_PONTUAM = ['Concluído','Recusado'];   // contam para a Produção BO (a BO tratou o pedido)
const AT_EDIT_COM = ['Em Elaboração','Pendente Comercial'];
const AT_ASSUNTOS = ['Aprovação','Implementação','Correcção Implementação'];
const AT_SUBS = ['Alteração','Desativação','Desconto','Tarifário','Créditos','Faturação','Equipamentos','Outros'];
const AT_GUIA = {   // texto-guia: entra na descrição quando ela está vazia, para o pedido chegar completo à BO
  'Alteração':'O que deve ser alterado:\nComo está hoje → como deve ficar:',
  'Desativação':'Serviço(s) a desativar:\nData efetiva:\nRecolha de equipamentos (sim/não) e morada:',
  'Desconto':'Desconto pedido:\nJustificação:',
  'Tarifário':'Número(s):\nTarifário atual → tarifário pretendido:',
  'Créditos':'Motivo do crédito:\nFatura / mês a que respeita:',
  'Faturação':'Pedido (2.ª via, dados de faturação, forma de pagamento…):\nMês / fatura:',
  'Equipamentos':'Equipamento e referência:\nQuantidade:\nCondições (venda standard, plafond…):\nMorada de entrega e pessoa de contacto:' };
const AT_DIAS_ALERTA = 5;   // dias em aberto a partir dos quais a lista destaca o pedido
const AT = {lista:null, mes:null, listaMes:null, extra:[], f:{estado:'',txt:'',meus:null}, cur:null, tab:'pedido'};
const atNum = r => r?.numero ? 'A'+r.numero : '—';
const atVazia = () => ({ numero:null, data:hoje(), estado:'Em Elaboração', vendedorUid:S.me.uid, vendedorNome:S.me.nome, boUid:null, boNome:'', cliente:{nif:'',nome:''},
  assunto:'', subAssunto:'', descricao:'', resposta:'', conta:'', msisdns:'', dataEfetiva:'', refVDF:'', pnNumero:'', valor:'', motivo:'', cargaContada:0 });
const atDias = r => { const d0=String(r.submetidoEm||'').slice(0,10); if(!d0) return 0; const d1=AT_FECHADAS.includes(r.estado)?String(r.fechadoEm||'').slice(0,10)||hojeLocal():hojeLocal(); return Math.max(0, Math.round((new Date(d1+'T12:00:00')-new Date(d0+'T12:00:00'))/864e5)); };
const atHist = (id, acao, detalhe) => addDoc(collection(db,'atividades',id,'historico'),{acao, detalhe:detalhe||'', porUid:S.me.uid, porNome:S.me.nome, em:serverTimestamp()}).catch(e=>console.warn('atHist',e));
const atMsisdns = t => [...new Set(String(t||'').split(/[,;\n\/]+/).map(normMsisdn).filter(x=>x.length>=9))];
// aviso automático ao vendedor quando a BO muda o estado
async function atAviso(id, r, antigo, novo){
  if (!id || antigo===novo || !r.vendedorUid || S.me.uid===r.vendedorUid || novo==='Em Elaboração') return;
  const extra = novo==='Concluído' ? (r.resposta?'Relatório BackOffice: '+r.resposta:'') : (['Pendente Comercial','A aguardar','Cancelado','Recusado'].includes(novo) && r.motivo ? 'Motivo: '+r.motivo : '');
  const agora=new Date().toISOString(), texto=`Novo estado: "${novo}"`+(extra?'\n'+extra:'');
  try { await addDoc(collection(db,'atividades',id,'mensagens'),{texto, auto:true, porUid:S.me.uid, porNome:S.me.nome, em:serverTimestamp()});
    const u={em:agora, porUid:S.me.uid, porNome:S.me.nome, auto:true}; await setDoc(doc(db,'atividades',id),{msgUlt:u, msgLido:{[S.me.uid]:agora}},{merge:true});
    if (AT.cur?.id===id) { AT.cur.msgUlt=u; AT.cur.msgLido={...(AT.cur.msgLido||{}),[S.me.uid]:agora}; }
  } catch(e){ console.warn('atAviso',e); }
}

function viewAtividades(){
  const arg=decodeURIComponent((location.hash.split('/')[2]||'').trim());
  if (arg==='novo') { AT.cur=AT.pend||atVazia(); AT.pend=null; AT.cur.id=null; AT.tab='pedido'; return atFicha(); }
  if (arg) return atAbrir(arg);
  return atLista();
}
async function atLista(forcar){
  const m=$('#main'); AT.mes=AT.mes||mesLocal();
  if (!forcar && AT.lista && AT.listaMes===AT.mes && Date.now()-AT_EM < LISTA_TTL) return atDesenhaLista();
  m.innerHTML=`<div class="card muted">A carregar Atividades…</div>`;
  try {
    const col=collection(db,'atividades'), meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)];
    const [a,f]=await Promise.all([getDocs(query(col, ...meu, where('estado','in',AT_CURSO))), getDocs(query(col, ...meu, where('mesRef','==',AT.mes)))]);
    const mp={}; [...a.docs, ...f.docs].forEach(d=>mp[d.id]={id:d.id, ...d.data()}); (AT.extra||[]).forEach(x=>{ if(!mp[x.id]) mp[x.id]=x; });
    AT.lista=Object.values(mp).sort((x,y)=>(y.numero||0)-(x.numero||0)); AT.listaMes=AT.mes; AT_EM=Date.now();
  } catch(e){ m.innerHTML=`<div class="card">Erro: ${esc(errTxt(e))}</div>`; return; }
  if (AT.f.meus===null) AT.f.meus = perfil()==='backoffice';
  atDesenhaLista();
}
function atDesenhaLista(){
  if (!S.me || !AT.lista || !location.hash.startsWith('#/atividades')) return;
  const f=AT.f, all=AT.lista, stf=isStaff();
  const lim=(()=>{ const d=new Date(); d.setDate(d.getDate()-DIAS_CONCLUIDO); return d.toISOString(); })(), extra=new Set((AT.extra||[]).map(x=>x.id));
  const velho = r => !stf && AT.mes===mesLocal() && AT_FECHADAS.includes(r.estado) && !extra.has(r.id) && !msgPorLer(r) && String(r.fechadoEm||'') < lim;
  const t=semAcento(f.txt).trim();
  const base=all.filter(r=>!velho(r) && (!f.meus || r.boUid===S.me.uid) && (!f.msg || msgPorLer(r))
    && (!t || semAcento([atNum(r), r.numero, r.cliente?.nome, r.cliente?.nif, r.assunto, r.subAssunto, r.conta, r.msisdns, r.vendedorNome, r.descricao].join(' ')).includes(t)));
  const cnt={}; base.forEach(r=>cnt[r.estado]=(cnt[r.estado]||0)+1);
  const rows=base.filter(r=>!f.estado || r.estado===f.estado), nMsg=all.filter(msgPorLer).length;
  $('#main').innerHTML=`
    <div class="chips"><div class="chip ${!f.estado?'on':''}" data-e=""><span class="muted">Todas</span><b>${base.length}</b></div>
      ${AT_ESTADOS.map(e=>`<div class="chip ${f.estado===e?'on':''}" data-e="${esc(e)}"><span class="muted">${esc(e)}</span><b>${cnt[e]||0}</b></div>`).join('')}</div>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="at-q" type="search" autocomplete="off" name="pesquisa-at" placeholder="Procurar nº, cliente, NIF, conta, número, assunto…" value="${esc(f.txt)}" style="max-width:340px">
        <button class="btn" id="at-r" title="Volta a ler a lista agora.">⟳ Atualizar</button>
        <button class="btn" id="at-h" title="Procura em todas as Atividades, incluindo as antigas, por nº, NIF ou número (MSISDN) exatos">Procurar no histórico</button>
        <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)">Fechadas em <input id="at-m" type="month" value="${esc(AT.mes)}" style="width:160px"></label>
        <label style="display:flex;gap:6px;align-items:center;margin:0;color:${nMsg?'var(--red-d)':'var(--ink)'};font-weight:${nMsg?700:400}"><input type="checkbox" id="at-fm" ${f.msg?'checked':''}> 💬 Mensagens por ler (${nMsg})</label>
        ${isBO()?`<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="at-me" ${f.meus?'checked':''}> Só as minhas</label>`:''}
        <span class="sp"></span><button class="btn pri" id="at-nv">+ Nova Atividade</button>
      </div>
      <div class="scroll"><table id="at-t"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Assunto</th><th>Vendedor</th><th>BO</th><th>Estado</th><th class="num">Dias em aberto</th></tr></thead>
        <tbody>${rows.map(r=>{ const dd=atDias(r), ab=AT_ABERTAS.includes(r.estado); return `<tr class="click" data-id="${esc(r.id)}"><td><b>${atNum(r)}</b>${msgPorLer(r)?' <span class="rp-m" title="Mensagem por ler" style="color:var(--red)">💬</span>':''}</td><td>${fmtD(r.data)}</td><td>${esc(r.cliente?.nome)}<div class="muted" style="font-size:11px">${esc(r.cliente?.nif)}</div></td><td>${esc(r.assunto)}<div class="muted" style="font-size:11px">${esc(r.subAssunto)}</div></td><td>${esc(r.vendedorNome)}</td><td>${esc(r.boNome||'—')}</td><td><span class="badge b-${esc((r.estado||'').replace(/ /g,'-'))}">${esc(r.estado)}</span>${r.motivo&&!['Concluído'].includes(r.estado)?` <span class="muted" style="font-size:11px">${esc(String(r.motivo).slice(0,60))}</span>`:''}</td><td class="num" ${ab&&dd>=AT_DIAS_ALERTA?'style="color:var(--red-d);font-weight:700"':''}>${r.submetidoEm?dd:'—'}</td></tr>`; }).join('')||`<tr><td colspan="8" class="muted">Sem Atividades.</td></tr>`}</tbody></table></div></div>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ f.estado=c.dataset.e; atDesenhaLista(); });
  const q=$('#at-q'); q.oninput=()=>{ f.txt=q.value; clearTimeout(q._h); q._h=setTimeout(()=>{ atDesenhaLista(); const n=$('#at-q'); if(!n) return; n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
  $('#at-r').onclick=()=>atLista(true);
  $('#at-m').onchange=e=>{ if(e.target.value){ AT.mes=e.target.value; atLista(); } };
  $('#at-fm').onchange=e=>{ f.msg=e.target.checked; atDesenhaLista(); };
  const me=$('#at-me'); if(me) me.onchange=()=>{ f.meus=me.checked; atDesenhaLista(); };
  $('#at-nv').onclick=()=>go('#/atividades/novo');
  $('#at-h').onclick=async()=>{ const x=(f.txt||'').trim(); if(x.length<1) return toast('Escreva na caixa de pesquisa o nº da Atividade, o NIF ou o número (MSISDN) completos.',true);
    const col=collection(db,'atividades'), meu=stf?[]:[where('vendedorUid','==',S.me.uid)], qs=[query(col, ...meu, where('cliente.nif','==',x))];
    const n=x.replace(/^a/i,''); if (/^\d+$/.test(n)) qs.push(query(col, ...meu, where('numero','==',+n)));
    if (normMsisdn(x).length>=9 && /^[\d\s+]+$/.test(x)) qs.push(query(col, ...meu, where('msisdnsL','array-contains',normMsisdn(x))));
    const rs=await Promise.allSettled(qs.map(q=>getDocs(q))), docs=rs.filter(y=>y.status==='fulfilled').flatMap(y=>y.value.docs).map(d=>({id:d.id, ...d.data()}));
    if (!docs.length) return toast('Nada encontrado no histórico com “'+x+'”.',true);
    AT.extra=[...(AT.extra||[]).filter(y=>!docs.some(d=>d.id===y.id)), ...docs]; const mp={}; [...AT.lista, ...docs].forEach(y=>mp[y.id]=y); AT.lista=Object.values(mp).sort((a,b)=>(b.numero||0)-(a.numero||0));
    f.txt=''; f.estado=''; toast(docs.length+' Atividade(s) encontrada(s) no histórico.'); atDesenhaLista(); };
  document.querySelectorAll('#at-t tr[data-id]').forEach(tr=>tr.onclick=()=>go('#/atividades/'+tr.dataset.id));
}
async function atAbrir(id){
  const m=$('#main');
  if (AT.cur?.id!==id) AT.tab='pedido';
  m.innerHTML=`<div class="card muted">A carregar…</div>`;
  try { const s=await getDoc(doc(db,'atividades',id)); if(!s.exists()) { m.innerHTML='<div class="card">Atividade não encontrada.</div>'; return; } AT.cur={id, ...s.data()}; }
  catch(e){ m.innerHTML=`<div class="card">${esc(errTxt(e))}</div>`; return; }
  S.dirty=false; atFicha();
}
function atPerms(){
  const r=AT.cur, own=r.vendedorUid===S.me.uid, nov=!r.id, fechada=AT_FECHADAS.includes(r.estado);
  return { own, nov, fechada, edV:(own||nov)&&AT_EDIT_COM.includes(r.estado), edBO:isBO()&&(!fechada||isMaster()) };
}
function atFicha(){
  const r=AT.cur, p=atPerms(), m=$('#main'), ed=p.edV||p.edBO, dV=ed?'':'disabled', dB=p.edBO?'':'disabled';
  const tabs=[['pedido','Pedido'],['anexos','Anexos'],['msg','Mensagens'+(msgPorLer(r)?' ● nova':'')],['hist','Histórico']];
  const acts=[];
  if (ed) acts.push(`<button class="btn" id="t-save">Guardar</button><button class="btn" id="t-canc" title="${r.id?'Repõe o que estava gravado':'Sai sem criar a Atividade'}">Cancelar</button>`);
  if ((p.own||p.nov||isBO()) && r.estado==='Em Elaboração') acts.push(`<button class="btn pri" id="t-sub">Submeter à BackOffice</button>`);
  if (p.own && r.estado==='Pendente Comercial') acts.push(`<button class="btn pri" id="t-res">Resolvido · devolver à BO</button>`);
  if (isBO() && r.id && AT_ABERTAS.includes(r.estado)) {
    if (r.estado!=='Em tratamento') acts.push(`<button class="btn" id="t-tra">Em tratamento</button>`);
    acts.push(`<button class="btn" id="t-pen">Pendente Comercial</button><button class="btn" id="t-agu">A aguardar</button><button class="btn" id="t-rec" style="color:var(--red-d)">Recusado</button><button class="btn" id="t-can" style="color:var(--red-d)">Cancelar</button><button class="btn pri" id="t-ok">Concluir</button>`);
  }
  if (isMaster() && r.id && p.fechada) acts.push(`<button class="btn" id="t-rea">Reabrir</button>`);
  if (r.id && ((p.own && r.estado==='Em Elaboração') || isMaster())) acts.push(`<button class="btn" id="t-del" style="color:var(--red-d)">Eliminar</button>`);
  const fa=(lab,k,dis,type='text',extra='')=>`<div><label>${lab}</label><input type="${type}" data-a="${k}" value="${esc(getPath(r,k))}" ${dis} ${extra}></div>`;

  const vendOpts=Object.entries(S.users).filter(([,u])=>u.ativo&&['comercial','coordenador','master'].includes(u.perfil)).map(([uid,u])=>[uid,u.nome]);
  const podeCli=ed && (r.estado==='Em Elaboração' || isBO());
  m.innerHTML=`<div class="card">
      <div class="row"><a href="#/atividades" id="t-back" class="muted" style="font-size:12px">← Atividades</a></div>
      <div class="row" style="margin-top:6px"><h2 style="margin:0">${r.id?'Atividade '+atNum(r):'Nova Atividade'}</h2><span class="badge b-${esc(r.estado.replace(/ /g,'-'))}">${esc(r.estado)}</span>
        ${r.submetidoEm?`<span class="muted" style="font-size:12px">${AT_FECHADAS.includes(r.estado)?'tratada em':'em aberto há'} ${atDias(r)} dia(s)</span>`:''}<span class="sp"></span>${acts.join('')}</div>
      ${r.motivo&&r.estado!=='Concluído'&&r.estado!=='Em Elaboração'?`<div class="warnbox" id="t-mot" style="margin:12px 0 0"><b>${esc(r.estado)}:</b> ${esc(r.motivo)}</div>`:''}
    </div>
    <div class="tabs">${tabs.map(([k,t])=>`<a data-tt="${k}" class="${AT.tab===k?'on':''}">${t}</a>`).join('')}</div><div id="t-c"></div>`;
  const tc=$('#t-c');
  if (AT.tab==='pedido') {
    const cred=r.subAssunto==='Créditos', corr=r.assunto==='Correcção Implementação';
    tc.innerHTML=`<div class="card">${podeCli?`<div class="cli-box" style="margin-bottom:14px"><label>Escolher cliente</label><input id="t-cq" type="search" autocomplete="off" name="procura-cli-at" placeholder="Escreva as primeiras letras do nome ou o início do NIF…"><div class="cli-res" id="t-cr"></div></div>`:''}
      <div class="grid g4">
        ${fa('Cliente','cliente.nome',podeCli?'':'disabled')}${fa('NIF','cliente.nif',podeCli?'':'disabled')}${fa('Data','data','disabled','date')}
        ${isBO()?sa('Vendedor','vendedorUid',vendOpts,dB):`<div><label>Vendedor</label><input value="${esc(r.vendedorNome)}" disabled></div>`}

        ${fa('Conta Vodafone','conta',dV)}${fa('Número(s) afetado(s)','msisdns',dV,'text','placeholder="separados por vírgula"')}
        ${fa('Data efetiva pretendida','dataEfetiva',dV,'date')}
        ${fa('PN relacionado (nº)'+(corr?' *':''),'pnNumero',dV,'text','placeholder="'+(corr?'obrigatório nesta correção':'opcional')+'"')}

        ${fa('Ref.ª do pedido na Vodafone','refVDF',dB)}
      </div></div>
      <div class="card"><div class="grid g2">
        <div><label>Descrição do pedido</label><textarea data-a="descricao" rows="9" ${dV} placeholder="O que é preciso fazer. Escolha o sub-assunto para ver o que a BackOffice precisa de saber.">${esc(r.descricao)}</textarea></div>

function atValidar(r){
  const e=[]; if(!String(r.cliente?.nome||'').trim()) e.push('cliente'); if(String(r.cliente?.nif||'').replace(/\s/g,'').length<5) e.push('NIF');
  if(!r.assunto) e.push('assunto'); if(!r.subAssunto) e.push('sub-assunto');
  const d=String(r.descricao||'').trim(); if(d.length<10 || Object.values(AT_GUIA).includes(d)) e.push('descrição do pedido');
  if(r.assunto==='Correcção Implementação' && !String(r.pnNumero||'').trim()) e.push('PN relacionado');
  if(r.subAssunto==='Créditos' && !(parseFloat(r.valor)>0)) e.push('valor do crédito');
  return e;
}

const pnPorEnviar = r => r.estado==='PN' && r.origem!=='PHC' && !r.pnEmail;
const pnCfg = async () => { try { return (await getDoc(doc(db,'config','email'))).data()||{}; } catch(e){ return {}; } };
async function pnServico(url, corpo){
  const idToken = await (auth.currentUser?.getIdToken ? auth.currentUser.getIdToken() : Promise.resolve(''));
  let res; try { res=await fetch(url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...corpo, idToken})}); }
  catch(e){ throw new Error('Não foi possível contactar o serviço de email. Verifique a internet e o endereço em Administração › Email.'); }
  let j=null; try { j=await res.json(); } catch(e){}
  if (!j || !j.ok) throw new Error('O email não foi enviado: '+(j?.error||('resposta '+res.status)));
  return j;
}

// ---------- 9a. CATÁLOGO DE REFERÊNCIAS (Coordenador, BackOffice e Master criam, editam e apagam) ----------
let CAT_Q = '';
const SUBFAMS = ['GSM','BL','Fixo'];
function viewCatalogo(){
  const m=$('#main'), t=semAcento(CAT_Q).trim(), pal=t.split(/\s+/).filter(Boolean);
  const L = S.prodList.filter(p=>!pal.length || pal.every(w=>semAcento(p.ref+' '+p.designacao+' '+(p.tier||'')+' '+(p.pricingPlan||'')+' '+(p.subfamilia||'')+(p.inativo?' inativa':'')+(composicaoDe(p)?' bundle '+p.composicao.map(c=>c.ref).join(' '):'')).includes(w)));
  m.innerHTML = `<div class="card"><div class="row" style="margin-bottom:12px">
      <input id="cq" type="search" autocomplete="off" placeholder="Procurar por referência, designação, tier ou pricing plan…" value="${esc(CAT_Q)}" style="max-width:420px">
      <span class="muted">${L.length} de ${S.prodList.length} referência(s)</span><span class="sp"></span><button class="btn" id="csim" title="Mostra o que aconteceria a cada tarifário das Propostas ao juntar os dois catálogos. Não grava nada.">Simular união com as Propostas</button><button class="btn pri" id="cn">+ Nova referência</button></div>
    <div class="scroll"><table id="ctab"><thead><tr><th>Referência</th><th>Designação</th><th>Sub-fam.</th><th>Categoria</th><th>Tier</th><th>Pricing plan</th><th>Desc.</th><th></th></tr></thead>
      <tbody>${L.slice(0,300).map(p=>`<tr data-ref="${esc(p.ref)}"><td><b>${esc(p.ref)}</b>${p.inativo?' <span class="muted" style="font-size:11px">· inativa</span>':''}</td><td>${esc(p.designacao)}${composicaoDe(p)?`<div class="muted" style="font-size:11px">📦 ${p.composicao.map(c=>esc(c.ref)+' '+(Math.round(c.pct*1000)/10).toLocaleString('pt-PT')+'%').join(' + ')}</div>`:''}</td><td>${esc(p.subfamilia||'')}</td><td>${esc(p.categoria||'')}</td><td>${esc(p.tier||'')}</td><td>${p.pricingPlan?esc(p.pricingPlan):'<span class="muted">em falta</span>'}</td><td>${p.descontinuado?'SIM':''}</td>
        <td style="white-space:nowrap"><button class="btn sm" data-ed>Editar</button> <button class="btn sm" data-dp title="Cria uma referência nova a partir desta">Duplicar</button> <button class="btn sm ghost" data-rm style="color:var(--red-d)">Apagar</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Nenhuma referência.</td></tr>'}</tbody></table></div>
    ${L.length>300?'<p class="muted" style="font-size:12px;margin-bottom:0">A mostrar as primeiras 300. Afine a pesquisa.</p>':''}</div>`;
  const cq=$('#cq'); cq.oninput=()=>{ CAT_Q=cq.value; clearTimeout(cq._h); cq._h=setTimeout(()=>{ if(!location.hash.startsWith('#/catalogo')) return; viewCatalogo(); const n=$('#cq'); if(!n) return; n.focus(); n.setSelectionRange(n.value.length,n.value.length); },200); };
  $('#cn').onclick=()=>editarRef(null);
  $('#csim').onclick=simularUniao;
  m.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editarRef(S.prodMap[b.closest('tr').dataset.ref.toUpperCase()]));
  m.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>editarRef(null, S.prodMap[b.closest('tr').dataset.ref.toUpperCase()]));
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ const ref=b.closest('tr').dataset.ref;
    const pais=S.prodList.filter(x=>(x.composicao||[]).some(c=>String(c.ref).toUpperCase()===ref.toUpperCase())).map(x=>x.ref);
    if(pais.length) return toast(`Não pode apagar: ${ref} faz parte do(s) bundle(s) ${pais.join(', ')}.`,true);
    if(!confirm(`Apagar a referência ${ref}?\n\nOs processos que já a usam não são alterados, mas deixa de aparecer na pesquisa das linhas.`)) return;
    try{ await deleteDoc(doc(db,'produtos',prodId(ref))); produtoLocal(ref,null); await catalogoMudou(); toast('Referência apagada.'); viewCatalogo(); }catch(e){ toast(errTxt(e),true); } });
}
// ---- união dos catálogos, passo 1: simulação (só lê; não grava nada) ----
const UN_EST={ok:['Junta-se à referência','#15803d'], sem:['Sem Ref PHC','#b45309'], inex:['Referência não existe','var(--red-d)'], rep:['Referência repetida','var(--red-d)'], nome:['Nome repetido','var(--red-d)']};
const unKey=r=>{ const k=String(r||'').trim().toUpperCase(); return /^[.\-]*$/.test(k)?'':k; };
// lista = tarifários das Propostas; devolve uma linha por tarifário com o que lhe aconteceria
function unAnalisar(lista){
  const nRef={}, nNome={};
  lista.forEach(t=>{ const k=unKey(t.refPHC); if(k) nRef[k]=(nRef[k]||0)+1; const n=String(t.name||'').trim().toUpperCase(); nNome[n]=(nNome[n]||0)+1; });
  const linhas=lista.map(t=>{ const k=unKey(t.refPHC), p=k?S.prodMap[k]:null, n=String(t.name||'').trim().toUpperCase();
    let e='ok', nota='';
    if (!n) { e='nome'; nota='Tarifário sem nome.'; }
    else if (nNome[n]>1) { e='nome'; nota=`Há ${nNome[n]} tarifários com este nome.`; }
    else if (!k) { e='sem'; nota='Tem de ganhar uma referência antes da união.'; }
    else if (nRef[k]>1) { e='rep'; nota=`Usada em ${nRef[k]} tarifários: ${lista.filter(x=>unKey(x.refPHC)===k).map(x=>x.name).join(', ')}.`+(p?'':' Além disso, não existe no catálogo.'); }
    else if (!p) { e='inex'; nota='Corrigir a Ref PHC do tarifário ou criar a referência.'; }
    else nota=[p.descontinuado?'descontinuada':'', p.inativo?'inativa':''].filter(Boolean).join(' · ');
    return {t, k, p, e, nota}; });
  const usadas=new Set(linhas.filter(x=>x.k).map(x=>x.k));
  const livres=S.prodList.filter(p=>!usadas.has(p.ref.toUpperCase()) && !p.descontinuado && !p.inativo);
  const c={ok:0,sem:0,inex:0,rep:0,nome:0}; linhas.forEach(x=>c[x.e]++);
  return {linhas, livres, c};
}
async function simularUniao(){
  let lista;
  try { const d=await getDoc(doc(db,'config','tarifarios')); lista=d.exists()&&Array.isArray(d.data().lista)?d.data().lista:[]; }
  catch(e){ return toast(errTxt(e),true); }
  if (!lista.length) return toast('Não há tarifários gravados nas Propostas (está a ser usada a lista interna de reserva). Nada para simular.',true);
  const {linhas, livres, c}=unAnalisar(lista), prob=c.sem+c.inex+c.rep+c.nome;
  let filtro=prob?'prob':'todos';
  modal(`<h2>Simulação da união dos catálogos</h2>
    <p class="muted" style="margin-top:0">Isto é só uma simulação: <b>não foi gravado nada</b>. Mostra o que aconteceria a cada um dos ${lista.length} tarifários das Propostas ao passar para o catálogo único (${S.prodList.length} referências).</p>
    <div id="un-res" style="padding:10px 12px;border-radius:8px;margin-bottom:10px;font-weight:600;${prob?'background:#fef3c7;color:#92400e':'background:#dcfce7;color:#166534'}">${prob?`${prob} tarifário(s) têm de ser corrigidos antes da união. ${c.ok} estão prontos.`:`Os ${c.ok} tarifários estão prontos para a união.`}</div>
    <div class="row" id="un-f" style="gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
    <div class="scroll" style="max-height:46vh"><table id="un-t"><thead><tr><th>Tarifário (Propostas)</th><th>Ref PHC</th><th>Resultado</th><th>Referência no catálogo</th><th>Nota</th></tr></thead><tbody></tbody></table></div>
    <p class="muted" id="un-liv" style="font-size:12px;margin-bottom:0">${livres.length} referência(s) ativas do catálogo não têm tarifário nas Propostas. Não é um problema: ficam no catálogo sem descrição comercial.</p>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="un-cp">Copiar para o Excel</button><button class="btn pri" id="c">Fechar</button></div>`, (m,close)=>{
    m.style.width='min(1000px,96vw)'; m.querySelector('#c').onclick=close;
    const vis=()=>linhas.filter(x=>filtro==='todos'||(filtro==='prob'?x.e!=='ok':x.e===filtro));
    const draw=()=>{
      m.querySelector('#un-f').innerHTML=[['prob','A corrigir',prob],['ok','Prontos',c.ok],['sem',UN_EST.sem[0],c.sem],['inex',UN_EST.inex[0],c.inex],['rep',UN_EST.rep[0],c.rep],['nome',UN_EST.nome[0],c.nome],['todos','Todos',linhas.length]].filter(b=>b[2]||b[0]==='todos'||b[0]==='prob').map(([k,l,n])=>`<button class="btn sm ${filtro===k?'pri':''}" data-uf="${k}">${l} (${n})</button>`).join('');
      m.querySelectorAll('[data-uf]').forEach(b=>b.onclick=()=>{ filtro=b.dataset.uf; draw(); });
      const L=vis().slice().sort((a,b)=>(a.e==='ok')-(b.e==='ok') || a.e.localeCompare(b.e) || a.k.localeCompare(b.k) || String(a.t.name).localeCompare(String(b.t.name)));
      m.querySelector('#un-t tbody').innerHTML=L.map(x=>`<tr data-ue="${x.e}"><td><b>${esc(x.t.name||'(sem nome)')}</b></td><td style="font-family:monospace;font-size:12px">${esc(x.t.refPHC||'—')}</td><td style="font-weight:600;color:${UN_EST[x.e][1]};white-space:nowrap">${UN_EST[x.e][0]}</td><td>${x.p?`<b>${esc(x.p.ref)}</b> <span class="muted">${esc(x.p.designacao||'')}${x.p.tier?' · '+esc(x.p.tier):''}</span>`:'<span class="muted">—</span>'}</td><td class="muted" style="font-size:12px">${esc(x.nota)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum tarifário neste filtro.</td></tr>'; };
    draw();
    m.querySelector('#un-cp').onclick=()=>{ const txt=['Tarifário\tRef PHC\tResultado\tReferência no catálogo\tDesignação\tNota'].concat(vis().map(x=>[x.t.name||'',x.t.refPHC||'',UN_EST[x.e][0],x.p?x.p.ref:'',x.p?x.p.designacao||'':'',x.nota].join('\t'))).join('\n');
      const fim=()=>toast(vis().length+' linha(s) copiadas.');
      const alt=()=>{ const a=document.createElement('textarea'); a.value=txt; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); fim(); }catch(e){ toast('Não foi possível copiar.',true); } a.remove(); };
      if (navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fim,alt); else alt(); };
  });
}
function editarRef(p, modelo){   // modelo = referência a duplicar: abre como nova, já preenchida, só falta escrever a referência
  const nova=!p; p=p||(modelo?{...modelo, ref:''}:{ref:'',designacao:'',subfamilia:'GSM',tier:'Gold',pricingPlan:'',descontinuado:false});

// ---------- 9b. PRODUÇÃO BO (pontos e repartição do bolo mensal) ----------
// pontos por linha: implementar = impl · conferir = conf · cancelado/reprovado = canc · devolução = −impl × pen
const PESOS_DEF = {impl:2, conf:1, canc:2, pen:1.5, ativ:2};
let PROD_MES = null;
function calcProducao(fechados, comDev, mes, P, bolo, ativs=[]){
  const L = {}; const row = (uid,nome) => (L[uid] = L[uid] || {uid, nome:nome||userNome(uid)||'—', li:0, lc:0, lx:0, nd:0, ld:0, la:0});
  bos().forEach(b=>row(b.uid,b.nome));
  fechados.forEach(r=>{ const n=r.nLinhas||0;
    if (r.estado==='PN') { const iu=r.implPorUid||r.boUid; if(iu) row(iu, r.implPorNome||r.boNome).li+=n; if(r.conferidoPorUid) row(r.conferidoPorUid, r.conferidoPorNome).lc+=n; }
    else if (['Cancelado','Reprovado'].includes(r.estado) && r.boUid) row(r.boUid, r.boNome).lx+=n; });
  ativs.forEach(a=>{ if (AT_PONTUAM.includes(a.estado) && a.boUid) row(a.boUid, a.boNome).la++; });   // atividades tratadas (concluídas ou recusadas)
  const devs=[];
  comDev.forEach(r=>(r.devolucoes||[]).forEach((d,i)=>{ if(d.mes!==mes) return; devs.push({...d, i, rpnId:r.id, numero:r.numero, cliente:r.cliente?.nome||''});
    if(!d.anulada && d.aUid){ const x=row(d.aUid,d.aNome); x.nd++; x.ld+=d.linhas||0; } }));
  const linhas = Object.values(L).map(x=>({...x, pts: x.li*P.impl + x.lc*P.conf + x.lx*P.canc + x.la*(P.ativ||0) - x.ld*P.impl*P.pen}));
  const tot = linhas.reduce((a,x)=>a+Math.max(0,x.pts),0);
  linhas.forEach(x=>{ x.parte = tot ? Math.max(0,x.pts)/tot : 0; x.valor = Math.round(bolo*x.parte*100)/100; });
  linhas.sort((a,b)=>b.pts-a.pts || a.nome.localeCompare(b.nome));
  devs.sort((a,b)=>String(a.em).localeCompare(String(b.em)));
  return {linhas, devs, tot};
}

// ⚠ CONFIDENCIAL: o que a Redemóvel recebe da Vodafone (RUN, % dos escalões, valor por evento) vive só em configFin/* e runs/*,
//   que as regras do Firestore deixam ler apenas ao Master e à BO Financeiro. O vendedor só lê config/planoVendedor (€ por evento)
//   e os seus próprios RPN/PN. Nunca copiar valores Vodafone para coleções que o vendedor lê (nem para o catálogo em cache).
const isFin = () => ['master','bo_financeiro'].includes(perfil());
const NAT_COM = ['Nova Móvel','Nova Fixo','Nova SS','Ref Móvel','Ref Fixo'];
const PLANO_DEF = { desde:'2024-10',
  escaloes:[{min:12,ref:0.90,nova:2.70},{min:36,ref:1.80,nova:5.40},{min:60,ref:3.15,nova:9.45},{min:82,ref:4.50,nova:13.50},{min:115,ref:5.40,nova:16.20}],
  pesos:{'Nova Móvel':3,'Nova Fixo':3,'Nova SS':1,'Ref Móvel':1,'Ref Fixo':1},
  maj:[{n:3,pct:20},{n:4,pct:40}],
  nomes:['Partida','Arranque','Ritmo','Embalo','Elite','Lenda'],   // escalão 1 (sem incentivo) … 6 (máximo)
  objetivos:[{id:'NM',nome:'Nova Móvel',nat:['Nova Móvel'],trim:39},{id:'NF',nome:'Nova Fixo',nat:['Nova Fixo'],trim:33},
             {id:'RM',nome:'Ref Móvel',nat:['Ref Móvel'],trim:112},{id:'RF',nome:'Ref Fixo',nat:['Ref Fixo'],trim:46}] };
const FIN_DEF = { desde:'2024-10', pct:[2,4,7,10,12], valorEvento:{ref:45, nova:135} };   // confidencial
let PLANO = null, PLANO_EM = 0;
async function lerPlano(forcar){
  if (PLANO && !forcar && Date.now()-PLANO_EM < 300000) return PLANO;
  const s = await getDoc(doc(db,'config','planoVendedor'));
  PLANO = s.exists() ? s.data() : {}; if (!PLANO.versoes?.length) PLANO.versoes=[PLANO_DEF]; PLANO.objVend=PLANO.objVend||{}; PLANO_EM=Date.now();
  return PLANO;
}
const versaoDe = (vs, mes) => [...vs].sort((a,b)=>a.desde<b.desde?-1:1).filter(v=>v.desde<=mes).pop() || [...vs].sort((a,b)=>a.desde<b.desde?-1:1)[0];
// escalões numerados 1–6: o 1.º é a entrada (abaixo do primeiro limiar, sem incentivo); a correspondência com % só o Master conhece
const NOMES_ESC = PLANO_DEF.nomes;
const escNum = i => (i ?? -1) + 2;
const escNome = (v, i) => (v?.nomes || NOMES_ESC)[escNum(i)-1] || '';
const escTxt = (v, i) => `${escNum(i)} · ${escNome(v, i)}`;
const escIdx = (v, x) => v.escaloes.indexOf(x);
const objDe = (uid, v) => { const o=PLANO.objVend?.[uid]||{}; return Object.fromEntries(v.objetivos.map(x=>[x.id, o[x.id]!=null && o[x.id]!=='' ? +o[x.id] : +x.trim||0])); };
function natNorm(n){ n=String(n||''); const nova=/nova/i.test(n);
  if (nova && /\bss\b|smart/i.test(n)) return 'Nova SS'; if (/fix/i.test(n)) return nova?'Nova Fixo':'Ref Fixo'; return nova?'Nova Móvel':'Ref Móvel'; }
const r3 = x => Math.round((+x||0)*1000)/1000;
function eventosDe(rs){ const ev={}; rs.forEach(r=>(r.linhas||[]).forEach(l=>{ const n=natNorm(l.natureza); ev[n]=r3((ev[n]||0)+scoreLinha(l,r)); })); return ev; }
const somaEv = (a,b) => { const o={...a}; Object.entries(b||{}).forEach(([n,x])=>o[n]=r3((o[n]||0)+x)); return o; };
const escalarEv = (ev,k) => Object.fromEntries(Object.entries(ev).map(([n,x])=>[n,x*k]));
// motor do plano: eventos por natureza → escalão, objetivos, majoração e € (todos os eventos do mês ao valor do escalão atingido)
function comCalc(v, ev, obj){
  const pts = Object.entries(ev).reduce((a,[n,x])=>a+x*(v.pesos?.[n]??1),0);
  let e=null, i=-1; v.escaloes.forEach((x,k)=>{ if (pts>=x.min-1e-9) { e=x; i=k; } });
  const prox = v.escaloes.find(x=>pts<x.min-1e-9)||null;
  const objs = v.objetivos.map(o=>{ const feito=o.nat.reduce((a,n)=>a+(ev[n]||0),0), trim=+obj[o.id]||0, mes=trim/3; return {...o, feito, trim, mes, ok: mes>0 && feito>=mes-1e-9}; });
  const cumpridos = objs.filter(o=>o.ok).length;
  const maj = Math.max(0, ...v.maj.filter(m=>cumpridos>=m.n).map(m=>+m.pct||0))/100;
  const base = e ? Object.entries(ev).reduce((a,[n,x])=>a+x*(/^Nova/.test(n)?e.nova:e.ref),0) : 0;
  return {pts, e, i, prox, objs, cumpridos, maj, base, total: base*(1+maj)};
}
// dias úteis (seg–sex, sem feriados nacionais)
function pascoa(a){ const b=a%19,c=Math.floor(a/100),d=a%100,e=Math.floor(c/4),f=c%4,g=Math.floor((c+8)/25),h=Math.floor((c-g+1)/3),i=(19*b+c-e-h+15)%30,k=Math.floor(d/4),l=d%4,m=(32+2*f+2*k-i-l)%7,n=Math.floor((b+11*i+22*m)/451),mes=Math.floor((i+m-7*n+114)/31),dia=((i+m-7*n+114)%31)+1; return new Date(a,mes-1,dia); }
const isoL = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function feriados(a){ const p=pascoa(a), f=n=>{ const x=new Date(p); x.setDate(x.getDate()+n); return isoL(x); };
  return new Set([`${a}-01-01`,f(-2),f(0),`${a}-04-25`,`${a}-05-01`,f(60),`${a}-06-10`,`${a}-08-15`,`${a}-10-05`,`${a}-11-01`,`${a}-12-01`,`${a}-12-08`,`${a}-12-25`]); }
function diasUteis(mes, ate){ const [y,m]=mes.split('-').map(Number), fer=feriados(y), fim=new Date(y,m,0).getDate(); let n=0;
  for (let d=1; d<=fim; d++){ const x=new Date(y,m-1,d), s=isoL(x); if (ate && s>ate) break; if (x.getDay()%6 && !fer.has(s)) n++; } return n; }
const trimDe = mes => { const [y,m]=mes.split('-').map(Number), q=Math.floor((m-1)/3); return {n:q+1, meses:[1,2,3].map(k=>y+'-'+String(q*3+k).padStart(2,'0'))}; };
const eur0 = n => Math.round(+n||0).toLocaleString('pt-PT')+' €';
const f1 = n => (+n||0).toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1});

// estado de prevista vs paga (saldo = prevista − paga)
const saldoTxt = (prev, pago, temPag) => { const sd=Math.round((prev-pago)*100)/100;
  if (!temPag) return '<span class="badge">por receber</span>';

  return out;
}
// gráfico: comissão do mês (€) em função dos eventos, mantendo a mistura atual
function comGrafico(v, ev, obj, c, p, sim){
  const W=760,H=290,L=58,R=16,T=18,B=40, alvo=Math.max(c.pts, p?p.pts:0, sim?sim.pts:0), xmax=Math.max(130, Math.ceil(alvo*1.15/10)*10);
  const mix = c.pts>0.01 ? ev : {'Ref Móvel':1}, p0 = c.pts>0.01 ? c.pts : comCalc(v, mix, obj).pts;
  const pts=[]; for (let x=0; x<=xmax; x+=0.5) pts.push([x, comCalc(v, escalarEv(mix, x/p0), obj).total]);
  const ymax=Math.max(...pts.map(q=>q[1]))*1.08||100, step=ymax>3000?1000:ymax>1500?500:ymax>600?200:100;
  const X=x=>L+(x/xmax)*(W-L-R), Y=y=>H-B-(y/ymax)*(H-T-B);
  let d=''; pts.forEach(([x,y],i)=>{ d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); });
  const g=[]; for (let y=0; y<=ymax; y+=step) g.push(`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="#e3e3e6"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end">${y.toLocaleString('pt-PT')} €</text>`);
  const tr=v.escaloes.filter(e=>e.min<=xmax).map(e=>`<line x1="${X(e.min)}" x2="${X(e.min)}" y1="${T}" y2="${H-B}" stroke="#d4d4d8" stroke-dasharray="3 4"/><text x="${X(e.min)}" y="${H-B+18}" text-anchor="middle">${e.min}</text><text x="${X(e.min)+4}" y="${T+10}" style="font-weight:700">${escNum(v.escaloes.indexOf(e))}</text>`);
  const usados=[]; // evita etiquetas sobrepostas: se perto de outra, desce
  const dot=(x,y,cor,txt,end)=>{ let ty=Y(y)-10; while (usados.some(u=>Math.abs(u.x-X(x))<150 && Math.abs(u.y-ty)<16)) ty-=18; usados.push({x:X(x),y:ty});
    return `<circle cx="${X(x)}" cy="${Y(y)}" r="6" fill="${cor}" stroke="#fff" stroke-width="2"/><text class="lab" x="${X(x)+(end?-10:10)}" y="${ty}" text-anchor="${end?'end':'start'}">${txt}</text>`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comissão do mês em função dos eventos">${g.join('')}${tr.join('')}
    <path d="${d}L${X(xmax)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="#fde8e8" opacity=".75"/><path d="${d}" fill="none" stroke="var(--red)" stroke-width="2.5"/>
    ${p?`<line x1="${X(c.pts)}" x2="${X(p.pts)}" y1="${Y(c.total)}" y2="${Y(p.total)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}
    ${dot(c.pts, c.total, 'var(--ink)', (p?'Hoje · ':'')+eur0(c.total), false)}
    ${p?dot(p.pts, p.total, 'var(--ok)', 'Fim do mês · '+eur0(p.total), p.pts>xmax*0.7):''}
    ${sim?`<line x1="${X(c.pts)}" x2="${X(sim.pts)}" y1="${Y(c.total)}" y2="${Y(sim.total)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2 3"/>`+dot(sim.pts, sim.total, '#d97706', 'Simulação · '+eur0(sim.total), sim.pts>xmax*0.7):''}
    <text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">eventos para escalão</text></svg>`;
}

async function importarRun(file, box){

    const hd = (rows[0]||[]).map(x=>String(x||'').trim()), ix = n => hd.indexOf(n);

    const g = (r,n) => { const i=ix(n); return i<0?null:r[i]; }, s = x => x==null?'':String(x).trim();

    const tot = linhas.reduce((a,l)=>a+l[RL.val],0);
    const existe = (await getDoc(doc(db,'runs',mes))).exists();
    if (!confirm(`RUN de ${mesTxt(mes)}: ${linhas.length} linhas, total ${eur(tot)}.${existe?'\n\nJá existe um RUN deste mês: vai ser substituído.':''}\n\nImportar?`)) return;
    const velhos = existe ? (await getDocs(collection(db,'runs',mes,'blocos'))).docs : [];
    let b = writeBatch(db), n=0; const commit = async()=>{ await b.commit(); b=writeBatch(db); n=0; };
    for (const d of velhos) { b.delete(d.ref); if (++n>=400) await commit(); }
    for (let k=0; k*500<linhas.length; k++) { b.set(doc(db,'runs',mes,'blocos',String(k)), {linhas: linhas.slice(k*500,(k+1)*500).map(x=>JSON.stringify(x))}); if (++n>=20) await commit(); }
    b.set(doc(db,'runs',mes), {mes, ficheiro:file.name, n:linhas.length, total:Math.round(tot*100)/100, importadoEm:serverTimestamp(), por:S.me.nome, porUid:S.me.uid});
    await commit();
    CMS_MES = mes; CMS_RUN = null; toast(`RUN de ${mesTxt(mes)} importado: ${linhas.length} linhas.`); cmsRun(box);
  } catch(e){ console.error(e); toast(errTxt(e)||e.message, true); }
}
// ---- conciliação RUN ↔ PN e comissão de cada vendedor ----
// Regra (Ricardo, out 2026): cada linha recebida da Vodafone é imputada ao PN (pelo POS) e ao vendedor do PN;
// o vendedor recebe a % do escalão que atingiu NO MÊS DO PN (+ majoração desse mês). Charge-backs seguem a mesma regra (negativos).
async function conciliarRun(R){

// ---- importação única dos PN do PHC (histórico) ----
const PN_COLS = ["ftstamp", "fno", "fdata", "no", "nome", "ncont", "vendedor", "vendnm", "u_noportun", "u_ssfid", "u_ftstatus", "u_tpactivo", "lordem", "ref", "design", "score", "rlmc", "u_natureza", "u_pzperm", "u_contrvdf", "u_oport", "u_pricplan", "u_descont", "u_tipotarv", "msisdn", "conta", "tipo", "loja", "morada", "local", "codpost", "contacto", "email", "telefone", "rpn_no", "rpn_status", "rpn_bo", "rpn_notas", "rpn_resumo", "rpn_log", "rpn_interloc", "rpn_tel", "rpn_email", "rpn_ent1", "rpn_ent2", "rpn_entloc", "rpn_entcp", "rpn_pzperm", "rpn_loja", "rpn_ctgsm", "rpn_ctdados", "rpn_ctadsl", "rpn_ctgsm2", "rpn_novaconta", "rpn_pnesp", "rpn_aprovga", "rpn_novonif", "rpn_desconto", "rpn_subsidi", "rpn_infrisco"];
const PN_SQL = "-- Redemóvel · exportação dos Processos de Negócio (PN) do PHC para a plataforma\n-- v3: com MSISDN, conta, morada, contacto, email e os dados do dossier de origem (Registo PN): notas, resumo do negócio, BackOffice, contas\n-- Série 20 \"Processos Negócio\", desde 01/10/2022 (48 meses). Uma linha por cada linha do PN; a linha \"DPN\" é ignorada.\nUSE ARPURO;\nSELECT\n  RTRIM(ft.ftstamp) AS ftstamp,\n  CAST(ft.fno AS int) AS fno,\n  CONVERT(varchar(10), ft.fdata, 120) AS fdata,\n  CAST(ft.no AS int) AS no,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.nome,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS nome,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.ncont,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS ncont,\n  CAST(ft.vendedor AS int) AS vendedor,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.vendnm,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS vendnm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_noportun,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_noportun,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_ssfid,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_ssfid,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_ftstatus,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_ftstatus,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_tpactivo,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_tpactivo,\n  CAST(ISNULL(fi.lordem,0) AS int) AS lordem,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.ref,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS ref,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.design,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS design,\n  CAST(ISNULL(fi.qtt,0) AS varchar(20)) AS score,\n  CAST(ISNULL(fi.u_qtt,0) AS varchar(20)) AS rlmc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_natureza,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_natureza,\n  CAST(ISNULL(fi.u_pzperm,0) AS int) AS u_pzperm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_contrvdf,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_contrvdf,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_oport,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_oport,\n  CAST(ISNULL(fi.u_pricplan,0) AS varchar(20)) AS u_pricplan,\n  CAST(ISNULL(fi.u_descont,0) AS int) AS u_descont,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_tipotarv,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_tipotarv,\n  CASE WHEN RTRIM(ISNULL(fi.fifref,'')) <> '' THEN REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.fifref,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') ELSE REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.serie,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') END AS msisdn,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(fi.lobs2 AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS conta,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.usr5,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS tipo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.ficcusto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS loja,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.morada,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS morada,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.local,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS local,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.codpost,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS codpost,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.contacto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS contacto,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.email,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS email,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.telefone,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS telefone,\n  CAST(ISNULL(bo.obrano,0) AS int) AS rpn_no,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.tabela1,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_status,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.u_motivobo,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_bo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo.obstab2 AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_notas,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo2.u_resnego AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_resumo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo.u_zrela AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_log,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.cobranca,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_interloc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.ean,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_tel,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.dprocesso,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_email,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab1,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ent1,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab2,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ent2,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab3,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_entloc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab4,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_entcp,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.segmento,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_pzperm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.ccusto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_loja,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctgsm,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctgsm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctdados,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctdados,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctadsl,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctadsl,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_contad,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctgsm2,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_nconta,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_novaconta,\n  CAST(ISNULL(bo2.u_pnesp,0) AS int) AS rpn_pnesp,\n  CAST(ISNULL(bo2.u_aprovga,0) AS int) AS rpn_aprovga,\n  CAST(ISNULL(bo2.u_novonif,0) AS int) AS rpn_novonif,\n  CAST(ISNULL(bo2.u_desconto,0) AS varchar(20)) AS rpn_desconto,\n  CAST(ISNULL(bo2.u_subsidi,0) AS varchar(20)) AS rpn_subsidi,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_infrisco,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_infrisco\nFROM ft\nJOIN ft2 ON ft2.ft2stamp = ft.ftstamp\nLEFT JOIN fi ON fi.ftstamp = ft.ftstamp AND fi.ref <> 'DPN' AND fi.ref <> ''\nOUTER APPLY (SELECT TOP 1 bi.bostamp FROM fi f2 JOIN bi ON bi.bistamp = f2.bistamp\n             WHERE f2.ftstamp = ft.ftstamp AND f2.bistamp <> '') lk\nLEFT JOIN bo  ON bo.bostamp = lk.bostamp\nLEFT JOIN bo2 ON bo2.bo2stamp = bo.bostamp\nWHERE ft.ndoc = 20 AND ft.fdata >= '20221001'\nORDER BY ft.fdata, ft.fno, fi.lordem;\n";
function lerFicheiroTexto(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error('Não foi possível ler o ficheiro'));
    r.onload=()=>{ const b=new Uint8Array(r.result); let t;
      if (b[0]===0xFF&&b[1]===0xFE) t=new TextDecoder('utf-16le').decode(b); else if (b[0]===0xFE&&b[1]===0xFF) t=new TextDecoder('utf-16be').decode(b);
      else { try{ t=new TextDecoder('utf-8',{fatal:true}).decode(b); }catch(e){ t=new TextDecoder('windows-1252').decode(b); } }
      res(t.replace(/^\uFEFF/,'')); };
    r.readAsArrayBuffer(file); });
}
// MSISDN normalizados (só dígitos, sem o 351) para a ligação ao RUN e para a pesquisa
const normMsisdn = v => { const d=String(v||'').replace(/\D/g,''); return d.length===12&&d.startsWith('351') ? d.slice(3) : d; };
const listaMsisdn = linhas => [...new Set((linhas||[]).map(l=>normMsisdn(l.msisdn)).filter(x=>x.length>=9))];
function pnParse(txt){
  const ls = txt.split(/\r?\n/).filter(l=>l.trim()); if(!ls.length) return {erro:'Ficheiro vazio'};
  let cols=PN_COLS, ini=0; const h=ls[0].split('\t').map(x=>x.trim().toLowerCase());
  if (h[0]==='ftstamp') { cols=h; ini=1; }
  const falta=PN_COLS.filter(c=>!cols.includes(c)); if (falta.length) return {erro:'Faltam colunas no ficheiro: '+falta.join(', ')};
  const porVend={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.vendedorPHC) porVend[String(u.vendedorPHC)]=uid; });
  const nrm = v => String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
  const porNome={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.nome) porNome[nrm(u.nome)]=uid; });
  const num=v=>parseFloat(String(v||'0').replace(',','.'))||0; const pn={}, mal=[];
  for (let i=ini;i<ls.length;i++){
    const c=ls[i].split('\t'); if (c.length!==cols.length) { mal.push(i+1); continue; }
    const o={}; cols.forEach((k,j)=>{ let v=(c[j]||'').trim(); if(v==='NULL') v=''; o[k]=v; });
    if (!o.ftstamp) { mal.push(i+1); continue; }
    const id='phc_'+o.ftstamp.replace(/[^A-Za-z0-9]/g,'_');
    const r = pn[id] = pn[id] || { numero:+o.fno||0, data:o.fdata, estado:'PN', origem:'PHC', phcStamp:o.ftstamp, motivos:[],
      vendedorUid: porVend[o.vendedor]||null, vendedorNome:o.vendnm, vendedorPHC:o.vendedor, subSfid:o.u_ssfid, nOportunidade:o.u_noportun, phcStatus:o.u_ftstatus, phcTipoActivo:o.u_tpactivo,
      boUid:porNome[nrm(o.rpn_bo)]||null, boNome:o.rpn_bo||'', rpnAgregado:false, clienteParticular:false, atividade:o.u_tpactivo||'Elegível/Carteira',
      notas:o.rpn_notas||'', loja:o.rpn_loja||o.loja||'', phcRpn:+o.rpn_no||null, phcRpnStatus:o.rpn_status||'', phcLog:o.rpn_log||'',
      condicoes:{pnEspecial:o.rpn_pnesp==='1', aprovacaoGA:o.rpn_aprovga==='1', novoNif:o.rpn_novonif==='1', desconto:num(o.rpn_desconto), subsidiacao:num(o.rpn_subsidi), reuniao:'', infoRisco:o.rpn_infrisco||'', resumo:o.rpn_resumo||''},
      contas:{gsm:o.rpn_ctgsm||'', dados:o.rpn_ctdados||'', adsl:o.rpn_ctadsl||'', gsm2:o.rpn_ctgsm2||'', novaConta:o.rpn_novaconta||''},
      cliente:{nome:o.nome, nCliente:o.no, nif:o.ncont.replace(/\s/g,''), email:o.email||o.rpn_email||'', interlocutor:o.rpn_interloc||o.contacto||'', telefone:o.rpn_tel||o.telefone||'', morada1:o.rpn_ent1||o.morada||'', morada2:o.rpn_ent2||'', localidade:o.rpn_entloc||o.local||'', codPostal:o.rpn_entcp||o.codpost||''},
      prazoPermanencia:parseInt(o.rpn_pzperm)||+o.u_pzperm||24, linhas:[], fechadoEm:o.fdata+'T12:00:00.000Z', fechadoMes:null, mesRef:o.fdata.slice(0,7), cargaContada:0, confContada:0 };
    if (o.ref) { const k=r.cliente; if(!k.email&&o.email) k.email=o.email; if(!k.interlocutor&&o.contacto) k.interlocutor=o.contacto; if(!k.morada1&&o.morada){ k.morada1=o.morada; k.localidade=o.local; k.codPostal=o.codpost; } if(!r.loja&&o.loja) r.loja=o.loja; }
    if (o.ref) r.linhas.push({ref:o.ref, designacao:o.design, natureza:o.u_natureza, msisdn:o.msisdn, nConta:o.conta, tipo:o.tipo, rlmc:num(o.rlmc), prazo:+o.u_pzperm||0, tier:o.u_tipotarv, pricingPlan:(o.u_pricplan==='0'?'':o.u_pricplan.replace(/\.0+$/,'')), descontinuado:o.u_descont==='1', upgrade:false, contratoVDF:o.u_contrvdf.toUpperCase(), oportunidade:o.u_oport, scorePHC:num(o.score)});
  }
  const lista = Object.entries(pn).map(([id,r])=>{ if (!r.condicoes.resumo && r.notas) { r.condicoes.resumo=r.notas; r.notas=''; r.phcResumoDeNotas=true; } r.nLinhas=r.linhas.length; r.totRLMC=Math.round(r.linhas.reduce((a,l)=>a+l.rlmc,0)*100)/100; r.totScore=Math.round(r.linhas.reduce((a,l)=>a+l.scorePHC,0)*1000)/1000;
    r.contratos=[...new Set(r.linhas.map(l=>l.contratoVDF).filter(Boolean))]; r.msisdns=listaMsisdn(r.linhas); return {id, ...r}; });
  return {lista, mal};
}

    try { for (let i=0;i<L.length;i+=300){ const b=writeBatch(db);
        L.slice(i,i+300).forEach(({id,...r})=>b.set(doc(db,'rpn',id),{...r, importadoEm:serverTimestamp(), importadoPor:S.me.uid}));

    <div class="card scroll"><table><thead><tr><th>Nome</th><th>Utilizador</th><th>Email</th><th>Perfil</th><th>SFID</th><th>Vend. PHC</th><th>Telefone</th><th>Recebe RPN</th><th>Ativo</th><th></th></tr></thead><tbody>
    ${us.map(([uid,u])=>`<tr data-uid="${uid}"><td><input data-k="nome" value="${esc(u.nome)}"></td><td>${esc(u.username)}</td><td>${esc(u.email)}</td>

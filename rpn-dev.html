<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23e60000%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2726%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23fff%27%3ERPN%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#e60000;--red-d:#b80000;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e3e6;--bg:#f5f5f7;--card:#fff;--ok:#1a7f37;--warn:#b26a00;--info:#0b5cad;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #cfcfd4;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f0f0f2;color:#555}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.btn{border:1px solid #cfcfd4;background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f0f2}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;color:var(--red);font-size:16px}
header nav{display:flex;gap:4px;flex:1}
header nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
header nav a.on{background:#fde8e8;color:var(--red-d)}
header .who{font-size:12px;color:var(--mut);text-align:right}
main{padding:20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--mut)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;background:#fafafa;position:sticky;top:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#fafafa}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eee;white-space:nowrap}
.b-Em-Elaboração{background:#eee;color:#444}
.b-Submetido{background:#e7f0fb;color:var(--info)}
.b-Em-Implementação{background:#e8e4fb;color:#4b2fb0}
.b-Pendente-Comercial,.b-Pendente-Documentos{background:#fff3df;color:var(--warn)}
.b-Concluído,.b-PN{background:#e6f4ea;color:var(--ok)}
.b-Em-Conferência{background:#e0f4f7;color:#0b6b7a}
.b-A-aguardar,.b-A-aguardar-ciclo{background:#eef0f4;color:#4a5568}.venc{background:#fde8e8!important;color:var(--red-d)!important}
.b-Cancelado,.b-Reprovado,.b-Recusado{background:#fde8e8;color:var(--red-d)}
.b-Em-tratamento{background:#e8e4fb;color:#4b2fb0}
.pj-0{background:#fff4d6;color:#8a5a00}.pj-1{background:#e0ecff;color:#1d4ed8}.pj-2{background:#dcfce7;color:#166534}.pj-3{background:#fde8e8;color:var(--red-d)}.pj-4{background:#ede9fe;color:#5b21b6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;min-width:110px}
.chip b{display:block;font-size:20px}.chip.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut)}
.tabs a.on{border-color:var(--red);color:var(--ink);font-weight:600}
.lines input,.lines select{padding:4px 6px;font-size:13px}
.lines td{padding:3px 4px;white-space:nowrap}
.lines tr.bh td{background:#f3f4f6;border-top:2px solid #d1d5db}.lines tr.bf td:first-child{border-left:3px solid #d1d5db}
.tot td{font-weight:700;background:#fafafa}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw}
#toast.err{background:var(--red-d)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:#fff;border-radius:10px;padding:20px;width:min(560px,92vw);max-height:90vh;overflow:auto}
.login{max-width:360px;margin:12vh auto}
.msgs{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{background:#f3f3f5;border-radius:8px;padding:8px 10px;max-width:80%}
.msg.mine{background:#fde8e8;align-self:flex-end}
.msg.auto{background:#eef2ff;border:1px solid #c7d2fe;align-self:center;text-align:center;font-weight:600}
.msg small{display:block;color:var(--mut);font-size:11px}
.hist td{font-size:13px}
.motivos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 12px}
.motivos label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;margin:0}
.cli-box{position:relative}.cli-res{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:340px;overflow:auto;display:none}
.cli-res.on{display:block}.cli-res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f1f1}.cli-res div:hover,.cli-res div.sel{background:#f6f6f6}.cli-res small{color:#777}
.warnbox{background:#fff3df;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;margin-bottom:12px}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.motivos{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style>
</head>
<body>
<div id="app"><div class="login muted">A carregar…</div></div>

<script type="module">
// =====================================================================
//  RPN — Registo de Processo de Negócio · Redemóvel   (Fase 1)
//  DEV: rpn-dev.html   ·   PRODUÇÃO: rpn.html
// =====================================================================

// ---------- 1. CONFIGURAÇÃO FIREBASE (colar do Firebase Console) ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKvTxqGq2BWtpgaDmkZvasyU0f-ax3GrY",
  authDomain: "redemovel-rpn.firebaseapp.com",
  projectId: "redemovel-rpn",
  storageBucket: "redemovel-rpn.firebasestorage.app",
  messagingSenderId: "418514108309",
  appId: "1:418514108309:web:a8cc65c3a2a0e304cd009c"
};
const EMAIL_DOMAIN = 'redemovel.pt';   // "pmota" → pmota@redemovel.pt

import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword,
         sendPasswordResetEmail, updatePassword, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, setDoc as _setDoc, updateDoc as _updateDoc, addDoc as _addDoc, deleteDoc as _deleteDoc, collection, query, where, orderBy,
         limit, runTransaction as _runTransaction, serverTimestamp, writeBatch as _writeBatch, onSnapshot, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject, connectStorageEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

// economia de leituras: a lista de RPN fica em memória 1 minuto; qualquer escrita feita nesta sessão obriga a reler
let LISTA_EM = 0, AT_EM = 0;
const suja = f => (...a) => { LISTA_EM = 0; AT_EM = 0; return f(...a); };
const setDoc = suja(_setDoc), updateDoc = suja(_updateDoc), addDoc = suja(_addDoc), deleteDoc = suja(_deleteDoc), runTransaction = suja(_runTransaction), writeBatch = suja(_writeBatch);
const LISTA_TTL = 60000;
const EMU = new URLSearchParams(location.search).has('emu') && ['localhost','127.0.0.1'].includes(location.hostname);
const cfg = EMU ? {apiKey:'demo-key',authDomain:'demo-rpn.firebaseapp.com',projectId:'demo-rpn',storageBucket:'demo-rpn.appspot.com',appId:'demo'} : FIREBASE_CONFIG;
const app = initializeApp(cfg);
const auth = getAuth(app), db = getFirestore(app), st = getStorage(app);
if (EMU) { connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true}); connectFirestoreEmulator(db,'127.0.0.1',8080); connectStorageEmulator(st,'127.0.0.1',9199); }

// ---------- 2. TABELAS DE NEGÓCIO ----------
const ESTADOS  = ['Em Elaboração','Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','Em Conferência','PN','Cancelado','Reprovado'];
const ESTADOS_MAN = ['Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','Cancelado','Reprovado'];   // os que a BO escolhe à mão; Conferência e PN só pelos botões
const FECHADOS = ['PN','Concluído','Cancelado','Reprovado'];
const EM_CURSO = ['Em Elaboração','Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','A aguardar ciclo','Em Conferência'];
// ciclos de faturação da Vodafone: a BO implementa e espera pelo fecho do ciclo para verificar se a alteração entrou sem erro
const CICLOS = [['08','Dia 8'],['15','Dia 15'],['22','Dia 22'],['31','Fim do mês']];
function proxCiclo(dia, de=new Date()){
  const fim = (a,m) => new Date(a, m+1, 0).getDate(), iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let a=de.getFullYear(), m=de.getMonth(); const alvo = (a,m) => dia==='31' ? fim(a,m) : Math.min(+dia, fim(a,m));
  if (de.getDate() > alvo(a,m)) { m++; if (m>11) { m=0; a++; } }
  return iso(new Date(a, m, alvo(a,m)));
}
window.__rpn = {proxCiclo};   // exposto só para os testes automáticos
// esperas do lado da BO: o processo está implementado (ou pedido) e aguarda algo da Vodafone antes de seguir para conferência
const ESPERAS = [['ciclo','Ciclo de faturação'],['instalacao','Instalação marcada'],['1229','Enviado 1229'],['1229os','1229 via OS'],['portabilidade','Portabilidade enviada'],['aprovacao','Aprovação Vodafone']];
const ESPERA_TXT = Object.fromEntries(ESPERAS);
// (versão anterior: estado 'A aguardar ciclo' com cicloData) → 'A aguardar' com motivo e data
function normEspera(r){ if (r && r.estado==='A aguardar ciclo') { r.estado='A aguardar'; r.esperaMotivo='ciclo'; r.esperaData=r.esperaData||r.cicloData||''; } return r; }
const diasDesde = iso => iso ? Math.max(0, Math.floor((new Date(hoje()) - new Date(String(iso).slice(0,10))) / 864e5)) : 0;
const esperaVencida = r => r.estado==='A aguardar' && r.esperaData && r.esperaData < hoje();
const esperaTxt = r => { const m = ESPERA_TXT[r.esperaMotivo]||'A aguardar'; return r.esperaData ? `${m} · ${esperaVencida(r)?'verificar, passou ':'até '}${fmtD(r.esperaData)}` : `${m} · há ${diasDesde(r.esperaDesde)} dia(s)`; };
const ABERTOS  = ['Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','A aguardar ciclo'];   // contam para a carga da BO
const estTxt = e => e==='Em Conferência' ? 'Concluído' : (e||'');   // na base de dados continua «Em Conferência»
const DIAS_CONCLUIDO = 8;   // dias em que um processo concluído ainda aparece na lista do comercial
const EDIT_COM = ['Em Elaboração','Pendente Comercial','Pendente Documentos'];                // comercial pode editar
const MOTIVOS  = ['Doc. Identificação','Contrato','CRC','Morada','Condições Comerciais','Dívida'];
const NATUREZAS= ['Ref Móvel','Nova Móvel','Ref Fixo','Nova Fixo','Nova SS'];
const LOJAS    = ['Externos','LOA','L8A','LAR','LLI','LOV','LVO'];
const PRAZOS   = [12,18,24,30,36,48];
const PERFIS   = ['comercial','coordenador','backoffice','bo_financeiro','master'];
const PERFIL_TXT = {comercial:'Comercial',coordenador:'Coordenador',backoffice:'BackOffice',bo_financeiro:'BO Financeiro',master:'Master'};
const ATIVIDADE= ['Elegível/Carteira','Não Incentivada'];

// Score = RLMC × ajuste prazo × ajustes / 22,50   (Manual Comissões Redemóvel + Plano VDF FY26/27)
const SCORE_BASE = 22.5;
function fatorPrazo(m){ m=+m||0; if(m>=48)return 1.5; if(m>=36)return 1.2525; if(m>=30)return 1.125; if(m>=24)return 1; if(m>=18)return 0.6488; if(m>=12)return 0.4; return 0; }
const FATOR_TIER = {Gold:1, Bronze:0.6, Silver:0.6, Estanho:0.36};   // Bronze = Gold desc.; Estanho = Silver desc.
function scoreLinha(l, r){
  let f = fatorPrazo(l.prazo) * (FATOR_TIER[l.tier] ?? 1);
  if (l.descontinuado && (l.tier==='Gold' || l.tier==='Silver')) f *= 0.6;
  if (r.clienteParticular) f *= 0.6;
  if (r.atividade==='Não Incentivada' && /Móvel/.test(l.natureza||'')) f *= 0.6;
  const s = (+l.rlmc||0) * f / SCORE_BASE;
  if (l.scorePHC!=null) return +l.scorePHC||0;   // PN importado do PHC: fica o Score que lá estava
  return Math.round((s+1e-9)*1000)/1000;   // arredondado, como no PHC (15,02 → 0,668)
}

// ---------- 3. ESTADO / UTILITÁRIOS ----------
const S = { user:null, me:null, users:{}, prodMap:{}, prodList:[], list:null, cur:null, tab:'principal', dirty:false, filtros:{estado:'',txt:'',vend:'',bo:'',mes:'',meus:null}, unsub:[] };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (+n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const n3  = n => (+n||0).toLocaleString('pt-PT',{minimumFractionDigits:3,maximumFractionDigits:3});
const hoje = () => new Date().toISOString().slice(0,10);
const mesLocal = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const fmtD = d => d ? d.split('-').reverse().join('.') : '';
const tsTxt = t => { const d = t?.toDate ? t.toDate() : (t ? new Date(t) : null); return d ? d.toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'}) : ''; };
const perfil = () => S.me?.perfil;
const isMaster = () => perfil()==='master';
const isStaff = () => ['backoffice','bo_financeiro','coordenador','master'].includes(perfil());
const isBO = () => ['backoffice','bo_financeiro','master'].includes(perfil());
const userNome = uid => S.users[uid]?.nome || '';
const bos = () => Object.entries(S.users).filter(([,u]) => u.ativo && u.recebeRPN && ['backoffice','bo_financeiro','master'].includes(u.perfil)).map(([uid,u])=>({uid,...u}));
function toast(msg, err=false){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', err?6000:2800); }
function getPath(o,p){ return p.split('.').reduce((a,k)=>a?.[k], o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ a[k]=a[k]||{}; a=a[k]; }); a[ks.at(-1)]=v; }
function errTxt(e){ const c=e?.code||''; if(c.includes('permission-denied'))return 'Sem permissão para esta operação.'; if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Utilizador ou password incorretos.'; if(c.includes('weak-password'))return 'Password demasiado fraca (mín. 8 caracteres).'; if(c.includes('requires-recent-login'))return 'Por segurança, saia e volte a entrar antes de mudar a password.'; if(c.includes('email-already-in-use'))return 'Esse email já tem conta.'; return e?.message||String(e); }
function modal(html, onMount){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal">${html}</div>`; document.body.appendChild(bg); const close=()=>bg.remove(); bg.addEventListener('click',e=>{ if(e.target===bg) close(); }); onMount?.(bg.querySelector('.modal'), close); return close; }
function clearSubs(){ S.unsub.forEach(u=>u()); S.unsub=[]; }

// ---------- 4. ARRANQUE / AUTENTICAÇÃO ----------
onAuthStateChanged(auth, async user => {
  S.user = user; S.me = null; S.dirty = false; S.list = null; LISTA_EM = 0; S.cur = null; S.tab = 'principal'; S.filtros = {estado:'',txt:'',vend:'',bo:'',mes:'',meus:null}; S.extra = []; S.cli = null; S.avisoPend = null; clearSubs();
  if (!user) return renderLogin();
  try {
    const snap = await getDoc(doc(db,'users',user.uid));
    if (!snap.exists() || !snap.data().ativo) { $('#app').innerHTML = `<div class="login card"><h2>Conta sem acesso</h2><p class="muted">A conta ${esc(user.email)} não tem perfil ativo. Contacte o administrador.</p><button class="btn" id="out">Sair</button></div>`; $('#out').onclick=()=>signOut(auth); return; }
    S.me = {uid:user.uid, ...snap.data()};
    S.projN = 0; S.projAtr = 0; Object.assign(AT,{lista:null, mes:null, listaMes:null, extra:[], f:{estado:'',txt:'',meus:null}, cur:null, tab:'pedido', pend:null}); AT_EM = 0; Object.assign(CL,{q:'', nif:null, tab:'ficha', f:null, edit:false, novo:false, d:{}}); Object.assign(PJ,{tab:'tratar', mes:null, vend:'', lista:[], cfg:{}});
    await Promise.all([loadUsers(), loadProdutos()]);
    handlePropostaParam();
    render();
    projetosAoEntrar();   // não bloqueia a entrada
    if (isStaff()) setTimeout(()=>agenteDados(trimId(mesLocal())).catch(()=>{}), 4000);   // performance do agente: 1×/dia, pela primeira pessoa da staff
  } catch(e){ toast(errTxt(e), true); console.error(e); }
});
window.addEventListener('hashchange', () => { if (S.me) render(); });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue=''; } });

async function loadUsers(){ const s=await getDocs(collection(db,'users')); S.users={}; s.forEach(d=>S.users[d.id]=d.data()); }
function usarProdutos(l){ S.prodMap={}; S.prodList=[]; l.forEach(p=>{ if(!p||!p.ref) return; S.prodMap[p.ref.toUpperCase()]=p; S.prodList.push(p); }); S.prodList.sort((a,b)=>a.ref.localeCompare(b.ref)); }
const CAT_KEY = 'rdm-catalogo';   // partilhado com a app Propostas (mesmo site)
function guardarCatalogo(v){ try{ localStorage.setItem(CAT_KEY, JSON.stringify({v:String(v), l:S.prodList})); }catch(e){ try{ localStorage.removeItem(CAT_KEY); }catch(_){} } }
// economia de leituras: o catálogo fica guardado no browser; à entrada lê-se só a versão (config/catalogo) e relê-se tudo apenas quando mudou
async function loadProdutos(forcar){
  let v=''; try{ v=String((await getDoc(doc(db,'config','catalogo'))).data()?.v||''); }catch(e){}
  if (!forcar && v) { try{ const c=JSON.parse(localStorage.getItem(CAT_KEY)||'null'); if (c && c.v===v && Array.isArray(c.l) && c.l.length) { usarProdutos(c.l); return; } }catch(e){} }
  const s=await getDocs(collection(db,'produtos')); usarProdutos(s.docs.map(d=>d.data()));
  if (!v && isStaff()) { v=String(Date.now()); try{ await _setDoc(doc(db,'config','catalogo'),{v},{merge:true}); }catch(e){ v=''; } }   // primeira vez: cria a versão
  if (v) guardarCatalogo(v);
}
// depois de alterar o catálogo: nova versão (os outros utilizadores releem na próxima entrada) e cache local atualizada
async function catalogoMudou(){
  const v=String(Date.now());
  try{ await _setDoc(doc(db,'config','catalogo'),{v, por:S.me.nome},{merge:true}); guardarCatalogo(v); }
  catch(e){ try{ localStorage.removeItem(CAT_KEY); }catch(_){} toast('Catálogo gravado, mas a versão não foi atualizada (regras por publicar?). Os colegas podem continuar a ver o catálogo antigo.', true); }
}
function produtoLocal(ref, d){ const l=S.prodList.filter(p=>p.ref.toUpperCase()!==String(ref).toUpperCase()); if (d) l.push(d); usarProdutos(l); }

function renderLogin(){
  $('#app').innerHTML = `<div class="login card">
    <h1 style="color:var(--red);margin-bottom:4px">Redemóvel · RPN</h1>
    <p class="muted" style="margin-top:0">Registo de Processo de Negócio</p>
    <form id="lf" class="grid">
      <div><label>Utilizador ou email</label><input id="lu" autocomplete="username" required></div>
      <div><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div>

async function viewLista(forcar){
  const m = $('#main');
  if (!S.filtros.mes) S.filtros.mes = mesLocal();
  if (!forcar && S.list && S.listMes===S.filtros.mes && Date.now()-LISTA_EM < LISTA_TTL) return drawLista();   // lida há menos de 1 minuto e sem escritas desde então
  m.innerHTML = `<div class="card muted">A carregar RPNs…</div>`;
  try {
    // economia de leituras: os processos em curso + os fechados do mês escolhido (o histórico procura-se à parte)
    const col = collection(db,'rpn'), meu = isStaff() ? [] : [where('vendedorUid','==',S.me.uid)];
    const [a, f] = await Promise.all([getDocs(query(col, ...meu, where('estado','in',EM_CURSO))), getDocs(query(col, ...meu, where('mesRef','==',S.filtros.mes)))]);
    const m2 = {}; [...a.docs, ...f.docs, ...(S.extra||[])].forEach(d=>{ const r = typeof d.data==='function' ? {id:d.id,...d.data()} : d; m2[r.id]=r; });
    Object.values(m2).forEach(normEspera);

async function procurarHistorico(){
  const t = (S.filtros.txt||'').trim(); if (t.length<4) return toast('Escreva na caixa de pesquisa o nº do processo, o NIF, o email do cliente, o contrato VDF ou o MSISDN completos.', true);
  const col = collection(db,'rpn'), meu = isStaff() ? [] : [where('vendedorUid','==',S.me.uid)];
  const qs = [query(col, ...meu, where('cliente.nif','==',t)), query(col, ...meu, where('contratos','array-contains',t.toUpperCase()))];
  if (t.includes('@')) [...new Set([t, t.toLowerCase()])].forEach(e=>qs.push(query(col, ...meu, where('cliente.email','==',e))));
  if (normMsisdn(t).length>=9 && /^[\d\s+]+$/.test(t)) qs.push(query(col, ...meu, where('msisdns','array-contains',normMsisdn(t))));
  if (/^\d+$/.test(t)) qs.push(query(col, ...meu, where('numero','==',+t)));
  const r = await Promise.allSettled(qs.map(q=>getDocs(q)));
  const docs = r.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.docs).map(d=>({id:d.id,...d.data()}));
  if (!docs.length) return toast(r.some(x=>x.status==='rejected') ? 'Não foi possível procurar: '+errTxt(r.find(x=>x.status==='rejected').reason) : 'Nada encontrado no histórico com “'+t+'”.', true);
  S.extra = [...(S.extra||[]).filter(x=>!docs.some(d=>d.id===x.id)), ...docs];
  const m2 = {}; [...S.list, ...docs].forEach(x=>m2[x.id]=x); S.list = Object.values(m2).sort((x,y)=>(y.numero||0)-(x.numero||0));
  S.filtros.estado=''; toast(docs.length+' processo(s) encontrado(s) no histórico.'); drawLista();
}

    cliente:{nome:'',nCliente:'',nif:'',email:'',interlocutor:'',telefone:'',morada1:'',morada2:'',localidade:'',codPostal:''},
    loja:'Externos', dtAtivacao:'', dtFimEquip:'', prazoPermanencia:24, classificacao:'',
    condicoes:{pnEspecial:false,aprovacaoGA:false,novoNif:false,desconto:0,subsidiacao:0,reuniao:'',infoRisco:'',resumo:''},
    contas:{gsm:'',dados:'',adsl:'',gsm2:'',novaConta:''}, notas:'', linhas:[], nLinhas:0, totRLMC:0, totScore:0,
    propostaRef:'', propostaInfo:'', propostaTarif:'', cargaContada:0, grupoId:'' };
}
// ---- referências compostas (bundles): a linha abre nas filhas, cada uma com a sua % da RLMC total ----
const novoGid = () => Math.random().toString(36).slice(2,10);
const composicaoDe = pr => (pr && Array.isArray(pr.composicao) && pr.composicao.length) ? pr.composicao : null;
function distribuir(ls, total){
  total = Math.round((+total||0)*100)/100; if(!ls.length) return; let soma=0, maior=ls[0];
  ls.forEach(l=>{ l.bTot=total; l.rlmc=Math.round(total*(+l.bPct||0)*100)/100; soma+=l.rlmc; if((+l.bPct||0)>(+maior.bPct||0)) maior=l; });
  maior.rlmc = Math.round((maior.rlmc+total-soma)*100)/100;   // cêntimos do arredondamento vão para a filha maior
}
function linhasDoProduto(base, pr, total){
  const comp = composicaoDe(pr);
  if (!comp) { const l={...base}; aplicarProduto(l,pr); return [l]; }
  const g=novoGid(), nova=/^Nova/.test(base.natureza||'');
  const ls = comp.map(c=>{ const f=S.prodMap[String(c.ref).toUpperCase()]||{ref:c.ref,designacao:c.ref,categoria:''};
    return {...linhaVazia(), ref:f.ref, designacao:f.designacao, tier:f.tier||'', pricingPlan:f.pricingPlan||'', descontinuado:!!f.descontinuado,
      natureza:(nova?'Nova ':'Ref ')+(f.categoria==='Fixo'?'Fixo':'Móvel'), prazo:base.prazo||24, upgrade:!!base.upgrade, nConta:base.nConta||'', contratoVDF:base.contratoVDF||'',
      bGid:g, bRef:pr.ref, bDes:pr.designacao||'', bPct:+c.pct||0, bTot:0}; });
  (ls.find(l=>/Móvel/.test(l.natureza))||ls[0]).msisdn = base.msisdn||'';
  distribuir(ls, total!=null ? total : (+base.rlmc||0));
  return ls;
}
function linhaVazia(t){ if (t && t.bGid) return {...linhaVazia(), natureza:t.natureza, prazo:t.prazo};
  return t ? {...t, msisdn:'', contratoVDF:'', upgrade:false} : {ref:'',designacao:'',natureza:'Ref Móvel',msisdn:'',nConta:'',rlmc:0,prazo:24,tier:'',pricingPlan:'',descontinuado:false,upgrade:false,contratoVDF:''}; }

async function viewFicha(id){
  const m = $('#main');
  if (!id || S.cur?.id !== id) S.tab = 'principal';
  S.grupo = null;
  if (!id) {
    S.cur = S.pendingNovo || rpnVazio(); S.pendingNovo = null; S.cur.id = null; S.tab='principal';
    S.dirty = !!S.cur.propostaRef;
  } else {
    m.innerHTML = `<div class="card muted">A carregar…</div>`;
    try { const s = await getDoc(doc(db,'rpn',id)); if(!s.exists()) { m.innerHTML='<div class="card">RPN não encontrado.</div>'; return; } S.cur = normEspera({id, ...s.data()}); }
    catch(e){ m.innerHTML=`<div class="card">${esc(errTxt(e))}</div>`; return; }
    S.dirty = false;
  }
  drawFicha();
}

function perms(){
  const r = S.cur, own = r.vendedorUid===S.me.uid, nov = !r.id;
  const edCom = (own||nov) && EDIT_COM.includes(r.estado);
  // um PN está fechado: só o Master o altera
  const boEd = isBO() && r.origem!=='PHC' && (!['PN','Concluído'].includes(r.estado) || isMaster());
  return { own, nov, bo:isBO(), edit: boEd || edCom, edCom };
}

function drawFicha(){
  const r = S.cur, p = perms(), dis = p.edit ? '' : 'disabled';
  recalc();
  const tabs = [['principal','Processo'],['anexos','Anexos'],['msg','Mensagens'],['hist','Histórico']];
  if (r.id && r.estado==='PN' && (r.vendedorUid===S.me.uid || isFin())) tabs.splice(1,0,['com','Comissão']);
  if (!tabs.some(t=>t[0]===S.tab)) S.tab='principal';
  const acts = [];
  if (p.edit) acts.push(`<button class="btn" id="a-save">Guardar</button><button class="btn" id="a-canc" title="${r.id?'Repõe o que estava gravado':'Sai sem criar o RPN'}">Cancelar</button>`);
  if ((p.own||p.nov||isBO()) && r.estado==='Em Elaboração') acts.push(`<button class="btn pri" id="a-sub">Submeter à BackOffice</button>`);
  if ((p.own||p.nov||isBO()) && r.estado==='Em Elaboração' && r.origem!=='PHC') acts.push(`<button class="btn" id="a-div" title="Vários processos para o mesmo negócio (ex.: prazos de fidelização diferentes)">Dividir em vários RPN</button>`);
  if (p.own && ['Pendente Comercial','Pendente Documentos'].includes(r.estado)) acts.push(`<button class="btn pri" id="a-resp">Resolvido · devolver à BO</button>`);
  if (r.id && r.origem!=='PHC' && ((p.own && r.estado==='Em Elaboração') || isMaster())) acts.push(`<button class="btn" id="a-del" style="color:var(--red-d)">Eliminar</button>`);
  if (isBO() && r.id && r.origem!=='PHC' && ABERTOS.includes(r.estado)) acts.push(`<button class="btn" id="a-sep" title="Passa algumas linhas para um RPN novo do mesmo negócio (por exemplo as que ficam à espera de instalação), para as restantes poderem seguir">Separar linhas</button>`);
  if (isBO() && r.id && ['Submetido','Em Implementação','A aguardar'].includes(r.estado)) acts.push(`<button class="btn pri" id="a-conf">Implementação terminada · enviar para conferência</button>`);
  if (isBO() && r.estado==='Em Conferência' && r.boUid!==S.me.uid && (r.confUid===S.me.uid || isMaster())) acts.push(`<button class="btn pri" id="a-ok">Conferido · fechar como PN</button><button class="btn" id="a-dev">Devolver à implementação</button>`);
  if (isBO() && r.id && ABERTOS.includes(r.estado)) acts.push(`<button class="btn" id="a-real">Realocar BO</button>`);
  if (isBO() && r.estado==='Em Conferência') acts.push(`<button class="btn" id="a-realc">Realocar conferência</button>`);
  if (isBO() && r.estado==='PN') acts.push(`<button class="btn ${r.pnEmail||r.origem==='PHC'?'':'pri'}" id="a-pnm" title="Envia ao cliente o PDF do Processo de Negócio">${r.pnEmail?'Reenviar PN ao cliente':'Enviar PN ao cliente'}</button>`);
  if (isMaster() && ['PN','Concluído'].includes(r.estado) && r.origem!=='PHC') acts.push(`<button class="btn" id="a-reab">Reabrir</button>`);

  $('#main').innerHTML = `
    <div class="row" style="margin-bottom:12px">
      <button class="btn ghost" id="back">← Lista</button>
      <h1>${r.numero?`${r.estado==='PN'?'PN':'RPN'} ${r.numero}`:'Novo RPN'}</h1>
      <span class="badge b-${r.estado.replace(/ /g,'-')}">${esc(estTxt(r.estado))}</span>${r.estado==='PN'&&(r.origem!=='PHC'||r.pnEmail)?(r.pnEmail?`<span class="muted" id="pn-env" style="font-size:12px">✉ enviado ao cliente (${esc(r.pnEmail.para)}) em ${tsTxt(r.pnEmail.em)}</span>`:`<span id="pn-env" style="font-size:12px;color:var(--red-d);font-weight:600">✉ por enviar ao cliente</span>`):''}
      ${r.boNome?`<span class="muted">BO: <b>${esc(r.boNome)}</b></span>`:''}
      ${r.estado==='Em Conferência'?`<span class="muted">Conferência: <b>${esc(r.confNome||'em fila (sem BO disponível)')}</b></span>`:''}
      ${r.origem==='PHC'?`<span class="badge">histórico PHC</span>`:(r.estado==='PN'?`<span class="muted">Conferido por <b>${esc(r.conferidoPorNome||r.confNome||'—')}</b></span>`:'')}
      <span class="sp"></span>${acts.join('')}
    </div>
    ${r.propostaRef?`<div class="warnbox">Criado a partir da proposta <b>${esc(r.propostaRef)}</b>${r.propostaInfo?` — ${esc(r.propostaInfo)}`:''}${r.propostaTarif?`<div class="muted" style="font-size:12px;margin-top:4px">Serviços na proposta: ${esc(r.propostaTarif)}</div>`:''}</div>`:''}
    <div id="grp"></div>
    ${r.estado==='A aguardar'?`<div class="warnbox" ${esperaVencida(r)?'style="border-color:var(--red);background:#fde8e8"':''}><b>${esperaVencida(r)?'Verificar na Vodafone':'A aguardar'}:</b> ${esc(esperaTxt(r))}${esperaVencida(r)?'. Se está tudo certo, envie para conferência; se deu erro, volte a “Em Implementação”.':''}</div>`:''}
    ${r.confNota && ABERTOS.includes(r.estado)?`<div class="warnbox"><b>Devolvido pela conferência${r.confNome?` (${esc(r.confNome)})`:''}:</b> ${esc(r.confNota)}</div>`:''}
    ${(r.motivos||[]).length && !FECHADOS.includes(r.estado) && r.estado!=='Em Conferência'?`<div class="warnbox"><b>Pendente:</b> ${esc(r.motivos.join(', '))}</div>`:''}
    <div class="tabs">${tabs.map(([k,t])=>`<a data-t="${k}" class="${S.tab===k?'on':''}">${t}${k==='msg'&&msgPorLer(r)?' <b style="color:var(--red)">● nova</b>':''}</a>`).join('')}</div>
    <div id="tabc"></div>`;
  $('#back').onclick=()=>go('#/lista');
  document.querySelectorAll('.tabs a').forEach(a=>a.onclick=()=>{ S.tab=a.dataset.t; clearSubs(); drawFicha(); });
  $('#a-save')?.addEventListener('click',()=>guardar());
  $('#a-canc')?.addEventListener('click',()=>{ if (S.dirty && !confirm('Descartar as alterações que não foram guardadas?')) return; S.dirty=false; if (S.cur?.id) viewFicha(S.cur.id); else location.hash='#/lista'; });
  $('#a-sub')?.addEventListener('click',()=>acaoGrupo('submeter',{submeter:true}));
  $('#a-div')?.addEventListener('click',dividir);
  $('#a-sep')?.addEventListener('click',separarLinhas);
  desenharGrupo();
  $('#a-resp')?.addEventListener('click',()=>guardar({devolver:true}));
  $('#a-del')?.addEventListener('click',eliminar);
  $('#a-conf')?.addEventListener('click',()=>{ const sem=(S.cur.linhas||[]).filter(l=>!String(l.contratoVDF||'').trim()).length;
    if (sem && !confirm(`Há ${sem} linha(s) sem nº de contrato VDF.\n\nEnviar para conferência na mesma?`)) return; acaoGrupo('conferencia',{conferencia:true}); });
  $('#a-ok')?.addEventListener('click',()=>{ if(confirm(`Confirma que conferiu a implementação do RPN ${S.cur.numero} na Vodafone?\n\nO RPN fica fechado como PN (Processo de Negócio).${S.grupo?.lista?.length?`\n\nOs outros RPN do grupo em conferência (${S.grupo.lista.filter(x=>x.estado==='Em Conferência').map(x=>x.numero).join(', ')||'nenhum'}) fecham também.`:''}`)) acaoGrupo('conferido',{conferido:true}).then(()=>{ if (S.cur?.estado==='PN' && S.cur.origem!=='PHC') pnEmailPopup(S.cur); }); });
  $('#a-dev')?.addEventListener('click',()=>pedirRazao('Devolver à implementação','', 'Devolver', rz=>acaoGrupo('devolverImpl',{devolverImpl:rz})));
  $('#a-real')?.addEventListener('click',()=>realocar('bo'));
  $('#a-realc')?.addEventListener('click',()=>realocar('conf'));
  $('#a-pnm')?.addEventListener('click',()=>pnEmailPopup(S.cur));
  $('#a-reab')?.addEventListener('click',()=>{ if(confirm('Reabrir este processo? Volta a “Em Implementação”.')) guardar({reabrir:true}); });
  const tc = $('#tabc');
  if (S.tab==='principal') tabPrincipal(tc, dis, p);
  else if (S.tab==='anexos') tabAnexos(tc, p);
  else if (S.tab==='msg') tabMsg(tc);
  else if (S.tab==='com') tabComissao(tc);
  else tabHist(tc);
  // binding genérico data-f
  tc.querySelectorAll('[data-f]').forEach(el=>{
    const ev = el.type==='checkbox'||el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev,()=>{ let v = el.type==='checkbox'?el.checked : el.type==='number'?(parseFloat(el.value)||0) : el.value; setPath(S.cur, el.dataset.f, v); S.dirty=true; if(['clienteParticular','atividade'].includes(el.dataset.f)) updTotals(); });
    if (el.dataset.f==='cliente.nif') el.addEventListener('change', async()=>{ const r=S.cur; if(await preencherCliente(r) && S.cur===r){ S.dirty=true; drawFicha(); toast('Dados do cliente preenchidos a partir da ficha.'); } });
  });
}

const fld = (lab, path, dis, type='text', extra='') => { const v=getPath(S.cur,path); return `<div><label>${lab}</label>${type==='checkbox'?`<input type="checkbox" data-f="${path}" ${v?'checked':''} ${dis}>`:`<input type="${type}" data-f="${path}" value="${esc(v)}" ${dis} ${extra}>`}</div>`; };
const sel = (lab, path, opts, dis) => `<div><label>${lab}</label><select data-f="${path}" ${dis}>${opts.map(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(getPath(S.cur,path))===String(v)?'selected':''}>${esc(t)}</option>`; }).join('')}</select></div>`;

      <div id="cx-esp" style="${r.estado==='A aguardar'?'':'display:none'};grid-column:span 2"><div class="grid g2" style="gap:10px">
        <div><label>A aguardar o quê</label><select data-f="esperaMotivo" ${isBO()&&p.edit?'':'disabled'}><option value="">— escolher —</option>${ESPERAS.map(([v,t])=>`<option value="${v}" ${r.esperaMotivo===v?'selected':''}>${t}</option>`).join('')}</select></div>
        <div id="cx-ciclo" style="${r.esperaMotivo==='ciclo'?'':'display:none'}"><label>Ciclo${r.esperaMotivo==='ciclo'&&r.esperaData?` · fecha a ${fmtD(r.esperaData)}`:''}</label><select data-f="cicloDia" ${isBO()&&p.edit?'':'disabled'}><option value="">— escolher —</option>${CICLOS.map(([v,t])=>`<option value="${v}" ${r.cicloDia===v?'selected':''}>${t}</option>`).join('')}</select></div>
        <div id="cx-edata" style="${r.esperaMotivo&&r.esperaMotivo!=='ciclo'?'':'display:none'}"><label id="lb-edata">${r.esperaMotivo==='instalacao'?'Data da instalação':'Voltar a verificar em (opcional)'}</label><input type="date" data-f="esperaData" value="${esc(r.esperaMotivo!=='ciclo'?(r.esperaData||''):'')}" ${isBO()&&p.edit?'':'disabled'}></div>
      </div></div>
      ${r.origem==='PHC'?`<div><label>Resp. BackOffice (PHC)</label><input value="${esc(r.boNome||'—')}" disabled></div><div><label>Registo PN de origem · estado no PHC</label><input value="${esc([r.phcRpn?('nº '+r.phcRpn):'', r.phcRpnStatus].filter(Boolean).join(' · ')||'—')}" disabled></div>`:`<div><label>Resp. BackOffice</label><input value="${esc(r.boNome||'— atribuição automática ao submeter —')}" disabled></div>`}
      ${r.confNome||r.estado==='Em Conferência'?`<div><label>Conferência</label><input value="${esc(r.confNome||'em fila')}" disabled></div>`:''}
      ${sel('Atividade incentivada','atividade',ATIVIDADE,dis)}
      <div class="row" style="align-items:flex-end;gap:16px">
        <label style="display:flex;gap:6px;margin:0;color:var(--ink)"><input type="checkbox" data-f="rpnAgregado" ${r.rpnAgregado?'checked':''} ${dis}> RPN agregado</label>
        <label style="display:flex;gap:6px;margin:0;color:var(--ink)"><input type="checkbox" data-f="clienteParticular" ${r.clienteParticular?'checked':''} ${dis}> Cliente particular</label>
      </div>
    </div>
    ${isBO()&&r.id&&r.origem!=='PHC'?`<div style="margin-top:12px"><label>Motivo(s) de pendência</label><div class="motivos">${MOTIVOS.map(mo=>`<label><input type="checkbox" class="mot" value="${esc(mo)}" ${(r.motivos||[]).includes(mo)?'checked':''} ${p.edit?'':'disabled'}> ${esc(mo)}</label>`).join('')}</div></div>`:''}

      <div class="scroll" id="lines"></div>
    </div>
    <div class="card"><div class="grid g2">
      ${(()=>{ // PN do histórico PHC só com um texto: é o resumo do negócio, mesmo que esteja guardado como nota
        const soNota = r.origem==='PHC' && !r.condicoes?.resumo && r.notas;
        return `<div><label>Resumo do Negócio</label><textarea data-f="condicoes.resumo" ${dis} rows="5">${esc(soNota?r.notas:r.condicoes?.resumo)}</textarea></div>

        || (cq.value.trim().length>=2 ? `<div style="cursor:default;color:#777">${S.cli&&S.cli.length?'Nenhum cliente encontrado. Pode preencher o nome e o NIF à mão, ou criá-lo na app Propostas › Clientes.':(isStaff()?'Ainda não há clientes carregados.':'A sua conta não tem carteira de clientes atribuída.')}</div>` : '');
      box.classList.toggle('on', cq.value.trim().length>=2); };
    const escolhe = async c => { if(!c) return; fecha(); cq.value='';
      const rr=S.cur; rr.cliente.nome=c.nome; rr.cliente.nif=c.nif; await preencherCliente(rr, true);
      if (S.cur===rr) { S.dirty=true; drawFicha(); toast('Cliente escolhido: '+c.nome); } };
    cq.addEventListener('focus', ()=>{ carregarClientes().then(()=>{ if(cq.value.trim().length>=2) mostra(); }).catch(e=>toast(errTxt(e),true)); });
    cq.addEventListener('input', ()=>{ sel=-1; if(S.cli) mostra(); else carregarClientes().then(mostra).catch(e=>toast(errTxt(e),true)); });
    cq.addEventListener('keydown', e=>{ if(!box.classList.contains('on')) return;
      if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); sel = Math.max(0, Math.min(res.length-1, sel+(e.key==='ArrowDown'?1:-1))); mostra(); }
      else if (e.key==='Enter') { e.preventDefault(); escolhe(res[sel>=0?sel:0]); }
      else if (e.key==='Escape') fecha(); });
    box.addEventListener('mousedown', e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); escolhe(res[+d.dataset.i]); } });
    cq.addEventListener('blur', ()=>setTimeout(fecha,150));
    if (!r.id && !r.cliente?.nome) setTimeout(()=>cq.focus(), 50);
  }
  tc.querySelector('[data-f="estado"]')?.addEventListener('change',e=>{ $('#cx-esp').style.display = e.target.value==='A aguardar' ? '' : 'none'; });
  tc.querySelector('[data-f="esperaMotivo"]')?.addEventListener('change',e=>{ const v=e.target.value; $('#cx-ciclo').style.display = v==='ciclo'?'':'none'; $('#cx-edata').style.display = v&&v!=='ciclo'?'':'none'; $('#lb-edata').textContent = v==='instalacao'?'Data da instalação':'Voltar a verificar em (opcional)'; S.cicloMudou=true;
    S.cur.esperaData=''; const di=tc.querySelector('[data-f="esperaData"]'); if(di) di.value=''; });   // ao mudar de motivo, a data anterior deixa de valer
  tc.querySelector('[data-f="cicloDia"]')?.addEventListener('change',()=>{ S.cicloMudou=true; });

  tc.querySelector('[data-f="boUid"]')?.addEventListener('change',e=>{ S.cur.boNome = userNome(e.target.value); });
  tc.querySelector('[data-f="vendedorUid"]')?.addEventListener('change',e=>{ const u=S.users[e.target.value]; S.cur.vendedorNome=u?.nome||''; if(u?.sfid){ S.cur.subSfid=u.sfid; const i=tc.querySelector('[data-f="subSfid"]'); if(i) i.value=u.sfid; } });
  $('#l-add')?.addEventListener('click',()=>{ const ls=S.cur.linhas; ls.push(linhaVazia(ls.at(-1))); S.dirty=true; drawLines(dis); });
  $('#l-bulk')?.addEventListener('click',()=>bulkMsisdn(dis));
}

// ---- produtos do catálogo nas linhas ----
function aplicarProduto(l, pr){
  Object.assign(l,{ref:pr.ref,designacao:pr.designacao,tier:pr.tier,pricingPlan:pr.pricingPlan,descontinuado:pr.descontinuado});
  if (pr.categoria==='Fixo' && /Móvel/.test(l.natureza)) l.natureza=l.natureza.replace('Móvel','Fixo');
  if (pr.categoria==='Móvel' && /Fixo/.test(l.natureza)) l.natureza=l.natureza.replace('Fixo','Móvel');
}
let PROD_DROP = null;
function prodDrop(){
  if (!PROD_DROP) { PROD_DROP=document.createElement('div'); PROD_DROP.className='cli-res'; PROD_DROP.id='prod-res'; PROD_DROP.style.position='fixed'; document.body.appendChild(PROD_DROP);
    window.addEventListener('scroll', ()=>PROD_DROP.classList.remove('on'), true); }
  return PROD_DROP;
}
function procurarProdutos(q){
  const t=semAcento(q).trim(); if (t.length<2) return [];
  const pal=t.split(/\s+/), a=[], b=[], c=[];
  for (const p of S.prodList) { if (p.inativo) continue; const r=semAcento(p.ref), d=semAcento(p.designacao);
    if (r.startsWith(t)) a.push(p); else if (d.startsWith(t)) b.push(p); else if (pal.every(w=>r.includes(w)||d.includes(w))) c.push(p); }
  return [...a,...b,...c].slice(0,12);
}
function drawLines(dis){
  const r = S.cur, L = r.linhas;
  $('#lines').innerHTML = `<table class="lines"><thead><tr><th>#</th><th>Referência</th><th>Designação</th><th>Natureza</th><th>MSISDN</th><th>Nº Conta</th><th class="num">RLMC €</th><th title="Prazo de permanência (meses)">Prazo perm.</th><th>Tier</th><th>PricingPlan</th><th>Desc.</th><th>Upgr.</th><th>Contrato VDF</th><th class="num">Score</th><th></th></tr></thead>
  <tbody>${L.map((l,i)=>`${l.bGid && l.bGid!==L[i-1]?.bGid ? `<tr class="bh" data-g="${esc(l.bGid)}"><td>📦</td><td colspan="5"><b>${esc(l.bRef)}</b> — ${esc(l.bDes)} <span class="muted">· bundle</span></td>

    <td>${dis||l.bGid?'':`<button class="btn sm ghost" data-dup title="Duplicar">⧉</button><button class="btn sm ghost" data-del title="Remover" style="color:var(--red-d)">✕</button>`}</td>
  </tr>`).join('') || `<tr><td colspan="15" class="muted">Sem linhas. ${dis?'':'Use “+ Linha”.'}</td></tr>`}</tbody>
  <tfoot><tr class="tot"><td colspan="6">${L.length} linha(s)</td><td class="num" id="t-rl">${eur(r.totRLMC)}</td><td colspan="6"></td><td class="num" id="t-sc">${n3(r.totScore)}</td><td></td></tr></tfoot></table>`;
  $('#lines').querySelectorAll('[data-l]').forEach(el=>{
    const ev = el.type==='checkbox'||el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev,()=>{
      const i=+el.closest('tr').dataset.i, k=el.dataset.l, l=L[i];
      l[k] = el.type==='checkbox'?el.checked : k==='rlmc'?(parseFloat(el.value)||0) : k==='prazo'?+el.value : el.value;
      S.dirty = true;
      // bundle: o prazo é o mesmo em todas as filhas
      if (l.bGid && k==='prazo') { L.forEach(x=>{ if(x.bGid===l.bGid) x.prazo=l.prazo; }); drawLines(dis); return; }
      // referência escrita por inteiro e sem ambiguidade (nenhuma outra começa da mesma forma): aplica logo
      if (k==='ref') { const v=el.value.trim().toUpperCase(), pr=S.prodMap[v]; if (pr && S.prodList.filter(x=>String(x.ref).toUpperCase().startsWith(v)).length===1) { L.splice(i,1,...linhasDoProduto(l,pr)); prodDrop().classList.remove('on'); drawLines(dis); return; } }
      updTotals();
    });
    // bundle: ao sair do campo, o contrato copia-se para as filhas que ainda não têm contrato
    if (el.dataset.l==='contratoVDF') el.addEventListener('change',()=>{ const l=L[+el.closest('tr').dataset.i]; if(!l.bGid || !l.contratoVDF) return;
      L.forEach((x,j)=>{ if(x.bGid===l.bGid && !String(x.contratoVDF||'').trim()) { x.contratoVDF=l.contratoVDF; const o=$('#lines').querySelector(`tr[data-i="${j}"] [data-l="contratoVDF"]`); if(o) o.value=l.contratoVDF; } }); });
    if (el.dataset.l==='ref') el.addEventListener('change',()=>{ const i=+el.closest('tr').dataset.i, l=L[i], pr=S.prodMap[el.value.trim().toUpperCase()]; if (pr && (composicaoDe(pr) || l.designacao!==pr.designacao)) { L.splice(i,1,...linhasDoProduto(l,pr)); drawLines(dis); } });
  });
  // pesquisa de produtos: escrever na Referência ou na Designação procura nas duas, em qualquer parte do texto
  if (!dis) $('#lines').querySelectorAll('[data-l="ref"],[data-l="designacao"]').forEach(inp=>{
    let res=[], sel=-1; const box=prodDrop();
    const fecha = () => { box.classList.remove('on'); box._dono=null; };
    const aplica = pr => { if(!pr) return; fecha(); const i=+inp.closest('tr').dataset.i, novas=linhasDoProduto(L[i],pr); L.splice(i,1,...novas); S.dirty=true; drawLines(dis); (novas[0].bGid ? $('#lines').querySelector(`tr.bh[data-g="${novas[0].bGid}"] [data-bt]`) : $('#lines').querySelector(`tr[data-i="${i}"] [data-l="msisdn"]`))?.focus(); };
    const mostra = () => { if(!inp.isConnected) return; res=procurarProdutos(inp.value); if(inp.value.trim().length<2) return fecha();
      const rc=inp.getBoundingClientRect(); Object.assign(box.style,{left:Math.max(8,Math.min(rc.left, innerWidth-560))+'px', top:(rc.bottom+2)+'px', width:'540px', right:'auto'});
      // sem resultados: dizer porquê, em vez de não mostrar nada
      if (!res.length) { box.innerHTML=`<div style="cursor:default;color:#777">${S.prodList.length?`Nenhum produto com “${esc(inp.value.trim())}” nos ${S.prodList.length} do catálogo. Pode escrever a referência à mão.`:'O catálogo de produtos está vazio. O Master tem de o importar em Administração › Catálogo PHC.'}</div>`; box.classList.add('on'); box._dono=inp; box.onmousedown=null; return; }
      box.innerHTML=res.map((p,i)=>`<div data-i="${i}" class="${i===sel?'sel':''}"><b>${esc(p.ref)}</b> — ${esc(p.designacao)}<br><small>${esc(composicaoDe(p)?'📦 bundle: '+p.composicao.map(c=>c.ref).join(' + '):[p.categoria,p.tier,p.descontinuado?'descontinuado':''].filter(Boolean).join(' · '))}</small></div>`).join('');
      box.classList.add('on'); box._dono=inp; box.onmousedown=e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); aplica(res[+d.dataset.i]); } }; };
    inp.addEventListener('input', ()=>{ sel=-1; mostra(); });
    inp.addEventListener('keydown', e=>{ if(box._dono!==inp || !box.classList.contains('on')) return;
      if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); sel=Math.max(0,Math.min(res.length-1, sel+(e.key==='ArrowDown'?1:-1))); mostra(); }
      else if (e.key==='Enter') { e.preventDefault(); aplica(res[sel>=0?sel:0]); }
      else if (e.key==='Escape') fecha(); });
    inp.addEventListener('blur', ()=>setTimeout(()=>{ if(box._dono===inp) fecha(); },150));
  });
  $('#lines').querySelectorAll('[data-bt]').forEach(el=>el.addEventListener('input',()=>{ const g=el.closest('tr').dataset.g;
    distribuir(L.filter(l=>l.bGid===g), parseFloat(el.value)||0); S.dirty=true;
    L.forEach((l,j)=>{ if(l.bGid===g){ const o=$('#lines').querySelector(`tr[data-i="${j}"] [data-l="rlmc"]`); if(o) o.value=+l.rlmc||0; } }); updTotals(); }));
  $('#lines').querySelectorAll('[data-gdup]').forEach(b=>b.onclick=()=>{ const g=b.closest('tr').dataset.g, n=novoGid(), fim=L.map(l=>l.bGid).lastIndexOf(g);
    L.splice(fim+1,0,...L.filter(l=>l.bGid===g).map(l=>({...l,bGid:n,msisdn:'',contratoVDF:'',upgrade:false}))); S.dirty=true; drawLines(dis); });
  $('#lines').querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{ const g=b.closest('tr').dataset.g; for(let j=L.length-1;j>=0;j--) if(L[j].bGid===g) L.splice(j,1); S.dirty=true; drawLines(dis); });
  $('#lines').querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{ const i=+b.closest('tr').dataset.i; L.splice(i+1,0,linhaVazia(L[i])); S.dirty=true; drawLines(dis); });
  $('#lines').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const i=+b.closest('tr').dataset.i; L.splice(i,1); S.dirty=true; drawLines(dis); });
}
function recalc(){ const r=S.cur; r.nLinhas=r.linhas.length; r.totRLMC=Math.round(r.linhas.reduce((a,l)=>a+(+l.rlmc||0),0)*100)/100; r.totScore=Math.round(r.linhas.reduce((a,l)=>a+scoreLinha(l,r),0)*1000)/1000; r.linhas.forEach(l=>l.score=scoreLinha(l,r)); }
function updTotals(){ recalc(); const r=S.cur; document.querySelectorAll('#lines tbody tr[data-i]').forEach(tr=>{ const c=tr.querySelector('.sc'); if(c) c.textContent=n3(scoreLinha(r.linhas[+tr.dataset.i],r)); }); if($('#t-rl')){ $('#t-rl').textContent=eur(r.totRLMC); $('#t-sc').textContent=n3(r.totScore); } }

function bulkMsisdn(dis){

  });
}

function tabAnexos(tc, p){
  const r=S.cur;
  if (!r.id) { tc.innerHTML=`<div class="card muted">Guarde o RPN primeiro para poder anexar documentos.</div>`; return; }
  const podeUp = isStaff() || p.own;
  tc.innerHTML = `<div class="card">
    ${podeUp?`<div class="row" style="margin-bottom:12px"><input type="file" id="fup" multiple style="max-width:420px"><button class="btn pri" id="bup">Carregar</button><span class="muted" style="font-size:12px">Comprovativo de aceitação: email do cliente, contrato assinado (PDF)… máx. 20 MB</span></div>`:''}
    <table><thead><tr><th>Ficheiro</th><th>Por</th><th>Quando</th><th class="num">Tamanho</th><th></th></tr></thead><tbody id="axl"><tr><td colspan="5" class="muted">A carregar…</td></tr></tbody></table></div>`;
  const un = onSnapshot(query(collection(db,'rpn',r.id,'anexos'),orderBy('em','desc')), s=>{
    $('#axl').innerHTML = s.docs.map(d=>{ const a=d.data(); const pode = isBO() || isMaster() || (a.porUid===S.me.uid && r.estado==='Em Elaboração'); return `<tr><td><a href="#" data-open="${esc(a.path)}">${esc(a.nome)}</a></td><td>${esc(a.porNome)}</td><td>${tsTxt(a.em)}</td><td class="num">${Math.ceil((a.tamanho||0)/1024)} KB</td><td>${pode?`<button class="btn sm ghost" data-rm="${d.id}" data-p="${esc(a.path)}" style="color:var(--red-d)">Remover</button>`:''}</td></tr>`; }).join('') || `<tr><td colspan="5" class="muted">Sem anexos.</td></tr>`;
    $('#axl').querySelectorAll('[data-open]').forEach(a=>a.onclick=async e=>{ e.preventDefault(); try{ window.open(await getDownloadURL(sref(st,a.dataset.open)),'_blank'); }catch(err){ toast(errTxt(err),true); } });
    $('#axl').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ if(!confirm('Remover este anexo?'))return; try{ await deleteObject(sref(st,b.dataset.p)).catch(()=>{}); await deleteDoc(doc(db,'rpn',r.id,'anexos',b.dataset.rm)); hist('Anexo removido', b.dataset.p.split('/').pop()); }catch(err){ toast(errTxt(err),true); } });
  }, e=>toast(errTxt(e),true));
  S.unsub.push(un);
  $('#bup')?.addEventListener('click', async ()=>{
    const fs=[...$('#fup').files]; if(!fs.length) return toast('Escolha um ficheiro.',true);
    $('#bup').disabled=true;
    try { for (const f of fs) { if (f.size>20*1024*1024) { toast(`${f.name}: excede 20 MB`,true); continue; }
        const path=`rpn/${r.id}/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,'_')}`;
        await uploadBytes(sref(st,path), f, {contentType:f.type||'application/octet-stream'});
        await addDoc(collection(db,'rpn',r.id,'anexos'),{nome:f.name,path,tamanho:f.size,tipo:f.type,porUid:S.me.uid,porNome:S.me.nome,em:serverTimestamp()});
        hist('Anexo adicionado', f.name); }
      toast('Anexo(s) carregado(s).'); $('#fup').value='';
    } catch(e){ toast(errTxt(e),true); } finally { $('#bup').disabled=false; }
  });
}

// ---- mensagens ----
// mensagem por ler: a última não é minha, sou parte do processo (vendedor, BO ou conferente) e ainda não abri as Mensagens depois dela
const msgPorLer = r => !!(r && r.msgUlt && r.msgUlt.porUid!==S.me.uid && (r.msgUlt.auto ? r.vendedorUid===S.me.uid : [r.vendedorUid,r.boUid,r.confUid].includes(S.me.uid)) &&   // os avisos automáticos de estado são só para o vendedor
  String(r.msgLido?.[S.me.uid]||'') < String(r.msgUlt.em||''));
function marcarMsgLidas(r, ult){   // ult = última mensagem no ecrã; apanha também as que chegam com o separador aberto
  if (!r?.id || ![r.vendedorUid,r.boUid,r.confUid].includes(S.me.uid)) return;
  const chegou = !!(ult && ult.porUid!==S.me.uid && r._msgVistas!==undefined && r._msgVistas!==ult._n);
  if (ult) r._msgVistas=ult._n;
  if (!msgPorLer(r) && !chegou) return;
  const agora=new Date().toISOString(); r.msgLido={...(r.msgLido||{}),[S.me.uid]:agora};
  setDoc(doc(db,'rpn',r.id),{msgLido:{[S.me.uid]:agora}},{merge:true}).catch(e=>console.warn('msgLido',e));
  const t=document.querySelector('.tabs a[data-t="msg"]'); if(t) t.textContent='Mensagens';
}
const msgPara = r => r.vendedorUid===S.me.uid ? 'a BackOffice' : [r.boUid,r.confUid].includes(S.me.uid) ? 'o Comercial' : 'o Comercial ou a BackOffice';
function tabMsg(tc){
  const r=S.cur;
  if (!r.id) { tc.innerHTML=`<div class="card muted">Guarde o RPN primeiro.</div>`; return; }
  tc.innerHTML = `<div class="card"><div class="msgs" id="ml"><span class="muted">A carregar…</span></div>
    <textarea id="mt" rows="3" placeholder="Escrever mensagem para ${msgPara(r)}…"></textarea>
    <div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn pri" id="ms">Enviar</button></div></div>`;
  const un = onSnapshot(query(collection(db,'rpn',r.id,'mensagens'),orderBy('em')), s=>{
    const el=$('#ml'); if(!el) return;
    el.innerHTML = s.docs.map(d=>{ const x=d.data(); return `<div class="msg ${x.auto?'auto':x.porUid===S.me.uid?'mine':''}"><small>${x.auto?'Aviso automático · ':''}${esc(x.porNome)} · ${tsTxt(x.em)}</small>${esc(x.texto).replace(/\n/g,'<br>')}</div>`; }).join('') || `<span class="muted">Sem mensagens.</span>`;
    el.scrollTop = el.scrollHeight;
    const u=s.docs.at(-1)?.data(); marcarMsgLidas(S.cur, u ? {porUid:u.porUid, _n:s.docs.length} : null);
  }, e=>toast(errTxt(e),true));
  S.unsub.push(un);
  $('#ms').onclick = async ()=>{ const t=$('#mt').value.trim(); if(!t) return; try{ await addDoc(collection(db,'rpn',r.id,'mensagens'),{texto:t,porUid:S.me.uid,porNome:S.me.nome,em:serverTimestamp()});
      const agora=new Date().toISOString(); r.msgUlt={em:agora,porUid:S.me.uid,porNome:S.me.nome,auto:false};   // assinala «por ler» à outra parte, na lista
      await setDoc(doc(db,'rpn',r.id),{msgUlt:r.msgUlt, msgLido:{[S.me.uid]:agora}},{merge:true}).catch(e=>console.warn('msgUlt',e));
      $('#mt').value=''; }catch(e){ toast(errTxt(e),true); } };
}
function enviarEmail(texto){

// Mensagem automática no separador Mensagens: «Novo estado: "…"» + motivo. Só quando não é o próprio vendedor a mudar,
// e até «Concluído» (envio para conferência): a devolução pela conferência e a passagem a PN já não geram aviso.
async function msgEstado(id, r, antigo, novo){
  if (!id || !novo || antigo===novo || S.me.uid===r.vendedorUid || !r.vendedorUid) return;
  if (antigo==='Em Conferência' || novo==='PN' || novo==='Em Elaboração') return;
  let extra='';
  if (['Pendente Comercial','Pendente Documentos'].includes(novo) && (r.motivos||[]).length) extra='Motivo: '+r.motivos.join(', ');
  else if (novo==='A aguardar') extra=[ESPERA_TXT[r.esperaMotivo]||'', r.esperaData?'até '+fmtD(r.esperaData):''].filter(Boolean).join(' · ');
  else if (novo==='Em Conferência') extra='O processo está implementado. Segue para conferência interna e passa depois a PN.';
  const agora=new Date().toISOString(), texto=`Novo estado: "${estTxt(novo)}"`+(extra?'\n'+extra:'');
  try { await addDoc(collection(db,'rpn',id,'mensagens'),{texto, auto:true, porUid:S.me.uid, porNome:S.me.nome, em:serverTimestamp()});
    const u={em:agora, porUid:S.me.uid, porNome:S.me.nome, auto:true}; await setDoc(doc(db,'rpn',id),{msgUlt:u, msgLido:{[S.me.uid]:agora}},{merge:true});
    if (S.cur?.id===id) { S.cur.msgUlt=u; S.cur.msgLido={...(S.cur.msgLido||{}),[S.me.uid]:agora}; }
  } catch(e){ console.warn('msgEstado',e); }
}
const CAMPOS_HIST = [['estado','Estado'],['esperaMotivo','A aguardar'],['esperaData','Data da espera'],['boNome','BO'],['vendedorNome','Vendedor'],['cliente.nome','Cliente'],['cliente.nif','NIF'],['nOportunidade','Oportunidade'],['subSfid','Sub-SFID'],['simulador','Simulador'],['atividade','Atividade'],['dtAtivacao','Dt. ativação'],['nLinhas','Nº linhas'],['totRLMC','RLMC total'],['totScore','Score']];
function diffTxt(a,b){
  const out=[]; CAMPOS_HIST.forEach(([k,t])=>{ const x=getPath(a,k), y=getPath(b,k); if(String(x??'')!==String(y??'')) out.push(k==='estado' ? `${t}: ${estTxt(x)||'—'} → ${estTxt(y)||'—'}` : `${t}: ${x??'—'} → ${y??'—'}`); });
  const ma=(a.motivos||[]).join(', '), mb=(b.motivos||[]).join(', '); if(ma!==mb) out.push(`Motivos: ${ma||'—'} → ${mb||'—'}`);
  const ca=(a.linhas||[]).map(l=>l.contratoVDF).join(), cb=(b.linhas||[]).map(l=>l.contratoVDF).join(); if(ca!==cb) out.push('Contratos VDF atualizados');
  return out.join('; ');
}

// ---------- 8. GUARDAR / SUBMETER (com distribuição automática da BO) ----------
function validarSubmissao(r){
  const e=[];
  if(!r.cliente?.nome) e.push('nome do cliente'); if(!/^\d{9}$/.test(String(r.cliente?.nif||'').trim())) e.push('NIF (9 dígitos)');
  if(!r.linhas.length) e.push('pelo menos 1 linha');
  r.linhas.forEach((l,i)=>{ if(!l.ref) e.push(`referência da linha ${i+1}`); if(l.bGid){ if(!(+l.bTot>0) && l.bGid!==r.linhas[i-1]?.bGid) e.push(`RLMC total do bundle ${l.bRef}`); } else if(!(+l.rlmc>0)) e.push(`RLMC da linha ${i+1}`); });
  return e;
}
// aus = BackOffices ausentes (config/cargaBO.ausentes); excl = uids a excluir
function escolherBO(carga, aus={}, excl=[]){
  const lista = bos().filter(b=>!aus[b.uid] && !excl.includes(b.uid)); if(!lista.length) throw new Error('Não há BackOffices ativas configuradas para receber RPNs (Administração → Utilizadores → “Recebe RPN”).');
  const min = Math.min(...lista.map(b=>carga[b.uid]||0));
  const cand = lista.filter(b=>(carga[b.uid]||0)===min);
  return cand[Math.floor(Math.random()*cand.length)];
}
// conferência: mesma regra (menos linhas em conferência), nunca quem implementou; devolve null se não houver ninguém
function escolherConf(conf, aus={}, excl=[]){
  const lista = bos().filter(b=>!aus[b.uid] && !excl.includes(b.uid)); if(!lista.length) return null;
  const min = Math.min(...lista.map(b=>conf[b.uid]||0));
  const cand = lista.filter(b=>(conf[b.uid]||0)===min);
  return cand[Math.floor(Math.random()*cand.length)];
}
// realocar a BO que implementa ('bo') ou a que confere ('conf'); uidNovo vazio = automático
async function realocarTx(id, tipo, uidNovo, motivo){
  let txt='';
  await runTransaction(db, async tx => {
    const ref=doc(db,'rpn',id), cargaRef=doc(db,'config','cargaBO');
    const s=await tx.get(ref), cs=await tx.get(cargaRef); const r=s.data(), cd=cs.exists()?cs.data():{};
    const carga={...(cd.carga||{})}, conf={...(cd.conf||{})}, aus=cd.ausentes||{};
    const upd={atualizadoEm:serverTimestamp(), atualizadoPor:S.me.uid};
    if (tipo==='bo') {
      if (!ABERTOS.includes(r.estado)) throw new Error('Este RPN já não está em implementação.');
      const novo = uidNovo ? {uid:uidNovo, nome:userNome(uidNovo)} : escolherBO(carga, aus, [r.boUid]);
      if (novo.uid===r.boUid) throw new Error('Já está atribuído a essa BackOffice.');
      const cnt=r.cargaContada||0, nc=r.nLinhas||0;
      if (r.boUid && cnt) carga[r.boUid]=Math.max(0,(carga[r.boUid]||0)-cnt);
      if (nc) carga[novo.uid]=(carga[novo.uid]||0)+nc;
      upd.boUid=novo.uid; upd.boNome=novo.nome; upd.cargaContada=nc; realocarTx.uid=novo.uid;
      if (r.confUid===novo.uid) { upd.confUid=null; upd.confNome=''; }   // quem implementa não pode conferir
      txt=`BO: ${r.boNome||'—'} → ${novo.nome}`;
    } else {
      if (r.estado!=='Em Conferência') throw new Error('Este RPN já não está em conferência.');
      const novo = uidNovo ? {uid:uidNovo, nome:userNome(uidNovo)} : escolherConf(conf, aus, [r.boUid, r.confUid]);
      if (!novo) throw new Error('Não há outra BackOffice disponível para conferir.');
      if (novo.uid===r.boUid) throw new Error('Quem implementou o RPN não o pode conferir.');
      if (novo.uid===r.confUid) throw new Error('Já está atribuído a essa BackOffice.');
      const cnt=r.confContada||0, nc=r.nLinhas||0;
      if (r.confUid && cnt) conf[r.confUid]=Math.max(0,(conf[r.confUid]||0)-cnt);
      if (nc) conf[novo.uid]=(conf[novo.uid]||0)+nc;
      upd.confUid=novo.uid; upd.confNome=novo.nome; upd.confContada=nc; realocarTx.uid=novo.uid;
      txt=`Conferência: ${r.confNome||'em fila'} → ${novo.nome}`;
    }
    tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true});
    tx.update(ref,upd);
  });
  await hist('Realocado', `${txt}. Razão: ${motivo}`, id);
  return txt;
}

  });
}
function realocar(tipo){
  const r=S.cur; if (S.dirty) return toast('Guarde primeiro as alterações.',true);
  const excl = tipo==='bo' ? [r.boUid] : [r.boUid, r.confUid];
  const cand = bos().filter(b=>!excl.includes(b.uid));
  pedirRazao(tipo==='bo'?'Realocar a implementação':'Realocar a conferência',
    `<div><label>Passar para</label><select id="rb"><option value="">— automático (menor carga) —</option>${cand.map(b=>`<option value="${b.uid}">${esc(b.nome)}</option>`).join('')}</select></div>`,
    'Realocar', async (rz, uid)=>{ try { const irm=await irmaos(r); const t=await realocarTx(r.id, tipo, uid||null, rz); const para=realocarTx.uid, tb=[];
        for (const x of irm) { try{ await realocarTx(x.id, tipo, para, rz+' (com o RPN '+r.numero+', mesmo grupo)'); tb.push(x.numero); }catch(e){} }   // o grupo anda junto
        toast('Realocado. '+t+(tb.length?` Também os RPN ${tb.join(', ')} do grupo.`:'')); S.cur=null; viewFicha(r.id); } catch(e){ toast(errTxt(e),true); } });
}

          catch(e){ if (e?.code!=='failed-precondition') throw e; [a,b2] = await Promise.all([getDocs(query(col,where('boUid','==',uid))), getDocs(query(col,where('confUid','==',uid)))]); }

          for (const d of cf)   { const g=d.data().grupoId; try{ await realocarTx(d.id,'conf',(g&&gC[g])||null,rz); if(g) gC[g]=realocarTx.uid; ok++; }catch(e){ falhas.push(`${d.data().numero}: ${errTxt(e)}`); } }

async function guardar(opts={}){
  const r = S.cur; recalc();
  if (opts.submeter) { const e=validarSubmissao(r); if(e.length) return toast('Falta: '+e.join(', '), true); }
  if (opts.submeter && !r.id) { const ok = await guardar({silencioso:true}); if(ok===false) return; }
  const btns=[...document.querySelectorAll('.row .btn')]; btns.forEach(b=>b.disabled=true);
  try {
    const isNew = !r.id;
    const rpnRef = isNew ? doc(collection(db,'rpn')) : doc(db,'rpn',r.id);
    const data = JSON.parse(JSON.stringify({...r})); ['id','criadoEm','atualizadoEm','msgUlt','msgLido','_msgVistas','pnEmail'].forEach(k=>delete data[k]);
    if (opts.submeter) { data.estado='Submetido'; data.submetidoEm=new Date().toISOString(); }
    if (opts.devolver) { data.estado='Em Implementação'; data.motivos=[]; }
    if (opts.conferencia) { data.estado='Em Conferência'; data.motivos=[]; data.confNota=''; data.implementadoEm=new Date().toISOString(); }
    if (opts.conferido) { data.estado='PN'; data.conferidoEm=new Date().toISOString(); data.conferidoPorUid=S.me.uid; data.conferidoPorNome=S.me.nome; }
    if (opts.devolverImpl) { data.estado='Em Implementação'; data.confNota=opts.devolverImpl; }
    if (opts.reabrir) { data.estado='Em Implementação'; }
    if (data.estado==='A aguardar') {
      const falha = t => { btns.forEach(b=>b.disabled=false); toast(t, true); };
      if (!data.esperaMotivo) return falha('Indique o que está a aguardar (ciclo, instalação, 1229, portabilidade, aprovação).');
      if (data.esperaMotivo==='ciclo') { if (!data.cicloDia) return falha('Escolha o ciclo de faturação (dia 8, 15, 22 ou fim do mês).');
        if (!data.esperaData || S.cicloMudou) data.esperaData = proxCiclo(data.cicloDia); }
      else if (data.esperaMotivo==='instalacao' && !data.esperaData) return falha('Indique a data da instalação.');
      if (!data.esperaDesde) data.esperaDesde = hoje();
    } else { data.esperaMotivo=''; data.esperaData=''; data.esperaDesde=''; }
    data.cicloData = null;
    S.cicloMudou = false;
    if (FECHADOS.includes(data.estado) && !data.fechadoEm) { data.fechadoEm=new Date().toISOString(); data.fechadoMes=mesLocal(); }
    data.mesRef = FECHADOS.includes(data.estado) ? (data.fechadoMes||mesLocal()) : null;   // mês em que aparece na lista dos fechados
    data.contratos = [...new Set((data.linhas||[]).map(l=>String(l.contratoVDF||'').trim()).filter(Boolean))];
    data.msisdns = listaMsisdn(data.linhas);
    if (!FECHADOS.includes(data.estado)) { data.fechadoEm=null; data.fechadoMes=null; }
    let old=null, boEscolhida=null;
    await runTransaction(db, async tx => {
      const cargaRef = doc(db,'config','cargaBO'), cntRef = doc(db,'counters','rpn');
      const cs = await tx.get(cargaRef); const cd = cs.exists() ? cs.data() : {};
      const carga = {...(cd.carga||{})}, conf = {...(cd.conf||{})}, aus = cd.ausentes||{};
      let numero = data.numero;
      if (isNew) { const c = await tx.get(cntRef); numero = c.exists() ? c.data().next : 1; tx.set(cntRef,{next:numero+1}); data.numero=numero; data.criadoEm=serverTimestamp(); data.criadoPor=S.me.uid; }
      else { const s = await tx.get(rpnRef); old = s.data();
        // a BO e a conferente só mudam por atribuição automática ou realocação — nunca por um ecrã desatualizado
        data.boUid=old.boUid??null; data.boNome=old.boNome||''; data.confUid=old.confUid??null; data.confNome=old.confNome||''; }
      if ((opts.conferido||opts.devolverImpl) && old) {
        if (old.estado!=='Em Conferência') throw new Error('Este RPN já não está em conferência.');
        if (old.boUid===S.me.uid) throw new Error('Quem implementou o RPN não o pode conferir.');
        if (old.confUid!==S.me.uid && !isMaster()) throw new Error('A conferência deste RPN está atribuída a '+(old.confNome||'outra BackOffice')+'.');
      }
      if (opts.submeter && !data.boUid) { boEscolhida = escolherBO(carga, aus); data.boUid=boEscolhida.uid; data.boNome=boEscolhida.nome; }
      if (opts.conferencia && opts.confPref && !data.confUid && opts.confPref!==data.boUid && !aus[opts.confPref] && bos().some(b=>b.uid===opts.confPref)) { data.confUid=opts.confPref; data.confNome=userNome(opts.confPref); }
      if (data.estado==='Em Conferência' && (!data.confUid || data.confUid===data.boUid || aus[data.confUid])) {
        const c = escolherConf(conf, aus, [data.boUid]); data.confUid=c?c.uid:null; data.confNome=c?c.nome:''; }
      // registos para a Produção BO: quem implementou (fixado ao enviar para conferência) e devoluções
      data.devolucoes = old?.devolucoes||[]; data.devMeses = old?.devMeses||[];
      if (old) { data.implPorUid=old.implPorUid??null; data.implPorNome=old.implPorNome||''; }
      if (opts.conferencia) { data.implPorUid=data.boUid; data.implPorNome=data.boNome; }
      if (opts.devolverImpl && old) {
        data.devolucoes = [...data.devolucoes, {em:new Date().toISOString(), mes:mesLocal(), porUid:S.me.uid, porNome:S.me.nome, aUid:old.implPorUid||old.boUid, aNome:old.implPorNome||old.boNome||'', linhas:old.nLinhas||0, motivo:opts.devolverImpl, anulada:false}];
        data.devMeses = [...new Set([...data.devMeses, mesLocal()])];
      }
      const oldBo=old?.boUid||null, oldCnt=old?.cargaContada||0;
      const newCnt = (ABERTOS.includes(data.estado) && data.boUid) ? data.nLinhas : 0;
      if (oldBo && oldCnt) carga[oldBo] = Math.max(0,(carga[oldBo]||0) - oldCnt);
      if (data.boUid && newCnt) carga[data.boUid] = (carga[data.boUid]||0) + newCnt;
      data.cargaContada = newCnt;
      const oldCf=old?.confUid||null, oldCfCnt=old?.confContada||0;
      const newCfCnt = (data.estado==='Em Conferência' && data.confUid) ? data.nLinhas : 0;
      if (oldCf && oldCfCnt) conf[oldCf] = Math.max(0,(conf[oldCf]||0) - oldCfCnt);
      if (data.confUid && newCfCnt) conf[data.confUid] = (conf[data.confUid]||0) + newCfCnt;
      data.confContada = newCfCnt;
      if (oldCnt || newCnt || oldCfCnt || newCfCnt) tx.set(cargaRef,{carga, conf, atualizadoEm:serverTimestamp()},{merge:true});
      data.atualizadoEm = serverTimestamp(); data.atualizadoPor = S.me.uid;
      if (isNew) tx.set(rpnRef, data); else tx.set(rpnRef, data, {merge:true});
    });
    S.cur.id = rpnRef.id; S.cur.numero = data.numero; S.cur.estado = data.estado; S.cur.boUid=data.boUid; S.cur.boNome=data.boNome; S.cur.motivos=data.motivos; S.cur.cargaContada=data.cargaContada; S.cur.fechadoEm=data.fechadoEm; S.cur.confUid=data.confUid; S.cur.confNome=data.confNome; S.cur.confContada=data.confContada; S.cur.confNota=data.confNota||''; S.cur.conferidoPorNome=data.conferidoPorNome||''; S.cur.conferidoEm=data.conferidoEm||''; S.cur.implementadoEm=data.implementadoEm||''; S.cur.esperaMotivo=data.esperaMotivo; S.cur.esperaData=data.esperaData; S.cur.esperaDesde=data.esperaDesde; S.cur.mesRef=data.mesRef; S.cur.contratos=data.contratos; S.cur.devolucoes=data.devolucoes; S.cur.devMeses=data.devMeses; S.cur.implPorUid=data.implPorUid; S.cur.implPorNome=data.implPorNome; S.cur.fechadoMes=data.fechadoMes;
    S.dirty = false;
    if (isNew) await hist('Criado', r.propostaRef?`A partir da proposta ${r.propostaRef}`:'', rpnRef.id);
    // marca a proposta de origem (app Propostas, coleção 'propostas') com o nº do RPN
    if (isNew && r.propostaRef) updateDoc(doc(db,'propostas',r.propostaRef),{rpnId:rpnRef.id,rpnNumero:data.numero}).catch(()=>{});
    if (opts.submeter) await hist('Submetido', `Atribuído a ${data.boNome} (distribuição automática, ${data.nLinhas} linha(s))`);
    else if (opts.devolver) await hist('Devolvido à BO', 'Pendência resolvida pelo comercial');
    else if (opts.conferencia) await hist('Concluído · enviado para conferência', data.confUid?`Implementado por ${data.boNome}. Conferência atribuída a ${data.confNome} (distribuição automática, ${data.nLinhas} linha(s))`:`Implementado por ${data.boNome}. Sem BackOffice disponível para conferir — fica em fila`);
    else if (opts.conferido) await hist('Conferido → PN', `Conferido por ${S.me.nome}. O RPN passa a Processo de Negócio.`);

async function aplicarNoIrmao(id, tipo, L, nota){

    const u={atualizadoEm:serverTimestamp(), atualizadoPor:S.me.uid}; let estado=o.estado, bo=o.boUid||null, cf=o.confUid||null;
    if (tipo==='submeter') { if(o.estado!=='Em Elaboração') return; estado='Submetido'; bo=L.boUid; Object.assign(u,{submetidoEm:agora, boUid:L.boUid, boNome:L.boNome||''}); }

    else if (tipo==='conferido') { if(o.estado!=='Em Conferência' || o.boUid===S.me.uid) return; estado='PN';
      Object.assign(u,{conferidoEm:agora, conferidoPorUid:S.me.uid, conferidoPorNome:S.me.nome, fechadoEm:agora, fechadoMes:mesLocal(), mesRef:mesLocal()}); }
    else if (tipo==='devolverImpl') { if(o.estado!=='Em Conferência') return; estado='Em Implementação';
      Object.assign(u,{confNota:nota||'', devMeses:[...new Set([...(o.devMeses||[]), mesLocal()])],
        devolucoes:[...(o.devolucoes||[]), {em:agora, mes:mesLocal(), porUid:S.me.uid, porNome:S.me.nome, aUid:o.implPorUid||o.boUid, aNome:o.implPorNome||o.boNome||'', linhas:o.nLinhas||0, motivo:nota||'', anulada:false}]}); }
    else return;
    u.estado=estado;

    if (o.boUid && o.cargaContada) carga[o.boUid]=Math.max(0,(carga[o.boUid]||0)-o.cargaContada);
    if (bo && nc) carga[bo]=(carga[bo]||0)+nc;
    if (o.confUid && o.confContada) conf[o.confUid]=Math.max(0,(conf[o.confUid]||0)-o.confContada);
    if (cf && ncf) conf[cf]=(conf[cf]||0)+ncf;
    u.cargaContada=nc; u.confContada=ncf;
    tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true}); tx.update(ref,u); feito=o.numero; antes={...o, ...u, _de:o.estado};
  });
  if (feito!=null) await hist({submeter:'Submetido',conferencia:'Concluído · enviado para conferência',conferido:'Conferido → PN',devolverImpl:'Devolvido à implementação'}[tipo],
    `Em conjunto com o RPN ${L.numero} (mesmo grupo)`+(tipo==='submeter'?`. BackOffice: ${L.boNome}`:tipo==='conferencia'?`. Conferência: ${L.confNome||'em fila'}`:tipo==='devolverImpl'?`: ${nota}`:`, por ${S.me.nome}`), id);
  if (feito!=null && antes) await msgEstado(id, antes, antes._de, antes.estado);
  return feito;
}

async function acaoGrupo(tipo, opts){
  const r=S.cur; let irm=[];

      const abertos=irm.filter(x=>!FECHADOS.includes(x.estado) && x.estado!=='Em Conferência');
      const pref=irm.map(x=>x.estado==='Em Conferência'?x.confUid:x.conferidoPorUid).find(Boolean); if (pref) opts={...opts, confPref:pref};   // a parte que segue depois vai, se possível, para quem conferiu a primeira

<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPN · Redemóvel</title>
<style>
:root{--red:#e60000;--red-d:#b80000;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e3e6;--bg:#f5f5f7;--card:#fff;--ok:#1a7f37;--warn:#b26a00;--info:#0b5cad;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #cfcfd4;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f0f0f2;color:#555}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.btn{border:1px solid #cfcfd4;background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f0f2}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;color:var(--red);font-size:16px}
header nav{display:flex;gap:4px;flex:1}
header nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
header nav a.on{background:#fde8e8;color:var(--red-d)}
header .who{font-size:12px;color:var(--mut);text-align:right}
main{padding:20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--mut)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;background:#fafafa;position:sticky;top:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#fafafa}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eee;white-space:nowrap}
.b-Em-Elaboração{background:#eee;color:#444}
.b-Submetido{background:#e7f0fb;color:var(--info)}
.b-Em-Implementação{background:#e8e4fb;color:#4b2fb0}
.b-Pendente-Comercial,.b-Pendente-Documentos{background:#fff3df;color:var(--warn)}
.b-Concluído,.b-PN{background:#e6f4ea;color:var(--ok)}
.b-Em-Conferência{background:#e0f4f7;color:#0b6b7a}
.b-A-aguardar,.b-A-aguardar-ciclo{background:#eef0f4;color:#4a5568}.venc{background:#fde8e8!important;color:var(--red-d)!important}
.b-Cancelado,.b-Reprovado,.b-Recusado{background:#fde8e8;color:var(--red-d)}
.b-Em-tratamento{background:#e8e4fb;color:#4b2fb0}
.pj-0{background:#fff4d6;color:#8a5a00}.pj-1{background:#e0ecff;color:#1d4ed8}.pj-2{background:#dcfce7;color:#166534}.pj-3{background:#fde8e8;color:var(--red-d)}.pj-4{background:#ede9fe;color:#5b21b6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;min-width:110px}
.chip b{display:block;font-size:20px}.chip.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut)}
.tabs a.on{border-color:var(--red);color:var(--ink);font-weight:600}
.lines input,.lines select{padding:4px 6px;font-size:13px}
.lines td{padding:3px 4px;white-space:nowrap}
.lines tr.bh td{background:#f3f4f6;border-top:2px solid #d1d5db}.lines tr.bf td:first-child{border-left:3px solid #d1d5db}
.tot td{font-weight:700;background:#fafafa}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw}
#toast.err{background:var(--red-d)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:#fff;border-radius:10px;padding:20px;width:min(560px,92vw);max-height:90vh;overflow:auto}
.login{max-width:360px;margin:12vh auto}
.msgs{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{background:#f3f3f5;border-radius:8px;padding:8px 10px;max-width:80%}
.msg.mine{background:#fde8e8;align-self:flex-end}
.msg.auto{background:#eef2ff;border:1px solid #c7d2fe;align-self:center;text-align:center;font-weight:600}
.msg small{display:block;color:var(--mut);font-size:11px}
.hist td{font-size:13px}
.motivos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 12px}
.motivos label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;margin:0}
.cli-box{position:relative}.cli-res{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:340px;overflow:auto;display:none}
.cli-res.on{display:block}.cli-res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f1f1}.cli-res div:hover,.cli-res div.sel{background:#f6f6f6}.cli-res small{color:#777}
.warnbox{background:#fff3df;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;margin-bottom:12px}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.motivos{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style>
</head>
<body>
<div id="app"><div class="login muted">A carregar…</div></div>
<div id="toast"></div>
<script type="module">
// =====================================================================
//  RPN — Registo de Processo de Negócio · Redemóvel   (Fase 1)
//  DEV: rpn.html   ·   PRODUÇÃO: rpn.html
// =====================================================================

// ---------- 1. CONFIGURAÇÃO FIREBASE (colar do Firebase Console) ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKvTxqGq2BWtpgaDmkZvasyU0f-ax3GrY",
  authDomain: "redemovel-rpn.firebaseapp.com",
  projectId: "redemovel-rpn",
  storageBucket: "redemovel-rpn.firebasestorage.app",
  messagingSenderId: "418514108309",
  appId: "1:418514108309:web:a8cc65c3a2a0e304cd009c"
};
const EMAIL_DOMAIN = 'redemovel.pt';   // "pmota" → pmota@redemovel.pt

import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword,
         sendPasswordResetEmail, updatePassword, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, setDoc as _setDoc, updateDoc as _updateDoc, addDoc as _addDoc, deleteDoc as _deleteDoc, collection, query, where, orderBy,
         limit, runTransaction as _runTransaction, serverTimestamp, writeBatch as _writeBatch, onSnapshot, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject, connectStorageEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

// economia de leituras: a lista de RPN fica em memória 1 minuto; qualquer escrita feita nesta sessão obriga a reler
let LISTA_EM = 0, AT_EM = 0;
const suja = f => (...a) => { LISTA_EM = 0; AT_EM = 0; return f(...a); };
const setDoc = suja(_setDoc), updateDoc = suja(_updateDoc), addDoc = suja(_addDoc), deleteDoc = suja(_deleteDoc), runTransaction = suja(_runTransaction), writeBatch = suja(_writeBatch);
const LISTA_TTL = 60000;
const EMU = new URLSearchParams(location.search).has('emu') && ['localhost','127.0.0.1'].includes(location.hostname);
const cfg = EMU ? {apiKey:'demo-key',authDomain:'demo-rpn.firebaseapp.com',projectId:'demo-rpn',storageBucket:'demo-rpn.appspot.com',appId:'demo'} : FIREBASE_CONFIG;
const app = initializeApp(cfg);
const auth = getAuth(app), db = getFirestore(app), st = getStorage(app);
if (EMU) { connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true}); connectFirestoreEmulator(db,'127.0.0.1',8080); connectStorageEmulator(st,'127.0.0.1',9199); }

// ---------- 2. TABELAS DE NEGÓCIO ----------
const ESTADOS  = ['Em Elaboração','Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','Em Conferência','PN','Cancelado','Reprovado'];
const ESTADOS_MAN = ['Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','Cancelado','Reprovado'];   // os que a BO escolhe à mão; Conferência e PN só pelos botões
const FECHADOS = ['PN','Concluído','Cancelado','Reprovado'];
const EM_CURSO = ['Em Elaboração','Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','A aguardar ciclo','Em Conferência'];
// ciclos de faturação da Vodafone: a BO implementa e espera pelo fecho do ciclo para verificar se a alteração entrou sem erro
const CICLOS = [['08','Dia 8'],['15','Dia 15'],['22','Dia 22'],['31','Fim do mês']];
function proxCiclo(dia, de=new Date()){
  const fim = (a,m) => new Date(a, m+1, 0).getDate(), iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let a=de.getFullYear(), m=de.getMonth(); const alvo = (a,m) => dia==='31' ? fim(a,m) : Math.min(+dia, fim(a,m));
  if (de.getDate() > alvo(a,m)) { m++; if (m>11) { m=0; a++; } }
  return iso(new Date(a, m, alvo(a,m)));
}
window.__rpn = {proxCiclo};   // exposto só para os testes automáticos
// esperas do lado da BO: o processo está implementado (ou pedido) e aguarda algo da Vodafone antes de seguir para conferência
const ESPERAS = [['ciclo','Ciclo de faturação'],['instalacao','Instalação marcada'],['1229','Enviado 1229'],['1229os','1229 via OS'],['portabilidade','Portabilidade enviada'],['aprovacao','Aprovação Vodafone']];
const ESPERA_TXT = Object.fromEntries(ESPERAS);
// (versão anterior: estado 'A aguardar ciclo' com cicloData) → 'A aguardar' com motivo e data
function normEspera(r){ if (r && r.estado==='A aguardar ciclo') { r.estado='A aguardar'; r.esperaMotivo='ciclo'; r.esperaData=r.esperaData||r.cicloData||''; } return r; }
const diasDesde = iso => iso ? Math.max(0, Math.floor((new Date(hoje()) - new Date(String(iso).slice(0,10))) / 864e5)) : 0;
const esperaVencida = r => r.estado==='A aguardar' && r.esperaData && r.esperaData < hoje();
const esperaTxt = r => { const m = ESPERA_TXT[r.esperaMotivo]||'A aguardar'; return r.esperaData ? `${m} · ${esperaVencida(r)?'verificar, passou ':'até '}${fmtD(r.esperaData)}` : `${m} · há ${diasDesde(r.esperaDesde)} dia(s)`; };
const ABERTOS  = ['Submetido','Em Implementação','Pendente Comercial','Pendente Documentos','A aguardar','A aguardar ciclo'];   // contam para a carga da BO
const estTxt = e => e==='Em Conferência' ? 'Concluído' : (e||'');   // na base de dados continua «Em Conferência»
const DIAS_CONCLUIDO = 8;   // dias em que um processo concluído ainda aparece na lista do comercial
const EDIT_COM = ['Em Elaboração','Pendente Comercial','Pendente Documentos'];                // comercial pode editar
const MOTIVOS  = ['Doc. Identificação','Contrato','CRC','Morada','Condições Comerciais','Dívida'];
const NATUREZAS= ['Ref Móvel','Nova Móvel','Ref Fixo','Nova Fixo','Nova SS'];
const LOJAS    = ['Externos','LOA','L8A','LAR','LLI','LOV','LVO'];
const PRAZOS   = [12,18,24,30,36,48];
const PERFIS   = ['comercial','coordenador','backoffice','bo_financeiro','master'];
const PERFIL_TXT = {comercial:'Comercial',coordenador:'Coordenador',backoffice:'BackOffice',bo_financeiro:'BO Financeiro',master:'Master'};
const ATIVIDADE= ['Elegível/Carteira','Não Incentivada'];

// Score = RLMC × ajuste prazo × ajustes / 22,50   (Manual Comissões Redemóvel + Plano VDF FY26/27)
const SCORE_BASE = 22.5;
function fatorPrazo(m){ m=+m||0; if(m>=48)return 1.5; if(m>=36)return 1.2525; if(m>=30)return 1.125; if(m>=24)return 1; if(m>=18)return 0.6488; if(m>=12)return 0.4; return 0; }
const FATOR_TIER = {Gold:1, Bronze:0.6, Silver:0.6, Estanho:0.36};   // Bronze = Gold desc.; Estanho = Silver desc.
function scoreLinha(l, r){
  let f = fatorPrazo(l.prazo) * (FATOR_TIER[l.tier] ?? 1);
  if (l.descontinuado && (l.tier==='Gold' || l.tier==='Silver')) f *= 0.6;
  if (r.clienteParticular) f *= 0.6;
  if (r.atividade==='Não Incentivada' && /Móvel/.test(l.natureza||'')) f *= 0.6;
  const s = (+l.rlmc||0) * f / SCORE_BASE;
  if (l.scorePHC!=null) return +l.scorePHC||0;   // PN importado do PHC: fica o Score que lá estava
  return Math.round((s+1e-9)*1000)/1000;   // arredondado, como no PHC (15,02 → 0,668)
}

// ---------- 3. ESTADO / UTILITÁRIOS ----------
const S = { user:null, me:null, users:{}, prodMap:{}, prodList:[], list:null, cur:null, tab:'principal', dirty:false, filtros:{estado:'',txt:'',vend:'',bo:'',mes:'',meus:null}, unsub:[] };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (+n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const n3  = n => (+n||0).toLocaleString('pt-PT',{minimumFractionDigits:3,maximumFractionDigits:3});
const hoje = () => new Date().toISOString().slice(0,10);
const mesLocal = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const fmtD = d => d ? d.split('-').reverse().join('.') : '';
const tsTxt = t => { const d = t?.toDate ? t.toDate() : (t ? new Date(t) : null); return d ? d.toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'}) : ''; };
const perfil = () => S.me?.perfil;
const isMaster = () => perfil()==='master';
const isStaff = () => ['backoffice','bo_financeiro','coordenador','master'].includes(perfil());
const isBO = () => ['backoffice','bo_financeiro','master'].includes(perfil());
const userNome = uid => S.users[uid]?.nome || '';
const bos = () => Object.entries(S.users).filter(([,u]) => u.ativo && u.recebeRPN && ['backoffice','bo_financeiro','master'].includes(u.perfil)).map(([uid,u])=>({uid,...u}));
function toast(msg, err=false){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', err?6000:2800); }
function getPath(o,p){ return p.split('.').reduce((a,k)=>a?.[k], o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ a[k]=a[k]||{}; a=a[k]; }); a[ks.at(-1)]=v; }
function errTxt(e){ const c=e?.code||''; if(c.includes('permission-denied'))return 'Sem permissão para esta operação.'; if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Utilizador ou password incorretos.'; if(c.includes('weak-password'))return 'Password demasiado fraca (mín. 8 caracteres).'; if(c.includes('requires-recent-login'))return 'Por segurança, saia e volte a entrar antes de mudar a password.'; if(c.includes('email-already-in-use'))return 'Esse email já tem conta.'; return e?.message||String(e); }
function modal(html, onMount){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal">${html}</div>`; document.body.appendChild(bg); const close=()=>bg.remove(); bg.addEventListener('click',e=>{ if(e.target===bg) close(); }); onMount?.(bg.querySelector('.modal'), close); return close; }
function clearSubs(){ S.unsub.forEach(u=>u()); S.unsub=[]; }

// ---------- 4. ARRANQUE / AUTENTICAÇÃO ----------
onAuthStateChanged(auth, async user => {
  S.user = user; S.me = null; S.dirty = false; S.list = null; LISTA_EM = 0; S.cur = null; S.tab = 'principal'; S.filtros = {estado:'',txt:'',vend:'',bo:'',mes:'',meus:null}; S.extra = []; S.cli = null; S.avisoPend = null; clearSubs();
  if (!user) return renderLogin();
  try {
    const snap = await getDoc(doc(db,'users',user.uid));
    if (!snap.exists() || !snap.data().ativo) { $('#app').innerHTML = `<div class="login card"><h2>Conta sem acesso</h2><p class="muted">A conta ${esc(user.email)} não tem perfil ativo. Contacte o administrador.</p><button class="btn" id="out">Sair</button></div>`; $('#out').onclick=()=>signOut(auth); return; }
    S.me = {uid:user.uid, ...snap.data()};
    S.projN = 0; S.projAtr = 0; Object.assign(AT,{lista:null, mes:null, listaMes:null, extra:[], f:{estado:'',txt:'',meus:null}, cur:null, tab:'pedido', pend:null}); AT_EM = 0; Object.assign(CL,{q:'', nif:null, tab:'ficha', f:null, edit:false, novo:false, d:{}}); Object.assign(PJ,{tab:'tratar', mes:null, vend:'', lista:[], cfg:{}});
    await Promise.all([loadUsers(), loadProdutos()]);
    handlePropostaParam();
    render();
    projetosAoEntrar();   // não bloqueia a entrada
  } catch(e){ toast(errTxt(e), true); console.error(e); }
});
window.addEventListener('hashchange', () => { if (S.me) render(); });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue=''; } });

async function loadUsers(){ const s=await getDocs(collection(db,'users')); S.users={}; s.forEach(d=>S.users[d.id]=d.data()); }
function usarProdutos(l){ S.prodMap={}; S.prodList=[]; l.forEach(p=>{ if(!p||!p.ref) return; S.prodMap[p.ref.toUpperCase()]=p; S.prodList.push(p); }); S.prodList.sort((a,b)=>a.ref.localeCompare(b.ref)); }
const CAT_KEY = 'rdm-catalogo';   // partilhado com a app Propostas (mesmo site)
function guardarCatalogo(v){ try{ localStorage.setItem(CAT_KEY, JSON.stringify({v:String(v), l:S.prodList})); }catch(e){ try{ localStorage.removeItem(CAT_KEY); }catch(_){} } }
// economia de leituras: o catálogo fica guardado no browser; à entrada lê-se só a versão (config/catalogo) e relê-se tudo apenas quando mudou
async function loadProdutos(forcar){
  let v=''; try{ v=String((await getDoc(doc(db,'config','catalogo'))).data()?.v||''); }catch(e){}
  if (!forcar && v) { try{ const c=JSON.parse(localStorage.getItem(CAT_KEY)||'null'); if (c && c.v===v && Array.isArray(c.l) && c.l.length) { usarProdutos(c.l); return; } }catch(e){} }
  const s=await getDocs(collection(db,'produtos')); usarProdutos(s.docs.map(d=>d.data()));
  if (!v && isStaff()) { v=String(Date.now()); try{ await _setDoc(doc(db,'config','catalogo'),{v},{merge:true}); }catch(e){ v=''; } }   // primeira vez: cria a versão
  if (v) guardarCatalogo(v);
}
// depois de alterar o catálogo: nova versão (os outros utilizadores releem na próxima entrada) e cache local atualizada
async function catalogoMudou(){
  const v=String(Date.now());
  try{ await _setDoc(doc(db,'config','catalogo'),{v, por:S.me.nome},{merge:true}); guardarCatalogo(v); }
  catch(e){ try{ localStorage.removeItem(CAT_KEY); }catch(_){} toast('Catálogo gravado, mas a versão não foi atualizada (regras por publicar?). Os colegas podem continuar a ver o catálogo antigo.', true); }
}
function produtoLocal(ref, d){ const l=S.prodList.filter(p=>p.ref.toUpperCase()!==String(ref).toUpperCase()); if (d) l.push(d); usarProdutos(l); }

function renderLogin(){
  $('#app').innerHTML = `<div class="login card">
    <h1 style="color:var(--red);margin-bottom:4px">Redemóvel · RPN</h1>
    <p class="muted" style="margin-top:0">Registo de Processo de Negócio</p>
    <form id="lf" class="grid">
      <div><label>Utilizador ou email</label><input id="lu" autocomplete="username" required></div>
      <div><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" type="submit">Entrar</button>
      <a href="#" id="lr" class="muted" style="font-size:12px">Esqueci-me da password</a>
    </form></div>`;
  const em = () => { const v=$('#lu').value.trim(); return v.includes('@')?v:`${v}@${EMAIL_DOMAIN}`; };
  $('#lf').onsubmit = async e => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, em(), $('#lp').value); } catch(err){ toast(errTxt(err), true); } };

async function viewLista(forcar){
  const m = $('#main');
  if (!S.filtros.mes) S.filtros.mes = mesLocal();
  if (!forcar && S.list && S.listMes===S.filtros.mes && Date.now()-LISTA_EM < LISTA_TTL) return drawLista();   // lida há menos de 1 minuto e sem escritas desde então
  m.innerHTML = `<div class="card muted">A carregar RPNs…</div>`;
  try {
    // economia de leituras: os processos em curso + os fechados do mês escolhido (o histórico procura-se à parte)
    const col = collection(db,'rpn'), meu = isStaff() ? [] : [where('vendedorUid','==',S.me.uid)];
    const [a, f] = await Promise.all([getDocs(query(col, ...meu, where('estado','in',EM_CURSO))), getDocs(query(col, ...meu, where('mesRef','==',S.filtros.mes)))]);
    const m2 = {}; [...a.docs, ...f.docs, ...(S.extra||[])].forEach(d=>{ const r = typeof d.data==='function' ? {id:d.id,...d.data()} : d; m2[r.id]=r; });
    Object.values(m2).forEach(normEspera);
    S.list = Object.values(m2).sort((x,y)=>(y.numero||0)-(x.numero||0)); S.listMes = S.filtros.mes; LISTA_EM = Date.now();

// procura exata em todos os processos (nº, NIF ou contrato VDF) — os resultados juntam-se à lista
async function procurarHistorico(){
  const t = (S.filtros.txt||'').trim(); if (t.length<4) return toast('Escreva na caixa de pesquisa o nº do processo, o NIF, o contrato VDF ou o MSISDN completos.', true);
  const col = collection(db,'rpn'), meu = isStaff() ? [] : [where('vendedorUid','==',S.me.uid)];
  const qs = [query(col, ...meu, where('cliente.nif','==',t)), query(col, ...meu, where('contratos','array-contains',t.toUpperCase()))];
  if (normMsisdn(t).length>=9 && /^[\d\s+]+$/.test(t)) qs.push(query(col, ...meu, where('msisdns','array-contains',normMsisdn(t))));
  if (/^\d+$/.test(t)) qs.push(query(col, ...meu, where('numero','==',+t)));
  const r = await Promise.allSettled(qs.map(q=>getDocs(q)));
  const docs = r.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.docs).map(d=>({id:d.id,...d.data()}));
  if (!docs.length) return toast(r.some(x=>x.status==='rejected') ? 'Não foi possível procurar: '+errTxt(r.find(x=>x.status==='rejected').reason) : 'Nada encontrado no histórico com “'+t+'”.', true);
  S.extra = [...(S.extra||[]).filter(x=>!docs.some(d=>d.id===x.id)), ...docs];
  const m2 = {}; [...S.list, ...docs].forEach(x=>m2[x.id]=x); S.list = Object.values(m2).sort((x,y)=>(y.numero||0)-(x.numero||0));
  S.filtros.estado=''; toast(docs.length+' processo(s) encontrado(s) no histórico.'); drawLista();
}

    loja:'Externos', dtAtivacao:'', dtFimEquip:'', prazoPermanencia:24, classificacao:'',
    condicoes:{pnEspecial:false,aprovacaoGA:false,novoNif:false,desconto:0,subsidiacao:0,reuniao:'',infoRisco:'',resumo:''},
    contas:{gsm:'',dados:'',adsl:'',gsm2:'',novaConta:''}, notas:'', linhas:[], nLinhas:0, totRLMC:0, totScore:0,
    propostaRef:'', propostaInfo:'', propostaTarif:'', cargaContada:0, grupoId:'' };
}
// ---- referências compostas (bundles): a linha abre nas filhas, cada uma com a sua % da RLMC total ----
const novoGid = () => Math.random().toString(36).slice(2,10);
const composicaoDe = pr => (pr && Array.isArray(pr.composicao) && pr.composicao.length) ? pr.composicao : null;
function distribuir(ls, total){
  total = Math.round((+total||0)*100)/100; if(!ls.length) return; let soma=0, maior=ls[0];
  ls.forEach(l=>{ l.bTot=total; l.rlmc=Math.round(total*(+l.bPct||0)*100)/100; soma+=l.rlmc; if((+l.bPct||0)>(+maior.bPct||0)) maior=l; });
  maior.rlmc = Math.round((maior.rlmc+total-soma)*100)/100;   // cêntimos do arredondamento vão para a filha maior
}
function linhasDoProduto(base, pr, total){
  const comp = composicaoDe(pr);
  if (!comp) { const l={...base}; aplicarProduto(l,pr); return [l]; }
  const g=novoGid(), nova=/^Nova/.test(base.natureza||'');
  const ls = comp.map(c=>{ const f=S.prodMap[String(c.ref).toUpperCase()]||{ref:c.ref,designacao:c.ref,categoria:''};
    return {...linhaVazia(), ref:f.ref, designacao:f.designacao, tier:f.tier||'', pricingPlan:f.pricingPlan||'', descontinuado:!!f.descontinuado,
      natureza:(nova?'Nova ':'Ref ')+(f.categoria==='Fixo'?'Fixo':'Móvel'), prazo:base.prazo||24, upgrade:!!base.upgrade, nConta:base.nConta||'', contratoVDF:base.contratoVDF||'',
      bGid:g, bRef:pr.ref, bDes:pr.designacao||'', bPct:+c.pct||0, bTot:0}; });
  (ls.find(l=>/Móvel/.test(l.natureza))||ls[0]).msisdn = base.msisdn||'';
  distribuir(ls, total!=null ? total : (+base.rlmc||0));
  return ls;
}
function linhaVazia(t){ if (t && t.bGid) return {...linhaVazia(), natureza:t.natureza, prazo:t.prazo};
  return t ? {...t, msisdn:'', contratoVDF:'', upgrade:false} : {ref:'',designacao:'',natureza:'Ref Móvel',msisdn:'',nConta:'',rlmc:0,prazo:24,tier:'',pricingPlan:'',descontinuado:false,upgrade:false,contratoVDF:''}; }

  $('#main').innerHTML = `

        <div id="cx-edata" style="${r.esperaMotivo&&r.esperaMotivo!=='ciclo'?'':'display:none'}"><label id="lb-edata">${r.esperaMotivo==='instalacao'?'Data da instalação':'Voltar a verificar em (opcional)'}</label><input type="date" data-f="esperaData" value="${esc(r.esperaMotivo!=='ciclo'?(r.esperaData||''):'')}" ${isBO()&&p.edit?'':'disabled'}></div>

      <div class="scroll" id="lines"></div>
    </div>
    <div class="card"><div class="grid g2">
      ${(()=>{ // PN do histórico PHC só com um texto: é o resumo do negócio, mesmo que esteja guardado como nota
        const soNota = r.origem==='PHC' && !r.condicoes?.resumo && r.notas;
        return `<div><label>Resumo do Negócio</label><textarea data-f="condicoes.resumo" ${dis} rows="5">${esc(soNota?r.notas:r.condicoes?.resumo)}</textarea></div>
      <div><label>Relatório BackOffice</label><textarea data-f="notas" ${isBO()&&p.edit?'':'disabled'} rows="5" title="Escrito pela BackOffice. O vendedor só lê.">${esc(soNota?'':r.notas)}</textarea></div>`; })()}

        || (cq.value.trim().length>=2 ? `<div style="cursor:default;color:#777">${S.cli&&S.cli.length?'Nenhum cliente encontrado. Pode preencher o nome e o NIF à mão, ou criá-lo na app Propostas › Clientes.':(isStaff()?'Ainda não há clientes carregados.':'A sua conta não tem carteira de clientes atribuída.')}</div>` : '');

      if (S.cur===rr) { S.dirty=true; drawFicha(); toast('Cliente escolhido: '+c.nome); } };

  $('#l-bulk')?.addEventListener('click',()=>bulkMsisdn(dis));
}

// ---- produtos do catálogo nas linhas ----
function aplicarProduto(l, pr){
  Object.assign(l,{ref:pr.ref,designacao:pr.designacao,tier:pr.tier,pricingPlan:pr.pricingPlan,descontinuado:pr.descontinuado});
  if (pr.categoria==='Fixo' && /Móvel/.test(l.natureza)) l.natureza=l.natureza.replace('Móvel','Fixo');
  if (pr.categoria==='Móvel' && /Fixo/.test(l.natureza)) l.natureza=l.natureza.replace('Fixo','Móvel');
}
let PROD_DROP = null;
function prodDrop(){
  if (!PROD_DROP) { PROD_DROP=document.createElement('div'); PROD_DROP.className='cli-res'; PROD_DROP.id='prod-res'; PROD_DROP.style.position='fixed'; document.body.appendChild(PROD_DROP);
    window.addEventListener('scroll', ()=>PROD_DROP.classList.remove('on'), true); }
  return PROD_DROP;
}
function procurarProdutos(q){
  const t=semAcento(q).trim(); if (t.length<2) return [];
  const pal=t.split(/\s+/), a=[], b=[], c=[];
  for (const p of S.prodList) { if (p.inativo) continue; const r=semAcento(p.ref), d=semAcento(p.designacao);
    if (r.startsWith(t)) a.push(p); else if (d.startsWith(t)) b.push(p); else if (pal.every(w=>r.includes(w)||d.includes(w))) c.push(p); }
  return [...a,...b,...c].slice(0,12);
}
function drawLines(dis){
  const r = S.cur, L = r.linhas;
  $('#lines').innerHTML = `<table class="lines"><thead><tr><th>#</th><th>Referência</th><th>Designação</th><th>Natureza</th><th>MSISDN</th><th>Nº Conta</th><th class="num">RLMC €</th><th title="Prazo de permanência (meses)">Prazo perm.</th><th>Tier</th><th>PricingPlan</th><th>Desc.</th><th>Upgr.</th><th>Contrato VDF</th><th class="num">Score</th><th></th></tr></thead>
  <tbody>${L.map((l,i)=>`${l.bGid && l.bGid!==L[i-1]?.bGid ? `<tr class="bh" data-g="${esc(l.bGid)}"><td>📦</td><td colspan="5"><b>${esc(l.bRef)}</b> — ${esc(l.bDes)} <span class="muted">· bundle</span></td>
      <td><input type="number" step="0.01" data-bt value="${l.bTot||''}" ${dis} title="RLMC total do bundle" style="width:80px;text-align:right;font-weight:700"></td>
      <td colspan="7" class="muted" style="font-size:12px">RLMC total do bundle — repartida pelas linhas abaixo</td>
      <td>${dis?'':`<button class="btn sm ghost" data-gdup title="Duplicar o bundle">⧉</button><button class="btn sm ghost" data-gdel title="Remover o bundle" style="color:var(--red-d)">✕</button>`}</td></tr>`:''}<tr data-i="${i}" ${l.bGid?`class="bf" data-g="${esc(l.bGid)}"`:''}>
    <td class="muted">${i+1}${l.bGid?`<div style="font-size:10px">${(Math.round((+l.bPct||0)*1000)/10).toLocaleString('pt-PT')}%</div>`:''}</td>
    <td><input data-l="ref" value="${esc(l.ref)}" ${l.bGid?'disabled':dis} autocomplete="off" placeholder="referência ou nome…" style="width:170px"></td>
    <td><input data-l="designacao" value="${esc(l.designacao)}" ${l.bGid?'disabled':dis} autocomplete="off" style="width:240px"></td>
    <td><select data-l="natureza" ${dis} style="width:112px">${NATUREZAS.map(n=>`<option ${l.natureza===n?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input data-l="msisdn" value="${esc(l.msisdn)}" ${dis} style="width:110px"></td>
    <td><input data-l="nConta" value="${esc(l.nConta)}" ${dis} style="width:100px"></td>
    <td><input type="number" step="0.01" data-l="rlmc" value="${l.bGid?(+l.rlmc||0):(l.rlmc||'')}" ${l.bGid?'disabled':dis} style="width:80px;text-align:right"></td>
    <td><select data-l="prazo" ${dis} style="width:62px">${[...new Set([...PRAZOS, +l.prazo||24])].sort((a,b)=>a-b).map(n=>`<option value="${n}" ${+l.prazo===n?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><select data-l="tier" ${dis} style="width:90px">${['','Gold','Silver','Bronze','Estanho'].map(n=>`<option ${l.tier===n?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input data-l="pricingPlan" value="${esc(l.pricingPlan)}" ${dis} style="width:95px"></td>
    <td style="text-align:center"><input type="checkbox" data-l="descontinuado" ${l.descontinuado?'checked':''} ${dis}></td>
    <td style="text-align:center"><input type="checkbox" data-l="upgrade" ${l.upgrade?'checked':''} ${dis}></td>
    <td><input data-l="contratoVDF" value="${esc(l.contratoVDF)}" ${dis} placeholder="POS…" style="width:165px"></td>
    <td class="num sc">${n3(scoreLinha(l,r))}</td>
    <td>${dis||l.bGid?'':`<button class="btn sm ghost" data-dup title="Duplicar">⧉</button><button class="btn sm ghost" data-del title="Remover" style="color:var(--red-d)">✕</button>`}</td>
  </tr>`).join('') || `<tr><td colspan="15" class="muted">Sem linhas. ${dis?'':'Use “+ Linha”.'}</td></tr>`}</tbody>
  <tfoot><tr class="tot"><td colspan="6">${L.length} linha(s)</td><td class="num" id="t-rl">${eur(r.totRLMC)}</td><td colspan="6"></td><td class="num" id="t-sc">${n3(r.totScore)}</td><td></td></tr></tfoot></table>`;
  $('#lines').querySelectorAll('[data-l]').forEach(el=>{
    const ev = el.type==='checkbox'||el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev,()=>{
      const i=+el.closest('tr').dataset.i, k=el.dataset.l, l=L[i];
      l[k] = el.type==='checkbox'?el.checked : k==='rlmc'?(parseFloat(el.value)||0) : k==='prazo'?+el.value : el.value;

      if (l.bGid && k==='prazo') { L.forEach(x=>{ if(x.bGid===l.bGid) x.prazo=l.prazo; }); drawLines(dis); return; }
      // referência escrita por inteiro e sem ambiguidade (nenhuma outra começa da mesma forma): aplica logo
      if (k==='ref') { const v=el.value.trim().toUpperCase(), pr=S.prodMap[v]; if (pr && S.prodList.filter(x=>String(x.ref).toUpperCase().startsWith(v)).length===1) { L.splice(i,1,...linhasDoProduto(l,pr)); prodDrop().classList.remove('on'); drawLines(dis); return; } }
      updTotals();
    });
    // bundle: ao sair do campo, o contrato copia-se para as filhas que ainda não têm contrato
    if (el.dataset.l==='contratoVDF') el.addEventListener('change',()=>{ const l=L[+el.closest('tr').dataset.i]; if(!l.bGid || !l.contratoVDF) return;
      L.forEach((x,j)=>{ if(x.bGid===l.bGid && !String(x.contratoVDF||'').trim()) { x.contratoVDF=l.contratoVDF; const o=$('#lines').querySelector(`tr[data-i="${j}"] [data-l="contratoVDF"]`); if(o) o.value=l.contratoVDF; } }); });

      // sem resultados: dizer porquê, em vez de não mostrar nada
      if (!res.length) { box.innerHTML=`<div style="cursor:default;color:#777">${S.prodList.length?`Nenhum produto com “${esc(inp.value.trim())}” nos ${S.prodList.length} do catálogo. Pode escrever a referência à mão.`:'O catálogo de produtos está vazio. O Master tem de o importar em Administração › Catálogo PHC.'}</div>`; box.classList.add('on'); box._dono=inp; box.onmousedown=null; return; }

      box.classList.add('on'); box._dono=inp; box.onmousedown=e=>{ const d=e.target.closest('[data-i]'); if(d){ e.preventDefault(); aplica(res[+d.dataset.i]); } }; };
    inp.addEventListener('input', ()=>{ sel=-1; mostra(); });

      if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); sel=Math.max(0,Math.min(res.length-1, sel+(e.key==='ArrowDown'?1:-1))); mostra(); }

  });

  else if (novo==='A aguardar') extra=[ESPERA_TXT[r.esperaMotivo]||'', r.esperaData?'até '+fmtD(r.esperaData):''].filter(Boolean).join(' · ');
  else if (novo==='Em Conferência') extra='O processo está implementado. Segue para conferência interna e passa depois a PN.';

const CAMPOS_HIST = [['estado','Estado'],['esperaMotivo','A aguardar'],['esperaData','Data da espera'],['boNome','BO'],['vendedorNome','Vendedor'],['cliente.nome','Cliente'],['cliente.nif','NIF'],['nOportunidade','Oportunidade'],['subSfid','Sub-SFID'],['simulador','Simulador'],['atividade','Atividade'],['dtAtivacao','Dt. ativação'],['nLinhas','Nº linhas'],['totRLMC','RLMC total'],['totScore','Score']];
function diffTxt(a,b){
  const out=[]; CAMPOS_HIST.forEach(([k,t])=>{ const x=getPath(a,k), y=getPath(b,k); if(String(x??'')!==String(y??'')) out.push(k==='estado' ? `${t}: ${estTxt(x)||'—'} → ${estTxt(y)||'—'}` : `${t}: ${x??'—'} → ${y??'—'}`); });
  const ma=(a.motivos||[]).join(', '), mb=(b.motivos||[]).join(', '); if(ma!==mb) out.push(`Motivos: ${ma||'—'} → ${mb||'—'}`);
  const ca=(a.linhas||[]).map(l=>l.contratoVDF).join(), cb=(b.linhas||[]).map(l=>l.contratoVDF).join(); if(ca!==cb) out.push('Contratos VDF atualizados');
  return out.join('; ');
}

function validarSubmissao(r){
  const e=[];
  if(!r.cliente?.nome) e.push('nome do cliente'); if(!/^\d{9}$/.test(String(r.cliente?.nif||'').trim())) e.push('NIF (9 dígitos)');
  if(!r.linhas.length) e.push('pelo menos 1 linha');
  r.linhas.forEach((l,i)=>{ if(!l.ref) e.push(`referência da linha ${i+1}`); if(l.bGid){ if(!(+l.bTot>0) && l.bGid!==r.linhas[i-1]?.bGid) e.push(`RLMC total do bundle ${l.bRef}`); } else if(!(+l.rlmc>0)) e.push(`RLMC da linha ${i+1}`); });
  return e;
}
// aus = BackOffices ausentes (config/cargaBO.ausentes); excl = uids a excluir
function escolherBO(carga, aus={}, excl=[]){
  const lista = bos().filter(b=>!aus[b.uid] && !excl.includes(b.uid)); if(!lista.length) throw new Error('Não há BackOffices ativas configuradas para receber RPNs (Administração → Utilizadores → “Recebe RPN”).');
  const min = Math.min(...lista.map(b=>carga[b.uid]||0));
  const cand = lista.filter(b=>(carga[b.uid]||0)===min);
  return cand[Math.floor(Math.random()*cand.length)];
}
// conferência: mesma regra (menos linhas em conferência), nunca quem implementou; devolve null se não houver ninguém
function escolherConf(conf, aus={}, excl=[]){
  const lista = bos().filter(b=>!aus[b.uid] && !excl.includes(b.uid)); if(!lista.length) return null;
  const min = Math.min(...lista.map(b=>conf[b.uid]||0));
  const cand = lista.filter(b=>(conf[b.uid]||0)===min);
  return cand[Math.floor(Math.random()*cand.length)];
}
// realocar a BO que implementa ('bo') ou a que confere ('conf'); uidNovo vazio = automático
async function realocarTx(id, tipo, uidNovo, motivo){

    const s=await tx.get(ref), cs=await tx.get(cargaRef); const r=s.data(), cd=cs.exists()?cs.data():{};
    const carga={...(cd.carga||{})}, conf={...(cd.conf||{})}, aus=cd.ausentes||{};
    const upd={atualizadoEm:serverTimestamp(), atualizadoPor:S.me.uid};
    if (tipo==='bo') {
      if (!ABERTOS.includes(r.estado)) throw new Error('Este RPN já não está em implementação.');
      const novo = uidNovo ? {uid:uidNovo, nome:userNome(uidNovo)} : escolherBO(carga, aus, [r.boUid]);
      if (novo.uid===r.boUid) throw new Error('Já está atribuído a essa BackOffice.');
      const cnt=r.cargaContada||0, nc=r.nLinhas||0;
      if (r.boUid && cnt) carga[r.boUid]=Math.max(0,(carga[r.boUid]||0)-cnt);
      if (nc) carga[novo.uid]=(carga[novo.uid]||0)+nc;
      upd.boUid=novo.uid; upd.boNome=novo.nome; upd.cargaContada=nc; realocarTx.uid=novo.uid;
      if (r.confUid===novo.uid) { upd.confUid=null; upd.confNome=''; }   // quem implementa não pode conferir
      txt=`BO: ${r.boNome||'—'} → ${novo.nome}`;
    } else {
      if (r.estado!=='Em Conferência') throw new Error('Este RPN já não está em conferência.');
      const novo = uidNovo ? {uid:uidNovo, nome:userNome(uidNovo)} : escolherConf(conf, aus, [r.boUid, r.confUid]);
      if (!novo) throw new Error('Não há outra BackOffice disponível para conferir.');
      if (novo.uid===r.boUid) throw new Error('Quem implementou o RPN não o pode conferir.');
      if (novo.uid===r.confUid) throw new Error('Já está atribuído a essa BackOffice.');
      const cnt=r.confContada||0, nc=r.nLinhas||0;
      if (r.confUid && cnt) conf[r.confUid]=Math.max(0,(conf[r.confUid]||0)-cnt);
      if (nc) conf[novo.uid]=(conf[novo.uid]||0)+nc;
      upd.confUid=novo.uid; upd.confNome=novo.nome; upd.confContada=nc; realocarTx.uid=novo.uid;
      txt=`Conferência: ${r.confNome||'em fila'} → ${novo.nome}`;
    }
    tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true});
    tx.update(ref,upd);
  });
  await hist('Realocado', `${txt}. Razão: ${motivo}`, id);
  return txt;
}

    else if (tipo==='devolverImpl') { if(o.estado!=='Em Conferência') return; estado='Em Implementação';
      Object.assign(u,{confNota:nota||'', devMeses:[...new Set([...(o.devMeses||[]), mesLocal()])],
        devolucoes:[...(o.devolucoes||[]), {em:agora, mes:mesLocal(), porUid:S.me.uid, porNome:S.me.nome, aUid:o.implPorUid||o.boUid, aNome:o.implPorNome||o.boNome||'', linhas:o.nLinhas||0, motivo:nota||'', anulada:false}]}); }
    else return;
    u.estado=estado;
    const n=o.nLinhas||0, nc=(ABERTOS.includes(estado)&&bo)?n:0, ncf=(estado==='Em Conferência'&&cf)?n:0;
    if (o.boUid && o.cargaContada) carga[o.boUid]=Math.max(0,(carga[o.boUid]||0)-o.cargaContada);
    if (bo && nc) carga[bo]=(carga[bo]||0)+nc;
    if (o.confUid && o.confContada) conf[o.confUid]=Math.max(0,(conf[o.confUid]||0)-o.confContada);
    if (cf && ncf) conf[cf]=(conf[cf]||0)+ncf;
    u.cargaContada=nc; u.confContada=ncf;
    tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true}); tx.update(ref,u); feito=o.numero; antes={...o, ...u, _de:o.estado};
  });
  if (feito!=null) await hist({submeter:'Submetido',conferencia:'Concluído · enviado para conferência',conferido:'Conferido → PN',devolverImpl:'Devolvido à implementação'}[tipo],
    `Em conjunto com o RPN ${L.numero} (mesmo grupo)`+(tipo==='submeter'?`. BackOffice: ${L.boNome}`:tipo==='conferencia'?`. Conferência: ${L.confNome||'em fila'}`:tipo==='devolverImpl'?`: ${nota}`:`, por ${S.me.nome}`), id);
  if (feito!=null && antes) await msgEstado(id, antes, antes._de, antes.estado);
  return feito;
}

async function eliminar(){
  const r=S.cur;
  if (r.estado==='Em Elaboração') { if(!confirm(`Eliminar definitivamente o RPN ${r.numero}?`)) return; }
  else { const t=prompt(`O ${r.estado==='PN'?'PN':'RPN'} ${r.numero} está em «${estTxt(r.estado)}». Vai ser apagado com anexos, mensagens e histórico, e não pode ser recuperado.\n\nPara confirmar, escreva o número ${r.numero}:`); if(t===null) return; if(String(t).trim()!==String(r.numero)) return toast('Número errado. Nada foi apagado.',true); }
  try {
    // anexos (ficheiros + registos), mensagens e histórico: apaga o que as permissões deixarem, antes do próprio RPN
    for (const sub of ['anexos','mensagens','historico']) { try { const sn=await getDocs(collection(db,'rpn',r.id,sub));
      for (const d of sn.docs) { if(sub==='anexos' && d.data().path) await deleteObject(sref(st,d.data().path)).catch(()=>{}); await deleteDoc(d.ref).catch(()=>{}); } } catch(e){ console.warn(sub,e); } }
    await runTransaction(db, async tx => {
      const cargaRef=doc(db,'config','cargaBO'); const cs=await tx.get(cargaRef);
      const carga={...(cs.data()?.carga||{})}, conf={...(cs.data()?.conf||{})};
      if (r.boUid && r.cargaContada) carga[r.boUid]=Math.max(0,(carga[r.boUid]||0)-r.cargaContada);
      if (r.confUid && r.confContada) conf[r.confUid]=Math.max(0,(conf[r.confUid]||0)-r.confContada);
      if ((r.boUid && r.cargaContada)||(r.confUid && r.confContada)) tx.set(cargaRef,{carga,conf,atualizadoEm:serverTimestamp()},{merge:true});
      tx.delete(doc(db,'rpn',r.id));
    });
    if (r.propostaRef) { const irm=await irmaos(r).catch(()=>[]);   // sem mais RPN, a proposta fica outra vez livre
      await updateDoc(doc(db,'propostas',r.propostaRef), irm.length?{rpnId:irm[0].id,rpnNumero:irm.map(x=>x.numero).join(' + ')}:{rpnId:'',rpnNumero:''}).catch(()=>{}); }
    S.dirty=false; toast('RPN eliminado.'); location.hash='#/lista';
  } catch(e){ toast(errTxt(e),true); }
}

// preenche os campos vazios do cliente a partir da ficha (coleção clientesFicha, chave = NIF)
// índice de pesquisa de clientes (o mesmo da app Propostas): carregado uma vez por sessão, só quando é preciso
const semAcento = v => String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function carregarClientes(){
  if (S.cli) return S.cli;
  const col = collection(db,'clientes'); let docs = [];
  if (isStaff()) docs = (await getDocs(col)).docs;
  else if (S.me.vendedorPHC) docs = (await getDocs(query(col, where('vendedor','==',String(S.me.vendedorPHC))))).docs;
  S.cli = docs.flatMap(d => (d.data().lista||[]).map(c => ({nome:c.nome||'', nif:String(c.ncont||''), local:c.local||c.area||'', vend:c.vendnm||'', _n:semAcento(c.nome)})));
  return S.cli;
}
function procurarClientes(q){
  const t = semAcento(q).trim(); if (t.length<2 || !S.cli) return [];
  const dig = /^\d+$/.test(t.replace(/\s/g,'')) ? t.replace(/\s/g,'') : '';
  const pal = t.split(/\s+/);
  const ini=[], meio=[];
  for (const c of S.cli) {
    if (dig) { if (c.nif.startsWith(dig)) ini.push(c); else if (c.nif.includes(dig)) meio.push(c); }
    else if (c._n.startsWith(t)) ini.push(c);
    else if (pal.every(p=>c._n.includes(p))) meio.push(c);
    if (ini.length>=12) break;
  }
  return [...ini, ...meio].slice(0,12);
}
async function preencherCliente(r, substituir){
  const nif = String(r?.cliente?.nif||'').replace(/\s/g,''); if(nif.length<5) return false;
  try {
    const s = await getDoc(doc(db,'clientesFicha',nif)); if(!s.exists()) return false;
    const c = s.data(), k = r.cliente; let n = 0;
    const put = (o,f,v) => { if (substituir ? (String(o[f]||'')!==String(v||'')) : (v && !o[f])) { o[f]=String(v||''); n++; } };
    put(k,'nome',c.nome); put(k,'nCliente',c.no); put(k,'email',c.email); put(k,'interlocutor',c.contacto); put(k,'telefone',c.tlmvl||c.telefone);
    put(k,'morada1',c.morada); put(k,'localidade',c.local); put(k,'codPostal',c.codpost);
    r.contas = r.contas||{}; put(r.contas,'gsm',c.contaA);
    return n>0;
  } catch(e){ return false; }
}

// ---------- 9. LIGAÇÃO ÀS PROPOSTAS ( ?prop=<base64 JSON> ) ----------
function handlePropostaParam(){
  const u = new URL(location.href), raw = u.searchParams.get('prop'); if(!raw) return;
  u.searchParams.delete('prop'); history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams:'')+'#/novo');
  let p; try { const b64 = raw.replace(/-/g,'+').replace(/_/g,'/'); p = JSON.parse(decodeURIComponent(escape(atob(b64 + '==='.slice((b64.length+3)%4))))); } catch(e){ toast('Dados da proposta inválidos.',true); return; }
  const r = rpnVazio();
  const TIPO_TXT = {novo:'Novo Serviço', refid:'Refidelização', upgrade:'Upgrade'};
  const nova = p.tipo==='novo', upg = p.tipo==='upgrade';
  r.propostaRef = p.ref||''; r.cliente.nome = p.cliente||''; r.cliente.nif = String(p.nif||'').trim(); r.cliente.email = p.email||''; r.condicoes.resumo = p.notas||''; r.simulador = String(p.simulador||'');
  // BackOffice/Master a abrir a proposta de um comercial: o RPN fica em nome do comercial da proposta
  if (isBO() && p.comercial) { const v = Object.entries(S.users).find(([,u])=>(u.nome||'').trim().toLowerCase()===String(p.comercial).trim().toLowerCase()); if (v) { r.vendedorUid=v[0]; r.vendedorNome=v[1].nome; r.subSfid=v[1].sfid||''; } }
  // Formato da app de Propostas:  "912 345 678 TARIFÁRIO [24m] [REF_PHC]; 10× TARIFÁRIO [24m] [REF_PHC]"
  String(p.tarif||'').split(/;|\n|\|/).map(x=>x.trim()).filter(Boolean).forEach(sg=>{
    const br = [...sg.matchAll(/\[([^\]]+)\]/g)].map(x=>x[1].trim());
    const pz = br.find(b=>/^\d+\s*m$/i.test(b));
    const rf = br.filter(b=>!/^\d+\s*m$/i.test(b)).pop();
    let resto = sg.replace(/\[[^\]]+\]/g,'').trim(), qtd = 1, msisdn = '';
    const q = resto.match(/^(\d+)\s*[×x]\s+/i);
    if (q) { qtd = Math.min(Math.max(+q[1],1),300); resto = resto.slice(q[0].length); }
    else { const m = resto.match(/^(\d[\d ]{7,14}\d)\s+/); if (m && m[1].replace(/\s/g,'').length>=9) { msisdn = m[1].replace(/\s/g,''); resto = resto.slice(m[0].length); } }
    const pr = rf && S.prodMap[rf.toUpperCase()];
    const fixo = pr ? pr.categoria==='Fixo' : false;
    const l = linhaVazia();
    Object.assign(l, { designacao: resto.trim(), msisdn, upgrade: upg, prazo: pz ? parseInt(pz) : (+p.duracao||24),
      natureza: (nova?'Nova ':'Ref ') + (fixo?'Fixo':'Móvel') });
    if (composicaoDe(pr)) { for (let i=0;i<qtd;i++) r.linhas.push(...linhasDoProduto(l,pr)); return; }   // bundle: abre nas filhas
    if (pr) Object.assign(l, {ref:pr.ref, designacao:pr.designacao, tier:pr.tier, pricingPlan:pr.pricingPlan, descontinuado:pr.descontinuado});
    else l.ref = rf||'';
    for (let i=0;i<qtd;i++) r.linhas.push({...l});
  });
  const mens = parseFloat(String(p.mensalidade||'').replace(',','.'))||0;
  if (r.linhas.length===1 && mens) r.linhas[0].rlmc = mens;
  else if (mens && r.linhas.length && r.linhas[0].bGid && r.linhas.every(l=>l.bGid===r.linhas[0].bGid)) distribuir(r.linhas, mens);   // um único bundle: a mensalidade é a RLMC total
  r.propostaInfo = [TIPO_TXT[p.tipo]||p.tipo, mens?`mensalidade total ${eur(mens)} €`:'', p.duracao?`${p.duracao} meses`:'', p.comercial?`comercial: ${p.comercial}`:''].filter(Boolean).join(' · ');
  r.propostaTarif = String(p.tarif||'');
  S.pendingNovo = r;
  preencherCliente(r).then(ok=>{ if(ok && S.cur===r) drawFicha(); });
  // aviso de duplicado
  const q = isStaff() ? query(collection(db,'rpn'),where('propostaRef','==',r.propostaRef)) : query(collection(db,'rpn'),where('vendedorUid','==',S.me.uid),where('propostaRef','==',r.propostaRef));
  if (r.propostaRef) getDocs(q).then(s=>{ if(!s.empty) toast(`Atenção: já existe o RPN ${s.docs[0].data().numero} para esta proposta.`, true); }).catch(()=>{});
}

// ---------- 9c. PROJETOS: renegociação 6 meses antes do fim da fidelização ----------
// Um Projeto por cliente e por mês (projetos/{NIF}_{AAAA-MM}), para o vendedor que está na ficha do cliente nesse momento.
const PROPOSTAS_URL = 'propostas.html';   // produção: propostas.html
const MANUAL_URL = 'manual.html';   // produção: manual.html
const PROJ_ESTADOS = ['Por tratar','Em negociação','Ganho','Perdido','Adiado'];
const PROJ_PEND = ['Por tratar','Adiado'];   // ainda à espera de decisão (um adiado volta a contar quando a nova data chega)
const PROJ_ADIA_MAX = 180;   // dias, a contar da data de alerta original
const PROJ_PRAZOS = [12,18,24,30,36,48];
const PROJ_ANTECEDENCIA = 6;   // meses antes do fim do contrato
const somaMeses = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); };
const diaNoMes = (ym,d) => { const [y,m]=ym.split('-').map(Number); return ym+'-'+String(Math.min(d, new Date(y,m,0).getDate())).padStart(2,'0'); };   // dia 31 num mês de 30 → dia 30
const dataPN = r => String(r.fechadoEm||r.conferidoEm||r.data||'').slice(0,10);
const hojeLocal = () => { const d=new Date(); return mesLocal(d)+'-'+String(d.getDate()).padStart(2,'0'); };
async function gerarProjetos(M){
  const cand={};
  for (const P of PROJ_PRAZOS) {   // um PN com prazo P fechado no mês M−(P−6) chega aos 6 meses do fim no mês M
    const sn=await getDocs(query(collection(db,'rpn'), where('mesRef','==',somaMeses(M,-(P-PROJ_ANTECEDENCIA)))));
    sn.forEach(d=>{ const r=d.data(); if(!['PN','Concluído'].includes(r.estado)) return; const nif=String(r.cliente?.nif||'').trim(); if(!nif) return;
      (r.linhas||[]).forEach(l=>{ if((+l.prazo||0)===P) (cand[nif]=cand[nif]||[]).push({pnId:d.id, r, l, P}); }); });
  }
  const porVend={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.vendedorPHC && u.ativo!==false) porVend[String(u.vendedorPHC)]=uid; });
  const res={mes:M, clientes:Object.keys(cand).length, criados:0, jaHavia:0, semLinhas:0, semVendedor:0, tiradas:0, linhas:0}, ops=[];
  for (const nif of Object.keys(cand)) {
    const pid=nif+'_'+M;
    const [todos, ficha, ex] = await Promise.all([getDocs(query(collection(db,'rpn'), where('cliente.nif','==',nif))), getDoc(doc(db,'clientesFicha',nif)), getDoc(doc(db,'projetos',pid))]);
    if (ex.exists()) { res.jaHavia++; continue; }
    const outros=todos.docs.map(d=>({id:d.id, ...d.data()})).filter(x=>!['Cancelado','Reprovado'].includes(x.estado));
    const linhas=[];
    cand[nif].forEach(({pnId,r,l,P})=>{
      const dPN=dataPN(r), ms=normMsisdn(l.msisdn), temMs=ms.length>=9;
      // já renegociado (PN posterior) ou em negociação (RPN em curso) com o mesmo MSISDN → a linha não entra
      if (temMs && outros.some(x=>x.id!==pnId && (!FECHADOS.includes(x.estado) || dataPN(x)>dPN) && (x.msisdns||listaMsisdn(x.linhas)).includes(ms))) { res.tiradas++; return; }
      const dia=+dPN.slice(8,10)||1, mPN=r.mesRef||dPN.slice(0,7);
      linhas.push({ref:l.ref||'', designacao:l.designacao||'', msisdn:l.msisdn||'', natureza:l.natureza||'', rlmc:+l.rlmc||0, prazo:P, tier:l.tier||'', score:scoreLinha(l,r), bRef:l.bRef||'', bGid:l.bGid||'',
        pnId, pnNumero:r.numero||'', pnData:dPN, alerta:diaNoMes(M,dia), fim:diaNoMes(somaMeses(mPN,P),dia), confirmar:!temMs});
    });
    if (!linhas.length) { res.semLinhas++; continue; }
    linhas.sort((a,b)=>a.alerta.localeCompare(b.alerta)||String(a.pnNumero).localeCompare(String(b.pnNumero)));
    const f=ficha.exists()?ficha.data():null, cod=String(f?.vendedor||''), uid=porVend[cod]||null; if(!uid) res.semVendedor++;
    ops.push([pid,{nif, clienteNome:f?.nome||cand[nif][0].r.cliente?.nome||'', mes:M, alertaEm:linhas[0].alerta, fimEm:linhas.map(l=>l.fim).sort()[0],
      vendedorUid:uid, vendedorNome:uid?S.users[uid].nome:'', vendedorPHC:cod, linhas, nLinhas:linhas.length,
      totRLMC:Math.round(linhas.reduce((a,l)=>a+l.rlmc,0)*100)/100, totScore:Math.round(linhas.reduce((a,l)=>a+(+l.score||0),0)*1000)/1000,
      estado:'Por tratar', propostaId:'', motivoPerda:'', criadoEm:serverTimestamp(), criadoPor:S.me.uid}]);
    res.linhas+=linhas.length;
  }
  for (let i=0;i<ops.length;i+=300){ const b=writeBatch(db); ops.slice(i,i+300).forEach(([id,d])=>b.set(doc(db,'projetos',id),d)); await b.commit(); }
  res.criados=ops.length;
  await setDoc(doc(db,'config','projetos'),{gerados:{[M]:{em:new Date().toISOString(), por:S.me.nome, criados:res.criados}}},{merge:true});

          try{ await updateDoc(doc(db,'projetos',p.id),{estado:'Adiado', alertaEm:d, alertaOriginal:orig, adiamentos:[...(p.adiamentos||[]),{em:new Date().toISOString(), porUid:S.me.uid, porNome:S.me.nome, de:p.alertaEm, para:d, motivo:mo}], atualizadoEm:serverTimestamp(), atualizadoPor:S.me.uid});

];

const nifValido = n => { if(!/^\d{9}$/.test(n)) return false; let t=0; for(let i=0;i<8;i++) t+=(+n[i])*(9-i); const r=t%11; return (r<2?0:11-r)===+n[8]; };
const vendPHCNome = v => { v=String(v||''); if(!v) return ''; const us=Object.values(S.users).filter(u=>String(u.vendedorPHC||'')===v); return (us.find(u=>u.ativo!==false)||us[0])?.nome||''; };
// quem altera fichas: BackOffice e Master, todas; o comercial, as da sua carteira; o Coordenador só consulta (igual à app Propostas)
const cliPodeEditar = f => isBO() || (perfil()==='comercial' && !!S.me.vendedorPHC && String(f?.vendedor||'')===String(S.me.vendedorPHC));
const cliPodeCriar = () => isBO() || (perfil()==='comercial' && !!S.me.vendedorPHC);
const natGrupo = l => { const n=String(l.natureza||''); if(/m[óo]vel/i.test(n)) return 'Móvel'; if(/fix/i.test(n)) return 'Fixo';
  const c=S.prodMap[String(l.ref||'').toUpperCase()]?.categoria; return c==='Móvel'||c==='Fixo' ? c : 'Outros'; };
const idxCli = f => ({ nome:f.nome||'', ncont:String(f.ncont||''), codpost:f.codpost||'', area:f.area||'', local:f.local||'', vendnm:f.vendnm||'' });

// grava a ficha e mantém o índice de pesquisa (a mesma transação da app Propostas)
function gravarFicha(f, isNew){
  const nif=String(f.ncont), ref=doc(db,'clientesFicha',nif), uid=S.me.uid;
  return runTransaction(db, async tx => {
    const s=await tx.get(ref);
    if (isNew && s.exists()) { const e=new Error('NIF já existe'); e.code='ja-existe'; throw e; }
    const old=s.exists()?s.data():null, v=String(f.vendedor||''), entry=idxCli(f);
    let blk=(old&&old.blk)||'';
    if (old && blk && v===String(old.vendedor||'')) {
      const br=doc(db,'clientes',blk), bs=await tx.get(br), lista=bs.exists()?(bs.data().lista||[]):[];
      const i=lista.findIndex(x=>String(x.ncont)===nif); if(i>=0) lista[i]=entry; else lista.push(entry);
      tx.set(br,{vendedor:v, lista});
    } else {
      const nb=(v||'sem')+'_novos', nr=doc(db,'clientes',nb), ns=await tx.get(nr);
      let or=null, os=null; if (old && blk && blk!==nb) { or=doc(db,'clientes',blk); os=await tx.get(or); }
      const nl=ns.exists()?(ns.data().lista||[]).filter(x=>String(x.ncont)!==nif):[];
      nl.push(entry); tx.set(nr,{vendedor:v, lista:nl});
      if (os && os.exists()) tx.set(or,{vendedor:os.data().vendedor, lista:(os.data().lista||[]).filter(x=>String(x.ncont)!==nif)});
      blk=nb;
    }
    const data={...f, blk, atualizadoEm:serverTimestamp(), atualizadoPorUid:uid};
    if (!old) { data.criadoEm=serverTimestamp(); data.criadoPorUid=uid; data.origem='plataforma'; }
    tx.set(ref, data, {merge:true});
    return blk;
  });
}

function viewClientes(){
  const arg=decodeURIComponent((location.hash.split('/')[2]||'').trim());
  if (arg==='novo') { if(!cliPodeCriar()) { location.hash='#/clientes'; return; } Object.assign(CL,{nif:null, tab:'ficha', f:{ncont:'', nome:'', vendedor:perfil()==='comercial'?String(S.me.vendedorPHC):''}, edit:true, novo:true, d:{}}); return desenharCliente(); }
  if (arg) return cliAbrir(arg);
  return cliLista();
}

    tb.innerHTML=L.slice(0,100).map(c=>`<tr class="click" data-nif="${esc(c.nif)}"><td><b>${esc(c.nome)}</b></td><td>${esc(c.nif)}</td><td>${esc(c.local)}</td><td class="muted">${esc(c.vend||'—')}</td></tr>`).join('')||`<tr><td colspan="4" class="muted">Nenhum cliente encontrado.</td></tr>`;

async function cliAbrir(nif){
  const m=$('#main');

// processos do cliente: o comercial vê também os PN feitos por vendedores anteriores, desde que o cliente esteja hoje na sua carteira (só leitura)
async function cliRpns(nif){
  const col=collection(db,'rpn'), map=sn=>sn.docs.map(d=>({id:d.id, ...d.data()}));
  try { return map(await getDocs(query(col, where('cliente.nif','==',nif)))); }
  catch(e){ if (isStaff()) throw e; CL.d.soMeus=true; return map(await getDocs(query(col, where('vendedorUid','==',S.me.uid), where('cliente.nif','==',nif)))); }
}
async function cliDados(tab){
  const nif=CL.nif, d=CL.d, k=tab==='fid'?'rpn':tab;
  if (d[k]) return;
  if (k==='rpn') d.rpn=(await cliRpns(nif)).sort((a,b)=>String(dataPN(b)).localeCompare(String(dataPN(a)))||(+b.numero||0)-(+a.numero||0));
  if (k==='proj') { const meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)]; d.proj=(await getDocs(query(collection(db,'projetos'), ...meu, where('nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(b.alertaEm||'').localeCompare(a.alertaEm||'')); }
  if (k==='ativ') { const meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)]; d.ativ=(await getDocs(query(collection(db,'atividades'), ...meu, where('cliente.nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(b.numero||0)-(a.numero||0)); }
  if (k==='prop') { const meu=isStaff()?[]:[where('comercialUid','==',S.me.uid)]; d.prop=(await getDocs(query(collection(db,'propostas'), ...meu, where('nif','==',nif)))).docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>(+b.ord||0)-(+a.ord||0)); }
}
// linhas de PN ainda dentro do prazo de fidelização: por MSISDN conta o PN mais recente; ordenadas pela data de fim (a mais próxima primeiro)
function fidelizacoes(rs){
  const h=hojeLocal(), porMs={}, sem=[];
  rs.filter(r=>['PN','Concluído'].includes(r.estado)).forEach(r=>{
    const dPN=dataPN(r); if(!dPN) return; const dia=+dPN.slice(8,10)||1, mPN=r.mesRef||dPN.slice(0,7);
    (r.linhas||[]).forEach(l=>{ const P=+l.prazo||0; if(!P) return;
      const o={ref:l.ref||'', designacao:l.designacao||'', msisdn:l.msisdn||'', nat:natGrupo(l), natureza:l.natureza||'', prazo:P, rlmc:+l.rlmc||0, pnId:r.id, pnNumero:r.numero||'', pnData:dPN, vend:r.vendedorNome||'', fim:diaNoMes(somaMeses(mPN,P),dia)};
      const ms=normMsisdn(l.msisdn);
      if (ms.length<9) return sem.push(o);
      const a=porMs[ms];
      if (!a || dPN>a.pnData || (dPN===a.pnData && r.id!==a.pnId && (+r.numero||0)>(+a.num||0))) porMs[ms]={pnId:r.id, pnData:dPN, num:r.numero, ls:[o]};
      else if (a.pnId===r.id) a.ls.push(o);
    });
  });
  return [...Object.values(porMs).flatMap(x=>x.ls), ...sem].filter(o=>o.fim>=h).sort((a,b)=>a.fim.localeCompare(b.fim)||String(a.msisdn).localeCompare(String(b.msisdn)));
}

      <tbody>${d.proj.map(p=>`<tr class="click" data-pj="${esc(p.id)}"><td>${fmtD(p.alertaEm)}</td><td>${p.vendedorUid?esc(p.vendedorNome):'por atribuir'}</td><td class="num">${p.nLinhas||0}</td><td class="num">${eur(p.totRLMC)}</td><td>${fmtD(p.fimEm)}</td><td><span class="badge pj-${PROJ_ESTADOS.indexOf(p.estado)}">${esc(p.estado)}</span>${p.propostaId?` <span class="muted" style="font-size:11px">${esc(p.propostaId)}</span>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="muted">Sem Projetos para este cliente.</td></tr>`}</tbody></table></div>`;
  } else if (tab==='prop') {

  }
  m.innerHTML=`<div class="card">
    <div class="row" style="margin-bottom:6px"><a href="#/clientes" id="cl-bk" class="muted" style="font-size:12px">← Clientes</a></div>
    <div class="row" style="margin-bottom:12px"><div><h2 id="cl-tit" style="margin:0">${novo?'Novo cliente':esc(f.nome||'—')}</h2>
      <div class="muted" style="font-size:12px">${novo?'O NIF identifica o cliente e não pode repetir-se.':`NIF ${esc(f.ncont)}${f.no?' · Nº PHC '+esc(f.no):''} · ${vn?'vendedor: '+esc(vn):'sem vendedor'}`}</div></div>
      <span class="sp"></span>${!novo&&!CL.edit?`<button class="btn pri" id="cl-rpn" title="Abre um RPN novo já com os dados deste cliente">+ Novo RPN</button>`:''}</div>
    ${novo?'':`<div class="tabs">${CLI_TABS.map(([k,t])=>`<a data-ct="${k}" class="${tab===k?'on':''}">${t}</a>`).join('')}</div>`}
    <div id="cl-corpo">${corpo}</div></div>`;
  const sair=()=>!CL.edit || !S.dirty || confirm('Há alterações por guardar na ficha. Continuar sem guardar?');
  m.querySelectorAll('[data-ct]').forEach(a=>a.onclick=()=>{ if(!sair()) return; if (CL.edit) { CL.edit=false; S.dirty=false; CL.f=null; CL.tab=a.dataset.ct; return cliAbrir(CL.nif); } CL.tab=a.dataset.ct; desenharCliente(); });
  $('#cl-rpn')?.addEventListener('click',()=>{ const r=rpnVazio(); r.cliente.nif=String(f.ncont); r.cliente.nome=f.nome||''; preencherCliente(r).then(()=>{ S.pendingNovo=r; location.hash='#/novo'; }); });
  m.querySelectorAll('#cl-rt [data-id]').forEach(tr=>tr.onclick=()=>{ location.hash='#/rpn/'+tr.dataset.id; });
  m.querySelectorAll('#cl-at [data-id]').forEach(tr=>tr.onclick=()=>{ location.hash='#/atividades/'+tr.dataset.id; });
  $('#cl-atn')?.addEventListener('click',()=>{ const a=atVazia(); a.cliente={nif:String(f.ncont), nome:f.nome||''}; a.conta=f.contaA||''; AT.pend=a; location.hash='#/atividades/novo'; });
  m.querySelectorAll('#cl-pt [data-pj]').forEach(tr=>tr.onclick=()=>abrirProjeto(d.proj.find(p=>p.id===tr.dataset.pj), ()=>{ CL.d.proj=null; if (location.hash.startsWith('#/clientes/')) desenharCliente(); }));
  if (tab!=='ficha') return;
  if (CL.edit) m.querySelectorAll('#cl-form [data-k]').forEach(el=>el.addEventListener('input',()=>{ S.dirty=true; }));
  $('#cl-ed')?.addEventListener('click',()=>{ CL.edit=true; desenharCliente(); });

  $('#cl-sv')?.addEventListener('click', async()=>{
    m.querySelectorAll('#cl-form [data-k]').forEach(el=>{ if(!el.disabled || el.dataset.k==='vendedor') f[el.dataset.k]=el.value.trim(); });
    f.ncont=String(f.ncont||'').replace(/\s/g,'').toUpperCase();
    if (!f.nome) return toast('Falta o nome do cliente.',true);
    if (!f.ncont) return toast('O NIF é obrigatório.',true);
    if (novo) {
      if (/[\/.#$\[\]]/.test(f.ncont)) return toast('O NIF tem caracteres inválidos.',true);
      if (/^\d+$/.test(f.ncont) && !nifValido(f.ncont) && !confirm(`"${f.ncont}" não é um NIF português válido (dígito de controlo errado).\n\nGravar mesmo assim?`)) return;
    }
    const data={}; CLI_KEYS.forEach(k=>{ if (f[k]!=null) data[k]=f[k]; });
    data.vendedor=String(f.vendedor||''); data.vendnm=vendPHCNome(data.vendedor);
    const bt=$('#cl-sv'); bt.disabled=true;
    try { await gravarFicha(data, novo); S.cli=null; S.dirty=false; toast(novo?'Cliente criado.':'Ficha guardada.');
      Object.assign(CL,{nif:data.ncont, f:null, edit:false, novo:false, tab:'ficha', d:{}});
      if (location.hash==='#/clientes/'+encodeURIComponent(data.ncont)) cliAbrir(data.ncont); else location.hash='#/clientes/'+encodeURIComponent(data.ncont);
    } catch(e){ bt.disabled=false; const c=e?.code||'';
      if (c==='ja-existe' || (novo && c.includes('permission-denied'))) toast(`Já existe um cliente com o NIF ${f.ncont}${c==='ja-existe'?'':' (na carteira de outro vendedor)'}. Não é possível repetir NIFs.`,true);
      else toast(errTxt(e),true); }
  });
}

// ---------- 9e. ATIVIDADES: pedidos dos vendedores à BackOffice sem negócio associado (desativações, 2.ªs vias, créditos, alterações…) ----------
// Coleção atividades/{id} (+ anexos, mensagens, historico). Mesma filosofia do RPN, sem linhas nem Score: a BO trata e fecha (não há conferência).
const AT_ESTADOS = ['Em Elaboração','Submetido','Em tratamento','Pendente Comercial','A aguardar','Concluído','Cancelado','Recusado'];
const AT_CURSO   = ['Em Elaboração','Submetido','Em tratamento','Pendente Comercial','A aguardar'];
const AT_ABERTAS = ['Submetido','Em tratamento','Pendente Comercial','A aguardar'];   // contam 1 para a carga da BO
const AT_FECHADAS = ['Concluído','Cancelado','Recusado'];
const AT_PONTUAM = ['Concluído','Recusado'];   // contam para a Produção BO (a BO tratou o pedido)
const AT_EDIT_COM = ['Em Elaboração','Pendente Comercial'];
const AT_ASSUNTOS = ['Aprovação','Implementação','Correcção Implementação'];
const AT_SUBS = ['Alteração','Desativação','Desconto','Tarifário','Créditos','Faturação','Equipamentos','Outros'];
const AT_GUIA = {   // texto-guia: entra na descrição quando ela está vazia, para o pedido chegar completo à BO
  'Alteração':'O que deve ser alterado:\nComo está hoje → como deve ficar:',
  'Desativação':'Serviço(s) a desativar:\nData efetiva:\nRecolha de equipamentos (sim/não) e morada:',
  'Desconto':'Desconto pedido:\nJustificação:',
  'Tarifário':'Número(s):\nTarifário atual → tarifário pretendido:',
  'Créditos':'Motivo do crédito:\nFatura / mês a que respeita:',
  'Faturação':'Pedido (2.ª via, dados de faturação, forma de pagamento…):\nMês / fatura:',
  'Equipamentos':'Equipamento e referência:\nQuantidade:\nCondições (venda standard, plafond…):\nMorada de entrega e pessoa de contacto:' };
const AT_DIAS_ALERTA = 5;   // dias em aberto a partir dos quais a lista destaca o pedido
const AT = {lista:null, mes:null, listaMes:null, extra:[], f:{estado:'',txt:'',meus:null}, cur:null, tab:'pedido'};
const atNum = r => r?.numero ? 'A'+r.numero : '—';
const atVazia = () => ({ numero:null, data:hoje(), estado:'Em Elaboração', vendedorUid:S.me.uid, vendedorNome:S.me.nome, boUid:null, boNome:'', cliente:{nif:'',nome:''},
  assunto:'', subAssunto:'', descricao:'', resposta:'', conta:'', msisdns:'', dataEfetiva:'', refVDF:'', pnNumero:'', valor:'', motivo:'', cargaContada:0 });
const atDias = r => { const d0=String(r.submetidoEm||'').slice(0,10); if(!d0) return 0; const d1=AT_FECHADAS.includes(r.estado)?String(r.fechadoEm||'').slice(0,10)||hojeLocal():hojeLocal(); return Math.max(0, Math.round((new Date(d1+'T12:00:00')-new Date(d0+'T12:00:00'))/864e5)); };
const atHist = (id, acao, detalhe) => addDoc(collection(db,'atividades',id,'historico'),{acao, detalhe:detalhe||'', porUid:S.me.uid, porNome:S.me.nome, em:serverTimestamp()}).catch(e=>console.warn('atHist',e));
const atMsisdns = t => [...new Set(String(t||'').split(/[,;\n\/]+/).map(normMsisdn).filter(x=>x.length>=9))];
// aviso automático ao vendedor quando a BO muda o estado
async function atAviso(id, r, antigo, novo){
  if (!id || antigo===novo || !r.vendedorUid || S.me.uid===r.vendedorUid || novo==='Em Elaboração') return;
  const extra = novo==='Concluído' ? (r.resposta?'Relatório BackOffice: '+r.resposta:'') : (['Pendente Comercial','A aguardar','Cancelado','Recusado'].includes(novo) && r.motivo ? 'Motivo: '+r.motivo : '');
  const agora=new Date().toISOString(), texto=`Novo estado: "${novo}"`+(extra?'\n'+extra:'');
  try { await addDoc(collection(db,'atividades',id,'mensagens'),{texto, auto:true, porUid:S.me.uid, porNome:S.me.nome, em:serverTimestamp()});
    const u={em:agora, porUid:S.me.uid, porNome:S.me.nome}; await setDoc(doc(db,'atividades',id),{msgUlt:u, msgLido:{[S.me.uid]:agora}},{merge:true});
    if (AT.cur?.id===id) { AT.cur.msgUlt=u; AT.cur.msgLido={...(AT.cur.msgLido||{}),[S.me.uid]:agora}; }
  } catch(e){ console.warn('atAviso',e); }
}

function viewAtividades(){
  const arg=decodeURIComponent((location.hash.split('/')[2]||'').trim());
  if (arg==='novo') { AT.cur=AT.pend||atVazia(); AT.pend=null; AT.cur.id=null; AT.tab='pedido'; return atFicha(); }
  if (arg) return atAbrir(arg);
  return atLista();
}
async function atLista(forcar){
  const m=$('#main'); AT.mes=AT.mes||mesLocal();
  if (!forcar && AT.lista && AT.listaMes===AT.mes && Date.now()-AT_EM < LISTA_TTL) return atDesenhaLista();
  m.innerHTML=`<div class="card muted">A carregar Atividades…</div>`;
  try {
    const col=collection(db,'atividades'), meu=isStaff()?[]:[where('vendedorUid','==',S.me.uid)];
    const [a,f]=await Promise.all([getDocs(query(col, ...meu, where('estado','in',AT_CURSO))), getDocs(query(col, ...meu, where('mesRef','==',AT.mes)))]);
    const mp={}; [...a.docs, ...f.docs].forEach(d=>mp[d.id]={id:d.id, ...d.data()}); (AT.extra||[]).forEach(x=>{ if(!mp[x.id]) mp[x.id]=x; });
    AT.lista=Object.values(mp).sort((x,y)=>(y.numero||0)-(x.numero||0)); AT.listaMes=AT.mes; AT_EM=Date.now();
  } catch(e){ m.innerHTML=`<div class="card">Erro: ${esc(errTxt(e))}</div>`; return; }
  if (AT.f.meus===null) AT.f.meus = perfil()==='backoffice';
  atDesenhaLista();
}
function atDesenhaLista(){
  if (!S.me || !AT.lista || !location.hash.startsWith('#/atividades')) return;
  const f=AT.f, all=AT.lista, stf=isStaff();
  const lim=(()=>{ const d=new Date(); d.setDate(d.getDate()-DIAS_CONCLUIDO); return d.toISOString(); })(), extra=new Set((AT.extra||[]).map(x=>x.id));
  const velho = r => !stf && AT.mes===mesLocal() && AT_FECHADAS.includes(r.estado) && !extra.has(r.id) && !msgPorLer(r) && String(r.fechadoEm||'') < lim;
  const t=semAcento(f.txt).trim();
  const base=all.filter(r=>!velho(r) && (!f.meus || r.boUid===S.me.uid) && (!f.msg || msgPorLer(r))
    && (!t || semAcento([atNum(r), r.numero, r.cliente?.nome, r.cliente?.nif, r.assunto, r.subAssunto, r.conta, r.msisdns, r.vendedorNome, r.descricao].join(' ')).includes(t)));
  const cnt={}; base.forEach(r=>cnt[r.estado]=(cnt[r.estado]||0)+1);
  const rows=base.filter(r=>!f.estado || r.estado===f.estado), nMsg=all.filter(msgPorLer).length;
  $('#main').innerHTML=`
    <div class="chips"><div class="chip ${!f.estado?'on':''}" data-e=""><span class="muted">Todas</span><b>${base.length}</b></div>
      ${AT_ESTADOS.map(e=>`<div class="chip ${f.estado===e?'on':''}" data-e="${esc(e)}"><span class="muted">${esc(e)}</span><b>${cnt[e]||0}</b></div>`).join('')}</div>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="at-q" type="search" autocomplete="off" name="pesquisa-at" placeholder="Procurar nº, cliente, NIF, conta, número, assunto…" value="${esc(f.txt)}" style="max-width:340px">
        <button class="btn" id="at-r" title="Volta a ler a lista agora.">⟳ Atualizar</button>
        <button class="btn" id="at-h" title="Procura em todas as Atividades, incluindo as antigas, por nº, NIF ou número (MSISDN) exatos">Procurar no histórico</button>
        <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)">Fechadas em <input id="at-m" type="month" value="${esc(AT.mes)}" style="width:160px"></label>
        <label style="display:flex;gap:6px;align-items:center;margin:0;color:${nMsg?'var(--red-d)':'var(--ink)'};font-weight:${nMsg?700:400}"><input type="checkbox" id="at-fm" ${f.msg?'checked':''}> 💬 Mensagens por ler (${nMsg})</label>
        ${isBO()?`<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="at-me" ${f.meus?'checked':''}> Só as minhas</label>`:''}
        <span class="sp"></span><button class="btn pri" id="at-nv">+ Nova Atividade</button>
      </div>
      <div class="scroll"><table id="at-t"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Assunto</th><th>Vendedor</th><th>BO</th><th>Estado</th><th class="num">Dias em aberto</th></tr></thead>
        <tbody>${rows.map(r=>{ const dd=atDias(r), ab=AT_ABERTAS.includes(r.estado); return `<tr class="click" data-id="${esc(r.id)}"><td><b>${atNum(r)}</b>${msgPorLer(r)?' <span class="rp-m" title="Mensagem por ler" style="color:var(--red)">💬</span>':''}</td><td>${fmtD(r.data)}</td><td>${esc(r.cliente?.nome)}<div class="muted" style="font-size:11px">${esc(r.cliente?.nif)}</div></td><td>${esc(r.assunto)}<div class="muted" style="font-size:11px">${esc(r.subAssunto)}</div></td><td>${esc(r.vendedorNome)}</td><td>${esc(r.boNome||'—')}</td><td><span class="badge b-${esc((r.estado||'').replace(/ /g,'-'))}">${esc(r.estado)}</span>${r.motivo&&!['Concluído'].includes(r.estado)?` <span class="muted" style="font-size:11px">${esc(String(r.motivo).slice(0,60))}</span>`:''}</td><td class="num" ${ab&&dd>=AT_DIAS_ALERTA?'style="color:var(--red-d);font-weight:700"':''}>${r.submetidoEm?dd:'—'}</td></tr>`; }).join('')||`<tr><td colspan="8" class="muted">Sem Atividades.</td></tr>`}</tbody></table></div></div>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ f.estado=c.dataset.e; atDesenhaLista(); });
  const q=$('#at-q'); q.oninput=()=>{ f.txt=q.value; clearTimeout(q._h); q._h=setTimeout(()=>{ atDesenhaLista(); const n=$('#at-q'); if(!n) return; n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
  $('#at-r').onclick=()=>atLista(true);
  $('#at-m').onchange=e=>{ if(e.target.value){ AT.mes=e.target.value; atLista(); } };
  $('#at-fm').onchange=e=>{ f.msg=e.target.checked; atDesenhaLista(); };
  const me=$('#at-me'); if(me) me.onchange=()=>{ f.meus=me.checked; atDesenhaLista(); };
  $('#at-nv').onclick=()=>go('#/atividades/novo');
  $('#at-h').onclick=async()=>{ const x=(f.txt||'').trim(); if(x.length<1) return toast('Escreva na caixa de pesquisa o nº da Atividade, o NIF ou o número (MSISDN) completos.',true);
    const col=collection(db,'atividades'), meu=stf?[]:[where('vendedorUid','==',S.me.uid)], qs=[query(col, ...meu, where('cliente.nif','==',x))];
    const n=x.replace(/^a/i,''); if (/^\d+$/.test(n)) qs.push(query(col, ...meu, where('numero','==',+n)));
    if (normMsisdn(x).length>=9 && /^[\d\s+]+$/.test(x)) qs.push(query(col, ...meu, where('msisdnsL','array-contains',normMsisdn(x))));
    const rs=await Promise.allSettled(qs.map(q=>getDocs(q))), docs=rs.filter(y=>y.status==='fulfilled').flatMap(y=>y.value.docs).map(d=>({id:d.id, ...d.data()}));
    if (!docs.length) return toast('Nada encontrado no histórico com “'+x+'”.',true);
    AT.extra=[...(AT.extra||[]).filter(y=>!docs.some(d=>d.id===y.id)), ...docs]; const mp={}; [...AT.lista, ...docs].forEach(y=>mp[y.id]=y); AT.lista=Object.values(mp).sort((a,b)=>(b.numero||0)-(a.numero||0));
    f.txt=''; f.estado=''; toast(docs.length+' Atividade(s) encontrada(s) no histórico.'); atDesenhaLista(); };
  document.querySelectorAll('#at-t tr[data-id]').forEach(tr=>tr.onclick=()=>go('#/atividades/'+tr.dataset.id));
}
async function atAbrir(id){
  const m=$('#main');
  if (AT.cur?.id!==id) AT.tab='pedido';
  m.innerHTML=`<div class="card muted">A carregar…</div>`;
  try { const s=await getDoc(doc(db,'atividades',id)); if(!s.exists()) { m.innerHTML='<div class="card">Atividade não encontrada.</div>'; return; } AT.cur={id, ...s.data()}; }
  catch(e){ m.innerHTML=`<div class="card">${esc(errTxt(e))}</div>`; return; }
  S.dirty=false; atFicha();
}
function atPerms(){
  const r=AT.cur, own=r.vendedorUid===S.me.uid, nov=!r.id, fechada=AT_FECHADAS.includes(r.estado);
  return { own, nov, fechada, edV:(own||nov)&&AT_EDIT_COM.includes(r.estado), edBO:isBO()&&(!fechada||isMaster()) };
}
function atFicha(){
  const r=AT.cur, p=atPerms(), m=$('#main'), ed=p.edV||p.edBO, dV=ed?'':'disabled', dB=p.edBO?'':'disabled';
  const tabs=[['pedido','Pedido'],['anexos','Anexos'],['msg','Mensagens'+(msgPorLer(r)?' ● nova':'')],['hist','Histórico']];
  const acts=[];
  if (ed) acts.push(`<button class="btn" id="t-save">Guardar</button>`);
  if ((p.own||p.nov||isBO()) && r.estado==='Em Elaboração') acts.push(`<button class="btn pri" id="t-sub">Submeter à BackOffice</button>`);

function atValidar(r){
  const e=[]; if(!String(r.cliente?.nome||'').trim()) e.push('cliente'); if(String(r.cliente?.nif||'').replace(/\s/g,'').length<5) e.push('NIF');
  if(!r.assunto) e.push('assunto'); if(!r.subAssunto) e.push('sub-assunto');
  const d=String(r.descricao||'').trim(); if(d.length<10 || Object.values(AT_GUIA).includes(d)) e.push('descrição do pedido');
  if(r.assunto==='Correcção Implementação' && !String(r.pnNumero||'').trim()) e.push('PN relacionado');
  if(r.subAssunto==='Créditos' && !(parseFloat(r.valor)>0)) e.push('valor do crédito');
  return e;
}

// ---------- 9b. PRODUÇÃO BO (pontos e repartição do bolo mensal) ----------
// pontos por linha: implementar = impl · conferir = conf · cancelado/reprovado = canc · devolução = −impl × pen
const PESOS_DEF = {impl:2, conf:1, canc:2, pen:1.5, ativ:2};
let PROD_MES = null;
function calcProducao(fechados, comDev, mes, P, bolo, ativs=[]){
  const L = {}; const row = (uid,nome) => (L[uid] = L[uid] || {uid, nome:nome||userNome(uid)||'—', li:0, lc:0, lx:0, nd:0, ld:0, la:0});
  bos().forEach(b=>row(b.uid,b.nome));
  fechados.forEach(r=>{ const n=r.nLinhas||0;
    if (r.estado==='PN') { const iu=r.implPorUid||r.boUid; if(iu) row(iu, r.implPorNome||r.boNome).li+=n; if(r.conferidoPorUid) row(r.conferidoPorUid, r.conferidoPorNome).lc+=n; }
    else if (['Cancelado','Reprovado'].includes(r.estado) && r.boUid) row(r.boUid, r.boNome).lx+=n; });
  ativs.forEach(a=>{ if (AT_PONTUAM.includes(a.estado) && a.boUid) row(a.boUid, a.boNome).la++; });   // atividades tratadas (concluídas ou recusadas)
  const devs=[];
  comDev.forEach(r=>(r.devolucoes||[]).forEach((d,i)=>{ if(d.mes!==mes) return; devs.push({...d, i, rpnId:r.id, numero:r.numero, cliente:r.cliente?.nome||''});
    if(!d.anulada && d.aUid){ const x=row(d.aUid,d.aNome); x.nd++; x.ld+=d.linhas||0; } }));
  const linhas = Object.values(L).map(x=>({...x, pts: x.li*P.impl + x.lc*P.conf + x.lx*P.canc + x.la*(P.ativ||0) - x.ld*P.impl*P.pen}));
  const tot = linhas.reduce((a,x)=>a+Math.max(0,x.pts),0);
  linhas.forEach(x=>{ x.parte = tot ? Math.max(0,x.pts)/tot : 0; x.valor = Math.round(bolo*x.parte*100)/100; });
  linhas.sort((a,b)=>b.pts-a.pts || a.nome.localeCompare(b.nome));
  devs.sort((a,b)=>String(a.em).localeCompare(String(b.em)));
  return {linhas, devs, tot};
}

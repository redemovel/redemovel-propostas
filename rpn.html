// ---- importação única dos PN do PHC (histórico) ----
const PN_COLS = ["ftstamp", "fno", "fdata", "no", "nome", "ncont", "vendedor", "vendnm", "u_noportun", "u_ssfid", "u_ftstatus", "u_tpactivo", "lordem", "ref", "design", "score", "rlmc", "u_natureza", "u_pzperm", "u_contrvdf", "u_oport", "u_pricplan", "u_descont", "u_tipotarv", "msisdn", "conta", "tipo", "loja", "morada", "local", "codpost", "contacto", "email", "telefone", "rpn_no", "rpn_status", "rpn_bo", "rpn_notas", "rpn_resumo", "rpn_log", "rpn_interloc", "rpn_tel", "rpn_email", "rpn_ent1", "rpn_ent2", "rpn_entloc", "rpn_entcp", "rpn_pzperm", "rpn_loja", "rpn_ctgsm", "rpn_ctdados", "rpn_ctadsl", "rpn_ctgsm2", "rpn_novaconta", "rpn_pnesp", "rpn_aprovga", "rpn_novonif", "rpn_desconto", "rpn_subsidi", "rpn_infrisco"];
const PN_SQL = "-- Redemóvel · exportação dos Processos de Negócio (PN) do PHC para a plataforma\n-- v3: com MSISDN, conta, morada, contacto, email e os dados do dossier de origem (Registo PN): notas, resumo do negócio, BackOffice, contas\n-- Série 20 \"Processos Negócio\", desde 01/10/2022 (48 meses). Uma linha por cada linha do PN; a linha \"DPN\" é ignorada.\nUSE ARPURO;\nSELECT\n  RTRIM(ft.ftstamp) AS ftstamp,\n  CAST(ft.fno AS int) AS fno,\n  CONVERT(varchar(10), ft.fdata, 120) AS fdata,\n  CAST(ft.no AS int) AS no,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.nome,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS nome,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.ncont,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS ncont,\n  CAST(ft.vendedor AS int) AS vendedor,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft.vendnm,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS vendnm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_noportun,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_noportun,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_ssfid,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_ssfid,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_ftstatus,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_ftstatus,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(ft2.u_tpactivo,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_tpactivo,\n  CAST(ISNULL(fi.lordem,0) AS int) AS lordem,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.ref,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS ref,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.design,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS design,\n  CAST(ISNULL(fi.qtt,0) AS varchar(20)) AS score,\n  CAST(ISNULL(fi.u_qtt,0) AS varchar(20)) AS rlmc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_natureza,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_natureza,\n  CAST(ISNULL(fi.u_pzperm,0) AS int) AS u_pzperm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_contrvdf,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_contrvdf,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_oport,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_oport,\n  CAST(ISNULL(fi.u_pricplan,0) AS varchar(20)) AS u_pricplan,\n  CAST(ISNULL(fi.u_descont,0) AS int) AS u_descont,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.u_tipotarv,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS u_tipotarv,\n  CASE WHEN RTRIM(ISNULL(fi.fifref,'')) <> '' THEN REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.fifref,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') ELSE REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.serie,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') END AS msisdn,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(fi.lobs2 AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS conta,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.usr5,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS tipo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.ficcusto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS loja,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.morada,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS morada,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.local,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS local,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.codpost,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS codpost,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.contacto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS contacto,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.email,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS email,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(fi.telefone,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS telefone,\n  CAST(ISNULL(bo.obrano,0) AS int) AS rpn_no,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.tabela1,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_status,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.u_motivobo,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_bo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo.obstab2 AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_notas,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo2.u_resnego AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_resumo,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(CAST(bo.u_zrela AS varchar(4000)),'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_log,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.cobranca,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_interloc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.ean,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_tel,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.dprocesso,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_email,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab1,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ent1,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab2,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ent2,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab3,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_entloc,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.trab4,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_entcp,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.segmento,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_pzperm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo.ccusto,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_loja,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctgsm,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctgsm,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctdados,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctdados,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_ctadsl,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctadsl,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_contad,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_ctgsm2,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_nconta,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_novaconta,\n  CAST(ISNULL(bo2.u_pnesp,0) AS int) AS rpn_pnesp,\n  CAST(ISNULL(bo2.u_aprovga,0) AS int) AS rpn_aprovga,\n  CAST(ISNULL(bo2.u_novonif,0) AS int) AS rpn_novonif,\n  CAST(ISNULL(bo2.u_desconto,0) AS varchar(20)) AS rpn_desconto,\n  CAST(ISNULL(bo2.u_subsidi,0) AS varchar(20)) AS rpn_subsidi,\n  REPLACE(REPLACE(REPLACE(RTRIM(ISNULL(bo2.u_infrisco,'')),CHAR(9),' '),CHAR(13),' '),CHAR(10),' ') AS rpn_infrisco\nFROM ft\nJOIN ft2 ON ft2.ft2stamp = ft.ftstamp\nLEFT JOIN fi ON fi.ftstamp = ft.ftstamp AND fi.ref <> 'DPN' AND fi.ref <> ''\nOUTER APPLY (SELECT TOP 1 bi.bostamp FROM fi f2 JOIN bi ON bi.bistamp = f2.bistamp\n             WHERE f2.ftstamp = ft.ftstamp AND f2.bistamp <> '') lk\nLEFT JOIN bo  ON bo.bostamp = lk.bostamp\nLEFT JOIN bo2 ON bo2.bo2stamp = bo.bostamp\nWHERE ft.ndoc = 20 AND ft.fdata >= '20221001'\nORDER BY ft.fdata, ft.fno, fi.lordem;\n";
function lerFicheiroTexto(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error('Não foi possível ler o ficheiro'));
    r.onload=()=>{ const b=new Uint8Array(r.result); let t;
      if (b[0]===0xFF&&b[1]===0xFE) t=new TextDecoder('utf-16le').decode(b); else if (b[0]===0xFE&&b[1]===0xFF) t=new TextDecoder('utf-16be').decode(b);
      else { try{ t=new TextDecoder('utf-8',{fatal:true}).decode(b); }catch(e){ t=new TextDecoder('windows-1252').decode(b); } }
      res(t.replace(/^\uFEFF/,'')); };
    r.readAsArrayBuffer(file); });
}
// MSISDN normalizados (só dígitos, sem o 351) para a ligação ao RUN e para a pesquisa
const normMsisdn = v => { const d=String(v||'').replace(/\D/g,''); return d.length===12&&d.startsWith('351') ? d.slice(3) : d; };
const listaMsisdn = linhas => [...new Set((linhas||[]).map(l=>normMsisdn(l.msisdn)).filter(x=>x.length>=9))];
function pnParse(txt){
  const ls = txt.split(/\r?\n/).filter(l=>l.trim()); if(!ls.length) return {erro:'Ficheiro vazio'};
  let cols=PN_COLS, ini=0; const h=ls[0].split('\t').map(x=>x.trim().toLowerCase());
  if (h[0]==='ftstamp') { cols=h; ini=1; }
  const falta=PN_COLS.filter(c=>!cols.includes(c)); if (falta.length) return {erro:'Faltam colunas no ficheiro: '+falta.join(', ')};
  const porVend={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.vendedorPHC) porVend[String(u.vendedorPHC)]=uid; });
  const nrm = v => String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
  const porNome={}; Object.entries(S.users).forEach(([uid,u])=>{ if(u.nome) porNome[nrm(u.nome)]=uid; });
  const num=v=>parseFloat(String(v||'0').replace(',','.'))||0; const pn={}, mal=[];
  for (let i=ini;i<ls.length;i++){
    const c=ls[i].split('\t'); if (c.length!==cols.length) { mal.push(i+1); continue; }
    const o={}; cols.forEach((k,j)=>{ let v=(c[j]||'').trim(); if(v==='NULL') v=''; o[k]=v; });
    if (!o.ftstamp) { mal.push(i+1); continue; }
    const id='phc_'+o.ftstamp.replace(/[^A-Za-z0-9]/g,'_');
    const r = pn[id] = pn[id] || { numero:+o.fno||0, data:o.fdata, estado:'PN', origem:'PHC', phcStamp:o.ftstamp, motivos:[],
      vendedorUid: porVend[o.vendedor]||null, vendedorNome:o.vendnm, vendedorPHC:o.vendedor, subSfid:o.u_ssfid, nOportunidade:o.u_noportun, phcStatus:o.u_ftstatus, phcTipoActivo:o.u_tpactivo,
      boUid:porNome[nrm(o.rpn_bo)]||null, boNome:o.rpn_bo||'', rpnAgregado:false, clienteParticular:false, atividade:o.u_tpactivo||'Elegível/Carteira',
      notas:o.rpn_notas||'', loja:o.rpn_loja||o.loja||'', phcRpn:+o.rpn_no||null, phcRpnStatus:o.rpn_status||'', phcLog:o.rpn_log||'',
      condicoes:{pnEspecial:o.rpn_pnesp==='1', aprovacaoGA:o.rpn_aprovga==='1', novoNif:o.rpn_novonif==='1', desconto:num(o.rpn_desconto), subsidiacao:num(o.rpn_subsidi), reuniao:'', infoRisco:o.rpn_infrisco||'', resumo:o.rpn_resumo||''},
      contas:{gsm:o.rpn_ctgsm||'', dados:o.rpn_ctdados||'', adsl:o.rpn_ctadsl||'', gsm2:o.rpn_ctgsm2||'', novaConta:o.rpn_novaconta||''},
      cliente:{nome:o.nome, nCliente:o.no, nif:o.ncont.replace(/\s/g,''), email:o.email||o.rpn_email||'', interlocutor:o.rpn_interloc||o.contacto||'', telefone:o.rpn_tel||o.telefone||'', morada1:o.rpn_ent1||o.morada||'', morada2:o.rpn_ent2||'', localidade:o.rpn_entloc||o.local||'', codPostal:o.rpn_entcp||o.codpost||''},
      prazoPermanencia:parseInt(o.rpn_pzperm)||+o.u_pzperm||24, linhas:[], fechadoEm:o.fdata+'T12:00:00.000Z', fechadoMes:null, mesRef:o.fdata.slice(0,7), cargaContada:0, confContada:0 };
    if (o.ref) { const k=r.cliente; if(!k.email&&o.email) k.email=o.email; if(!k.interlocutor&&o.contacto) k.interlocutor=o.contacto; if(!k.morada1&&o.morada){ k.morada1=o.morada; k.localidade=o.local; k.codPostal=o.codpost; } if(!r.loja&&o.loja) r.loja=o.loja; }
    if (o.ref) r.linhas.push({ref:o.ref, designacao:o.design, natureza:o.u_natureza, msisdn:o.msisdn, nConta:o.conta, tipo:o.tipo, rlmc:num(o.rlmc), prazo:+o.u_pzperm||0, tier:o.u_tipotarv, pricingPlan:(o.u_pricplan==='0'?'':o.u_pricplan.replace(/\.0+$/,'')), descontinuado:o.u_descont==='1', upgrade:false, contratoVDF:o.u_contrvdf.toUpperCase(), oportunidade:o.u_oport, scorePHC:num(o.score)});
  }
  const lista = Object.entries(pn).map(([id,r])=>{ if (!r.condicoes.resumo && r.notas) { r.condicoes.resumo=r.notas; r.notas=''; r.phcResumoDeNotas=true; } r.nLinhas=r.linhas.length; r.totRLMC=Math.round(r.linhas.reduce((a,l)=>a+l.rlmc,0)*100)/100; r.totScore=Math.round(r.linhas.reduce((a,l)=>a+l.scorePHC,0)*1000)/1000;
    r.contratos=[...new Set(r.linhas.map(l=>l.contratoVDF).filter(Boolean))]; r.msisdns=listaMsisdn(r.linhas); return {id, ...r}; });
  return {lista, mal};
}
function admPN(el){
  let pend=null;
  el.innerHTML = `<div class="card"><h2>Importar os Processos de Negócio do PHC (histórico)</h2>
    <ol class="muted" style="font-size:13px;line-height:1.7;margin-top:0">
      <li>No SQL Server Management Studio, confirme que <b>Tools › Options › Query Results › SQL Server › Results to Grid › Include column headers when copying or saving the results</b> está marcado.</li>
      <li>Copie a consulta abaixo, cole numa janela <b>New Query</b> e carregue em <b>Execute</b>.</li>
      <li>Na grelha: botão direito › <b>Save Results As…</b>, tipo <b>Text (Tab delimited) (*.txt)</b>.</li>

    <div id="plog" style="margin-top:12px;font-family:monospace;font-size:12px;line-height:1.7;white-space:pre-wrap"></div>
    <p class="muted" style="font-size:12px;margin-bottom:0">Os PN importados ficam fechados, só de leitura, com o número do PHC e a marca “histórico PHC”. Não contam para a Produção BO. Repetir a importação não duplica: atualiza os mesmos processos.</p></div>`;
  const log=(t,err)=>{ const d=document.createElement('div'); d.textContent=t; if(err) d.style.color='var(--red-d)'; $('#plog').appendChild(d); };
  $('#pcp').onclick=()=>{ const t=$('#psql'); t.select(); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy')).finally(()=>toast('Consulta copiada.')); };
  $('#pan').onclick=async()=>{ const f=$('#pfi').files[0]; if(!f) return toast('Escolha primeiro o ficheiro exportado do PHC.',true);
    $('#plog').innerHTML=''; $('#pok').style.display='none'; pend=null;
    try { const r=pnParse(await lerFicheiroTexto(f)); if (r.erro) return log(r.erro,true);
      const L=r.lista, anos={}, semV={}; let nl=0, semC=0, semNif=0;
      L.forEach(p=>{ anos[p.data.slice(0,4)]=(anos[p.data.slice(0,4)]||0)+1; nl+=p.nLinhas; if(!p.vendedorUid) semV[p.vendedorNome||('vendedor '+p.vendedorPHC)]=(semV[p.vendedorNome||('vendedor '+p.vendedorPHC)]||0)+1; if(!p.cliente.nif) semNif++; semC+=p.linhas.filter(l=>!l.contratoVDF).length; });
      log(`${L.length} PN e ${nl} linhas no ficheiro.`);
      log('Por ano: '+Object.entries(anos).sort().map(([a,n])=>`${a}: ${n}`).join(' · '));
      log(`Linhas sem contrato VDF: ${semC} · linhas sem MSISDN: ${L.reduce((a,p)=>a+p.linhas.filter(l=>!l.msisdn).length,0)} · PN sem email do cliente: ${L.filter(p=>!p.cliente.email).length} · PN sem dossier de origem: ${L.filter(p=>!p.phcRpn).length} · com resumo do negócio: ${L.filter(p=>p.condicoes.resumo).length} (${L.filter(p=>p.phcResumoDeNotas).length} vindos da caixa de notas do PHC) · com notas para a BO: ${L.filter(p=>p.notas).length} · PN sem NIF: ${semNif} · PN sem linhas: ${L.filter(p=>!p.nLinhas).length}`);
      const sv=Object.entries(semV).sort((a,b)=>b[1]-a[1]); if (sv.length) log('PN de vendedores sem conta (só visíveis a Master/Coordenador/BO): '+sv.map(([n,c])=>`${n} (${c})`).join(', '), true);
      if (r.mal.length) log(`${r.mal.length} linha(s) do ficheiro com formato errado (ignoradas): ${r.mal.slice(0,15).join(', ')}`, true);
      if (!L.length) return;
      pend=L; log('Nada foi gravado ainda. Confira os números e carregue em “Confirmar importação”.');
      $('#pok').textContent=`Confirmar importação de ${L.length} PN`; $('#pok').style.display='';
    } catch(e){ log(errTxt(e),true); } };
  $('#pok').onclick=async()=>{ if(!pend) return; const L=pend; pend=null; $('#pok').style.display='none'; $('#pan').disabled=true;
    try { for (let i=0;i<L.length;i+=300){ const b=writeBatch(db);
        L.slice(i,i+300).forEach(({id,...r})=>b.set(doc(db,'rpn',id),{...r, importadoEm:serverTimestamp(), importadoPor:S.me.uid}));
        await b.commit(); log(`gravados: ${Math.min(i+300,L.length)} / ${L.length}`); }
      log('Importação terminada.'); toast('PN importados.'); $('#pfi').value='';
    } catch(e){ log('ERRO: '+errTxt(e)+' — pode repetir a importação, não duplica.',true); }
    $('#pan').disabled=false; };

// Catálogo: colar export PHC (Sub_familia | Referencia | Designacao | Tipo_tarif | Pricingplan | Descontinuado)
function parseCatalogo(txt){
  const out=[], seen=new Set();
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    let c = line.includes('\t') ? line.split('\t') : line.split(/\s{2,}/);
    c = c.map(x=>x.trim()); while(c.length && c[0]==='') c.shift(); while(c.length && c.at(-1)==='') c.pop();
    if (c.length<6) return;
    const [sub,ref,des,tier,pp,dsc] = c;
    if (/^sub_?famil/i.test(sub) || !ref) return;
    const ppn = parseFloat(String(pp).replace(/\./g,'').replace(',','.'))||0;
    const T = {gold:'Gold',silver:'Silver',bronze:'Bronze',estanho:'Estanho'}[tier.toLowerCase()]||tier;
    const key = ref.toUpperCase(); if (seen.has(key)) return; seen.add(key);
    out.push({ref, designacao:des, subfamilia:sub, tier:T, pricingPlan: ppn?String(Math.round(ppn)):'', descontinuado:/^s/i.test(dsc), categoria: /^fixo/i.test(sub)?'Fixo':'Móvel'});
  });
  return out;
}
// Composições: colar export PHC (Composta | Filha | Pct | Designacao | Familia | Inativo | Sub_famili | Tipo_tarif | Princigpla | Descontinu)
function parseComposicoes(txt){
  const ls=txt.split(/\r?\n/).filter(l=>l.trim()); if(ls.length<2) return null;
  const h=ls[0].split('\t').map(x=>semAcento(x).trim()), col=n=>h.findIndex(x=>x.startsWith(n));
  const ix={c:col('composta'),f:col('filha'),p:col('pct'),d:col('designac'),i:col('inativo'),s:col('sub'),t:col('tipo'),pp:col('princ'),ds:col('descont')};
  if(ix.pp<0) ix.pp=col('pricing'); if(ix.c<0||ix.f<0||ix.p<0) return null;
  const g={};
  ls.slice(1).forEach(l=>{ const c=l.split('\t').map(x=>x.trim()), comp=c[ix.c], ref=c[ix.f]; if(!comp||!ref) return;
    const tier=c[ix.t]||'', sub=c[ix.s]||'', ppn=parseFloat(String(c[ix.pp]||'').replace(/\./g,'').replace(',','.'))||0;
    (g[comp]=g[comp]||[]).push({ref, pct:parseFloat(String(c[ix.p]).replace(',','.'))||0,
      prod:{ref, designacao:c[ix.d]||ref, subfamilia:sub==='-'?'':sub, tier:{gold:'Gold',silver:'Silver',bronze:'Bronze',estanho:'Estanho'}[tier.toLowerCase()]||tier, pricingPlan:ppn?String(Math.round(ppn)):'', descontinuado:/^s/i.test(c[ix.ds]||''), categoria:/^fixo/i.test(sub)?'Fixo':'Móvel', inativo:/^(1|s|true)/i.test(c[ix.i]||'')}}); });
  const ok=[], fora=[], novas={};
  Object.entries(g).forEach(([comp,fs])=>{ const soma=Math.round(fs.reduce((a,f)=>a+f.pct,0)*1000)/1000, pai=S.prodMap[comp.toUpperCase()];
    if(!pai) return fora.push(`${comp}: a referência composta não existe no catálogo`);
    if(Math.abs(soma-1)>0.005) return fora.push(`${comp}: as percentagens somam ${(soma*100).toLocaleString('pt-PT')}% (não é um bundle repartido)`);
    if(fs.some(f=>f.ref.toUpperCase()===comp.toUpperCase())) return fora.push(`${comp}: contém-se a si própria`);
    fs.forEach(f=>{ if(!S.prodMap[f.ref.toUpperCase()]) novas[f.ref.toUpperCase()]=f.prod; });
    ok.push({ref:pai.ref, composicao:fs.map(f=>({ref:(S.prodMap[f.ref.toUpperCase()]||f.prod).ref, pct:f.pct}))}); });
  return {ok, fora, novas:Object.values(novas)};
}
const prodId = ref => ref.toUpperCase().replace(/[\/\s]+/g,'_').replace(/^\.+$/,'_')||'_';
function admCat(el){
  el.innerHTML = `<div class="card"><h2>Importar / atualizar catálogo</h2>

    <div class="row" style="margin-top:8px"><button class="btn" id="cp">Pré-visualizar</button><button class="btn pri" id="ci" disabled>Importar</button><span id="cs" class="muted"></span></div>
    <div id="cprev" class="scroll" style="max-height:260px;margin-top:8px"></div></div>
    <div class="card"><h2>Importar composições (bundles)</h2>
    <p class="muted" style="margin-top:0">Cole o export das composições do PHC, com a linha de títulos <b>Composta · Filha · Pct · Designacao · Familia · Inativo · Sub_famili · Tipo_tarif · Princigpla · Descontinu</b>. As filhas que faltarem no catálogo são criadas (as inativas no PHC ficam marcadas como inativas). No RPN, uma linha com a referência composta abre nas filhas.</p>
    <textarea id="bt" rows="6" placeholder="Colar aqui…"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="bp">Pré-visualizar</button><button class="btn pri" id="bi" disabled>Importar</button><span id="bs" class="muted"></span></div>
    <div id="bprev" style="margin-top:8px;font-size:13px"></div></div>
    <div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Catálogo atual (${S.prodList.length})</h2><span class="sp"></span><input id="cf" placeholder="Filtrar…" style="max-width:260px"></div>
    <div class="scroll" style="max-height:480px" id="clist"></div></div>`;
  const tbl = rows => `<table><thead><tr><th>Sub-fam.</th><th>Referência</th><th>Designação</th><th>Tier</th><th>PricingPlan</th><th>Desc.</th><th>Categoria</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.subfamilia)}</td><td>${esc(p.ref)}</td><td>${esc(p.designacao)}</td><td>${esc(p.tier)}</td><td>${esc(p.pricingPlan)||'<span style="color:var(--red-d)">em falta</span>'}</td><td>${p.descontinuado?'SIM':''}</td><td>${esc(p.categoria)}</td></tr>`).join('')}</tbody></table>`;
  const drawList = () => { const f=($('#cf').value||'').toLowerCase(); $('#clist').innerHTML = tbl(S.prodList.filter(p=>!f||(p.ref+' '+p.designacao+' '+p.tier).toLowerCase().includes(f))); };
  $('#cf').oninput = drawList; drawList();
  let parsed=[];
  $('#cp').onclick=()=>{ parsed=parseCatalogo($('#ct').value); const novos=parsed.filter(p=>!S.prodMap[p.ref.toUpperCase()]).length, semPP=parsed.filter(p=>!p.pricingPlan).length;
    $('#cs').textContent = `${parsed.length} referências lidas · ${novos} novas · ${parsed.length-novos} a atualizar${semPP?` · ${semPP} sem PricingPlan`:''}`;
    $('#cprev').innerHTML = tbl(parsed); $('#ci').disabled = !parsed.length; };
  let cz=null;
  $('#bp').onclick=()=>{ cz=parseComposicoes($('#bt').value);
    if(!cz){ $('#bs').textContent='Não reconheci as colunas. A 1ª linha tem de ter os títulos (Composta, Filha, Pct…).'; $('#bi').disabled=true; $('#bprev').innerHTML=''; return; }
    $('#bs').textContent=`${cz.ok.length} bundle(s) · ${cz.novas.length} filha(s) a criar no catálogo${cz.fora.length?` · ${cz.fora.length} de fora`:''}`;
    $('#bprev').innerHTML=(cz.fora.length?`<div class="warnbox"><b>Ficam de fora:</b><br>${cz.fora.map(esc).join('<br>')}</div>`:'')
      +`<div class="scroll" style="max-height:260px"><table><thead><tr><th>Composta</th><th>Filhas</th></tr></thead><tbody>${cz.ok.map(b=>`<tr><td><b>${esc(b.ref)}</b></td><td>${b.composicao.map(c=>esc(c.ref)+' '+(Math.round(c.pct*1000)/10).toLocaleString('pt-PT')+'%').join(' + ')}</td></tr>`).join('')}</tbody></table></div>`
      +(cz.novas.length?`<p class="muted" style="margin-bottom:0">Filhas a criar: ${cz.novas.map(n=>esc(n.ref)+(n.inativo?' (inativa)':'')).join(', ')}</p>`:'');
    $('#bi').disabled=!cz.ok.length; };
  $('#bi').onclick=async()=>{ $('#bi').disabled=true;

      for (let i=0;i<ops.length;i+=400){ const b=writeBatch(db); ops.slice(i,i+400).forEach(([ref,d])=>b.set(doc(db,'produtos',prodId(ref)),d,{merge:true})); await b.commit(); }
      toast(`${cz.ok.length} bundle(s) importados · ${cz.novas.length} filha(s) criadas.`); await loadProdutos(true); await catalogoMudou(); admCat(el);
    } catch(e){ toast(errTxt(e),true); $('#bi').disabled=false; } };
  $('#ci').onclick=async()=>{ $('#ci').disabled=true;
    try { for (let i=0;i<parsed.length;i+=400){ const b=writeBatch(db); parsed.slice(i,i+400).forEach(p=>b.set(doc(db,'produtos',prodId(p.ref)),{...p,atualizadoEm:serverTimestamp()},{merge:true})); await b.commit(); }
      toast(`${parsed.length} referências importadas.`); await loadProdutos(true); await catalogoMudou(); admCat(el);
    } catch(e){ toast(errTxt(e),true); $('#ci').disabled=false; } };

async function admCarga(el){
  const [cs,cn] = await Promise.all([getDoc(doc(db,'config','cargaBO')), getDoc(doc(db,'counters','rpn'))]);
  const carga = cs.data()?.carga||{}, conf = cs.data()?.conf||{}, aus = cs.data()?.ausentes||{};
  el.innerHTML = `<div class="card"><h2>Carga atual das BackOffices</h2><p class="muted" style="margin-top:0">Implementação: linhas em RPNs abertos (Submetido, Em Implementação, Pendentes). Conferência: linhas em RPNs “Em Conferência”. Cada RPN vai para a BO presente com menor carga; em empate, sorteio. Quem implementou nunca confere. As ausências marcam-se na lista de RPN, em “Ausências · redistribuir”.</p>
    <table style="max-width:680px"><thead><tr><th>BackOffice</th><th class="num">A implementar</th><th class="num">A conferir</th><th>Situação</th></tr></thead><tbody>${bos().map(b=>`<tr><td>${esc(b.nome)}</td><td class="num">${carga[b.uid]||0}</td><td class="num">${conf[b.uid]||0}</td><td>${aus[b.uid]?'Ausente':'Presente'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhuma BO marcada com “Recebe RPN”.</td></tr>'}</tbody></table>
    <button class="btn" id="rc" style="margin-top:12px">Recalcular a partir dos RPN</button></div>
    <div class="card"><h2>Numeração</h2><div class="row"><div style="width:200px"><label>Próximo nº de RPN</label><input type="number" id="nx" value="${cn.data()?.next||1}"></div><button class="btn" id="nxs" style="align-self:end">Guardar</button></div>
    <p class="muted" style="font-size:12px">Sugestão: começar acima da numeração do sistema atual para evitar confusões (ex.: 60001).</p></div>`;
  $('#nxs').onclick=async()=>{ const v=parseInt($('#nx').value); if(!(v>0)) return; try{ await setDoc(doc(db,'counters','rpn'),{next:v}); toast('Numeração atualizada.'); }catch(e){ toast(errTxt(e),true); } };
  $('#rc').onclick=async()=>{ try{ const s=await getDocs(query(collection(db,'rpn'), where('estado','in',EM_CURSO))); const c={}, cf={}; const b=writeBatch(db); let n=0;   // economia de leituras: só os processos em curso
      Object.keys(S.users).forEach(u=>{ c[u]=0; cf[u]=0; });
      s.forEach(d=>{ const r=d.data(); const cnt=(ABERTOS.includes(r.estado)&&r.boUid)?(r.nLinhas||0):0; if(cnt) c[r.boUid]=(c[r.boUid]||0)+cnt;
        const cc=(r.estado==='Em Conferência'&&r.confUid)?(r.nLinhas||0):0; if(cc) cf[r.confUid]=(cf[r.confUid]||0)+cc;
        if(((r.cargaContada||0)!==cnt || (r.confContada||0)!==cc) && n<450){ b.update(d.ref,{cargaContada:cnt,confContada:cc}); n++; }
      });
      (await getDocs(query(collection(db,'atividades'), where('estado','in',AT_CURSO)))).forEach(d=>{ const a=d.data(), cnt=(AT_ABERTAS.includes(a.estado)&&a.boUid)?1:0; if(cnt) c[a.boUid]=(c[a.boUid]||0)+1;
        if((a.cargaContada||0)!==cnt && n<450){ b.update(d.ref,{cargaContada:cnt}); n++; } });
      b.set(doc(db,'config','cargaBO'),{carga:c,conf:cf,atualizadoEm:serverTimestamp()},{merge:true}); await b.commit(); toast('Carga recalculada.'); admCarga(el); }catch(e){ toast(errTxt(e),true); } };
}
